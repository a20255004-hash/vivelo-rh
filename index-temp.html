N.outcome = function(res, opts){
  const fx = Object.entries(res.fx || {}).filter(([, v]) => v).map(([k, v]) => { const m = METRICS.find(x => x[0] === k); return `<span class="chip ${v > 0 ? "ok" : "bad"}">${m ? m[1] : k} ${v > 0 ? "+" : ""}${v}</span>`; }).join("");
  return `<section class="outcome" aria-live="polite"><div class="outcome-head q-${res.q}">${A.icon(res.q === "buena" ? "check" : res.q === "riesgosa" ? "x" : "arrow")}<span>${A.qLabel[res.q]}</span></div><div class="outcome-body">${res.out ? `<div><span class="label">Lo que pasó</span><p>${res.out}</p></div>` : ""}${fx && !(opts && opts.nofx) ? `<div class="fx">${fx}</div>` : ""}${res.detail ? `<details class="more" ${opts && opts.open ? "open" : ""}><summary>Ver el detalle de tu respuesta</summary><div style="margin-top:10px">${res.detail}</div></details>` : ""}${res.pro ? `<div class="pro"><span class="label">Cómo lo razona una profesional</span><p>${res.pro}</p></div>` : ""}${opts && opts.next ? `<div class="row">${opts.next}</div>` : ""}</div></section>`;
};

/* ================= simulaciones ================= */
const vis = (n, st) => !(n.if && !st.flags.includes(n.if)) && !(n.ifnot && st.flags.includes(n.ifnot));
function curIdx(sim, st){ let i = st.i; while (i < sim.nodes.length && !vis(sim.nodes[i], st)) i++; return i; }
function visibleCount(sim, st){ return sim.nodes.filter(n => vis(n, st)).length; }

A.startSim = function(id){
  const sim = A.sim(id); sim.nodes.forEach(n => N.reset(n.id));
  A.S.active[id] = {i:0, m:Object.assign({}, START), flags:[], log:[], asked:{}, pending:null, at:Date.now()};
  A.S.debrief = null; A.save(); A.go("#sim." + id);
};

A.routes.sims = function(){
  const sims = LV.sims;
  const cards = sims.map(s => {
    const runs = (A.S.runs[s.id] || []).length, act = A.S.active[s.id];
    return `<a class="sim-card" href="#sim.${s.id}">
      ${runs ? `<span class="done chip ok">${A.icon("check")}Vivida${runs > 1 ? " ×" + runs : ""}</span>` : act ? `<span class="done chip st">En curso</span>` : ""}
      <span class="label">${s.mode === "semana" ? "Una semana" : "Un día"} · ${s.sector === "publico" ? "Sector público" : "Sector privado"} · ≈ ${s.mins} min</span>
      <h3 style="padding-right:80px">${esc(s.title)}</h3>
      <p class="small">${esc(s.hook)}</p>
      <p class="small muted">${esc(s.size)} · ${esc(s.place)}</p>
      <div class="meta">${s.areas.slice(0, 3).map(a => A.areaChip(a, false)).join("")}</div>
    </a>`;
  }).join("");
  const without = LV.roles.filter(r => !r.sim);
  return {title:"Simulador", eyebrow:"Un día en la vida de… · Una semana trabajando como…", lead:"Entra a un puesto, recibe sus correos, sus urgencias y sus documentos, y decide. Cada decisión tiene consecuencias en tu agenda, en la confianza de los jefes, en el cumplimiento legal, en las personas y en la calidad del resultado.",
    html:`<div class="callout"><b>Simulaciones construidas a partir de prácticas profesionales habituales.</b> Las organizaciones, personas y datos son ficticios; la normativa citada es real y vigente al 16 de octubre de 2026. No son testimonios.</div>
    <div class="sim-grid">${cards}</div>
    <section class="stack"><h2>Otros cargos para explorar con dilemas rápidos</h2><p class="muted small">Estos puestos aún no tienen simulación completa, pero puedes enfrentar sus decisiones típicas en su perfil.</p><div class="row">${without.map(r => `<a class="chip" href="#cargo.${r.id}" style="text-decoration:none">${esc(r.n)}</a>`).join("")}</div></section>`};
};

A.routes.sim = function(id){
  const sim = A.sim(id);
  if (!sim) return {title:"Simulación no encontrada", html:`<div class="empty">Vuelve al <a href="#sims">simulador</a>.</div>`};
  const st = A.S.active[id];
  if (st) return playView(sim, st);
  const runs = A.S.runs[id] || [];
  if (A.S.debrief === id && runs.length) return debriefView(sim, runs[runs.length - 1]);
  return briefView(sim, runs);
};

function briefView(sim, runs){
  return {eyebrow:(sim.mode === "semana" ? "Una semana trabajando como" : "Un día en la vida de") + " · " + (sim.sector === "publico" ? "Sector público" : "Sector privado"), title:esc(sim.title), docTitle:sim.title, lead:esc(sim.hook),
    html:`<div class="split"><div class="stack-lg">
      <section class="card stack"><span class="label">La organización</span><p>${sim.org}</p><p class="small muted">${esc(sim.size)} · ${esc(sim.place)}</p></section>
      <section class="card stack"><span class="label">Tu puesto</span><p>${esc(sim.you)}</p><span class="label">Tu objetivo</span><p>${esc(sim.goal)}</p></section>
      <section class="card stack"><span class="label">Restricciones reales</span><ul style="margin:0;padding-left:1.2rem;display:grid;gap:4px">${sim.limits.map(l => `<li>${esc(l)}</li>`).join("")}</ul></section>
    </div><aside class="stack-lg">
      <section class="card stack"><span class="label">Personas con las que trabajarás</span>${sim.people.map(p => `<div><b>${esc(p.n)}</b> · <span class="small">${esc(p.r)}</span><br><span class="small muted">${esc(p.d)}</span></div>`).join("")}</section>
      <section class="card stack"><span class="label">Cómo funciona</span><p class="small">Recibirás situaciones en orden. En algunas podrás pedir información antes de decidir (cuesta tiempo, como en la vida real). Cinco indicadores muestran el efecto de tus decisiones. Al final verás tu informe y registrarás cómo te sentiste.</p>
      <button type="button" class="btn stamp" data-start>${runs.length ? "Vivirlo de nuevo" : "Empezar"} ${A.icon("arrow")}</button>
      ${runs.length ? `<button type="button" class="btn ghost" data-last>Ver mi último informe (${A.fmtDate(runs[runs.length - 1].end)})</button>` : ""}</section>
      <section class="stack"><span class="label">Áreas que pone a prueba</span><div class="row">${sim.areas.map(a => A.areaChip(a)).join("")}</div></section>
    </aside></div>`,
    mount(root){ A.$("[data-start]", root).addEventListener("click", () => A.startSim(sim.id)); const l = A.$("[data-last]", root); if (l) l.addEventListener("click", () => { A.S.debrief = sim.id; A.save(); A.render(); }); }};
}

function gaugesHTML(m, prev){
  return `<div class="gauges">${METRICS.map(([k, n, d]) => { const v = m[k], p = prev ? prev[k] : v; const cls = v > p ? "up" : v < p ? "down" : ""; return `<div class="gauge ${cls}" title="${esc(d)}"><span>${n}</span><div class="bar"><i style="width:${v}%"></i></div><span class="mono">${v}</span></div>`; }).join("")}</div>`;
}

function playView(sim, st){
  const idx = curIdx(sim, st);
  if (idx >= sim.nodes.length) { finish(sim, st); return debriefView(sim, (A.S.runs[sim.id] || []).slice(-1)[0]); }
  const node = sim.nodes[idx];
  const total = visibleCount(sim, st);
  const doneN = st.log.length;
  const view = {head:false, docTitle:sim.title, html:"", mount:null};
  const draw = (root) => {
    const pend = st.pending && st.pending.nodeId === node.id ? st.pending : null;
    const asked = st.asked[node.id] || [];
    const box = A.$("#simbox", root);
    box.innerHTML = `
      <div class="sim-shell">
        <div class="stack-lg" style="min-width:0">
          ${N.head(node, {asked, answered:pend ? pend.res : null})}
          <div id="inter">${N.interaction(node, {answered:pend ? pend.res : null})}</div>
          ${pend ? N.outcome(pend.res, {next:`<button type="button" class="btn stamp" data-next>${idx + 1 >= sim.nodes.length || !sim.nodes.slice(idx + 1).some(n => vis(n, st)) ? "Terminar y ver mi informe" : "Continuar"} ${A.icon("arrow")}</button>`}) : ""}
        </div>
        <aside class="side">
          <div class="card stack"><span class="label">${sim.mode === "semana" ? "Día y hora" : "Hora"}</span><span class="clock">${esc(node.t || "")}</span><div class="progress-dots" aria-label="Avance">${Array.from({length:total}, (_, i) => `<i class="${i < doneN ? "d" : i === doneN ? "c" : ""}"></i>`).join("")}</div><span class="small muted">Situación ${Math.min(doneN + 1, total)} de ${total}</span></div>
          <div class="card stack"><span class="label">Indicadores</span>${gaugesHTML(st.m, pend ? pend.prev : null)}</div>
          ${st.log.length ? `<details class="card more"><summary>Tu cuaderno (${st.log.length})</summary><div class="stack small" style="margin-top:8px">${st.log.map(l => `<div><span class="chip ${A.qChip[l.q]}">${esc(l.t || "")}</span> ${esc(l.title)}</div>`).join("")}</div></details>` : ""}
          <button type="button" class="btn ghost sm" data-quit>Salir y continuar después</button>
          <div data-restartbox><button type="button" class="btn ghost sm" data-restart>Reiniciar esta simulación</button></div>
        </aside>
      </div>`;
    N.bind(box, node, {asked, onAsk:(oid) => { const a = st.asked[node.id] = st.asked[node.id] || []; if (a.includes(oid) || a.length >= node.ask.max) return; a.push(oid); st.m.agenda = A.clamp(st.m.agenda - 2, 0, 100); A.save(); draw(root); }}, (res) => {
      const prev = Object.assign({}, st.m);
      Object.entries(res.fx || {}).forEach(([k, v]) => { st.m[k] = A.clamp((st.m[k] || 0) + v, 0, 100); });
      (res.set || []).forEach(f => { if (!st.flags.includes(f)) st.flags.push(f); });
      const keep = Object.assign({}, res); delete keep.fx;
      st.log.push({id:node.id, t:node.t, title:node.title, q:res.q, label:res.label, out:res.out, pro:res.pro, sig:res.sig, tags:res.tags, asked:(st.asked[node.id] || []).length, score:res.score});
      st.pending = {nodeId:node.id, res, prev};
      A.save(); draw(root);
      const oc = A.$(".outcome", root); if (oc) oc.scrollIntoView({behavior:"smooth", block:"start"});
    }, () => draw(root));
    const nx = A.$("[data-next]", box);
    if (nx) nx.addEventListener("click", () => { st.pending = null; st.i = idx + 1; A.save(); A.render(); });
    A.$("[data-quit]", box).addEventListener("click", () => A.go("#sims"));
    A.$("[data-restart]", box).addEventListener("click", () => {
      const rb = A.$("[data-restartbox]", box);
      rb.innerHTML = `<div class="callout warn small stack"><span>¿Reiniciar? Perderás el avance de esta partida (los informes anteriores se conservan).</span><div class="row"><button type="button" class="btn sm" data-yes>Sí, reiniciar</button><button type="button" class="btn ghost sm" data-no>Cancelar</button></div></div>`;
      A.$("[data-yes]", rb).addEventListener("click", () => A.startSim(sim.id));
      A.$("[data-no]", rb).addEventListener("click", () => draw(root));
    });
  };
  view.html = `<div class="row" style="justify-content:space-between"><div class="stack" style="gap:2px"><span class="label">${sim.mode === "semana" ? "Una semana como" : "Un día como"} · ${sim.sector === "publico" ? "Sector público" : "Sector privado"}</span><h2>${esc(sim.title.replace(/^Un día como |^Una semana como /, ""))}</h2></div><a class="btn ghost sm" href="#sims">${A.icon("back")}Simulador</a></div><div id="simbox"></div>`;
  view.mount = draw;
  return view;
}

function finish(sim, st){
  const run = {at:st.at, end:Date.now(), m:st.m, log:st.log, flags:st.flags};
  const runs = A.S.runs[sim.id] = A.S.runs[sim.id] || [];
  runs.push(run); if (runs.length > 5) runs.splice(0, runs.length - 5);
  delete A.S.active[sim.id];
  A.S.debrief = sim.id;
  sim.nodes.forEach(n => N.reset(n.id));
  A.save();
}

function debriefView(sim, run){
  const qc = {buena:0, aceptable:0, riesgosa:0}; run.log.forEach(l => qc[l.q]++);
  const sig = {}; run.log.forEach(l => Object.entries(l.sig || {}).forEach(([k, v]) => { sig[k] = (sig[k] || 0) + v; }));
  const top = Object.entries(sig).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]).slice(0, 3);
  const asked = run.log.filter(l => l.asked > 0).length;
  const refl = A.S.refl.find(r => r.kind === "sim" && r.ref === sim.id && r.run === run.end);
  const tags = Array.from(new Set(run.log.flatMap(l => l.tags || [])));
  const form = {enjoy:0, see:0, energy:0, repeat:[], avoid:[], note:""};
  return {head:false, docTitle:"Informe · " + sim.title, html:`
    <div class="row" style="justify-content:space-between;align-items:flex-start"><div class="stack" style="gap:6px;max-width:60ch"><span class="label">Informe de la experiencia · ${A.fmtDate(run.end)}</span><h1>${esc(sim.title)}</h1><p class="muted">Este informe muestra lo que pasó con tus decisiones y cómo las razonaría una profesional con experiencia. Los aciertos y errores son aprendizaje; no se usan para medir tu compatibilidad con el área.</p></div><span class="stampmark stamp-anim">Experiencia<br>registrada<br><small>${A.fmtDate(run.end)}</small></span></div>
    <div class="grid g3">
      <section class="card stack"><span class="label">Indicadores al cierre</span>${gaugesHTML(run.m, START)}<p class="small muted">Comparados con el inicio del día.</p></section>
      <section class="card stack"><span class="label">Tus decisiones</span><div class="row"><span class="chip ok">${qc.buena} sólidas</span><span class="chip warn">${qc.aceptable} discutibles</span><span class="chip bad">${qc.riesgosa} riesgosas</span></div><p class="small">Pediste información antes de decidir en <b>${asked}</b> ${asked === 1 ? "situación" : "situaciones"}. ${asked ? "Buscar datos antes de actuar es un hábito profesional." : "La próxima vez prueba a pedir información: muchas decisiones cambian con un dato más."}</p></section>
      <section class="card stack"><span class="label">Tu forma de decidir hoy</span>${top.length ? top.map(([k]) => { const t = A.trait(k); return `<div><b>${t.n}</b><br><span class="small muted">${t.d}</span></div>`; }).join("") : `<p class="small muted">Sin un patrón claro en esta partida.</p>`}</section>
    </div>
    <section class="stack"><h2>El día, decisión por decisión</h2><div class="timeline">${run.log.map(l => `<div class="tl q-${l.q}"><span class="t">${esc(l.t || "")}</span><b>${esc(l.title)}</b><span class="small"><span class="chip ${A.qChip[l.q]}">${A.qLabel[l.q]}</span> ${esc((l.label || "").slice(0, 220))}${(l.label || "").length > 220 ? "…" : ""}</span>${l.out ? `<span class="small muted">${l.out}</span>` : ""}${l.pro ? `<details class="more small"><summary>Cómo lo razona una profesional</summary><p style="margin-top:6px">${l.pro}</p></details>` : ""}</div>`).join("")}</div></section>
    <section class="card stack" id="reflbox">${refl ? reflDone(refl) : reflForm(tags)}</section>
    <div class="row"><button type="button" class="btn stamp" data-again>Vivirlo de nuevo</button><a class="btn ghost" href="#sims">Otra simulación</a><a class="btn ghost" href="#brujula">Ver mi brújula</a></div>`,
    mount(root){
      A.$("[data-again]", root).addEventListener("click", () => A.startSim(sim.id));
      const box = A.$("#reflbox", root);
      if (!refl) bindRefl(box, form, tags, () => {
        const r = {at:Date.now(), kind:"sim", ref:sim.id, run:run.end, enjoy:form.enjoy, see:form.see, energy:form.energy, repeat:form.repeat, avoid:form.avoid, note:form.note.slice(0, 600)};
        A.S.refl.push(r); A.save(); box.innerHTML = reflDone(r); A.toast("Registrado en tu bitácora");
      });
    }};
}
function reflForm(tags){
  return `<span class="label">Bitácora personal</span><h2>¿Cómo te sentiste?</h2><p class="small muted">Esto es lo que más pesa en tu brújula: tu experiencia, no tus aciertos.</p>
  <div class="field"><label>¿Cuánto disfrutaste esta experiencia?</label>${A.ratingRow("enjoy", 0)}<span class="small muted">1 = nada · 5 = muchísimo</span></div>
  <div class="field"><label>¿Te ves haciendo este trabajo todos los días?</label>${A.ratingRow("see", 0)}</div>
  <div class="field"><label>¿Cómo terminaste?</label><div class="togs">${[["3","Con energía"],["2","Neutral"],["1","Agotada"]].map(([v, l]) => `<button type="button" class="neu" data-energy="${v}" aria-pressed="false">${l}</button>`).join("")}</div></div>
  <div class="field"><label>Tareas que repetirías</label><div class="togs">${tags.map(t => `<button type="button" class="yes" data-rep="${t}" aria-pressed="false">${esc(A.task(t).n)}</button>`).join("")}</div></div>
  <div class="field"><label>Tareas que preferirías evitar</label><div class="togs">${tags.map(t => `<button type="button" class="no" data-avo="${t}" aria-pressed="false">${esc(A.task(t).n)}</button>`).join("")}</div></div>
  <div class="field"><label for="rnote">Una frase sobre lo que descubriste (opcional)</label><textarea id="rnote" style="min-height:70px" maxlength="600" placeholder="Ej.: Me gustó investigar, pero me agotó la presión del sindicato."></textarea></div>
  <div class="row"><button type="button" class="btn stamp" data-saverefl disabled>Guardar en mi bitácora</button><span class="small muted" data-reflhint>Califica las dos primeras preguntas para guardar.</span></div>`;
}
A.reflForm = reflForm;
function bindRefl(box, form, tags, onSave){
  const upd = () => { const ok = form.enjoy && form.see; A.$("[data-saverefl]", box).disabled = !ok; A.$("[data-reflhint]", box).hidden = !!ok; };
  A.bindRatings(box, form, upd);
  A.$$("[data-energy]", box).forEach(b => b.addEventListener("click", () => { form.energy = +b.dataset.energy; A.$$("[data-energy]", box).forEach(x => x.setAttribute("aria-pressed", String(x === b))); }));
  const tog = (attr, arr, other) => A.$$(`[data-${attr}]`, box).forEach(b => b.addEventListener("click", () => {
    const t = b.dataset[attr]; const i = form[arr].indexOf(t);
    if (i >= 0) form[arr].splice(i, 1); else { form[arr].push(t); const j = form[other].indexOf(t); if (j >= 0) { form[other].splice(j, 1); const ob = A.$(`[data-${other === "repeat" ? "rep" : "avo"}="${t}"]`, box); if (ob) ob.setAttribute("aria-pressed","false"); } }
    b.setAttribute("aria-pressed", String(i < 0));
  }));
  tog("rep", "repeat", "avoid"); tog("avo", "avoid", "repeat");
  A.$("#rnote", box).addEventListener("input", e => { form.note = e.target.value; });
  A.$("[data-saverefl]", box).addEventListener("click", onSave);
}
A.bindRefl = bindRefl;
function reflDone(r){
  return `<span class="label">Bitácora personal · ${A.fmtDate(r.at)}</span><div class="row"><span class="chip st">Disfrute ${r.enjoy}/5</span><span class="chip st">Me veo haciéndolo ${r.see}/5</span>${r.energy ? `<span class="chip">${["","Terminé agotada","Terminé neutral","Terminé con energía"][r.energy]}</span>` : ""}</div>${r.repeat.length ? `<p class="small"><b>Repetiría:</b> ${r.repeat.map(t => esc(A.task(t).n)).join(", ")}</p>` : ""}${r.avoid.length ? `<p class="small"><b>Evitaría:</b> ${r.avoid.map(t => esc(A.task(t).n)).join(", ")}</p>` : ""}${r.note ? `<blockquote style="margin:0;padding:8px 12px;border-left:3px solid var(--rule)">${esc(r.note)}</blockquote>` : ""}<p class="small muted">Esto ya alimenta tu <a href="#brujula">brújula</a>.</p>`;
}
A.reflDone = reflDone;
})();

(function(){
"use strict";
const A = window.APP, esc = A.esc, N = A.node;
const mem = {};
const M = id => (mem[id] = mem[id] || {});

A.routes.taller = function(){
  const cards = LV.tools.map(t => {
    const r = A.S.tools[t.id];
    return `<a class="sim-card" href="#tool.${t.id}">${r ? `<span class="done chip ${A.qChip[r.q]}">Mejor: ${r.best}/100</span>` : ""}<span class="label">≈ ${t.mins} min</span><h3 style="padding-right:96px">${esc(t.n)}</h3><p class="small">${esc(t.d)}</p><div class="meta">${t.areas.slice(0, 2).map(a => A.areaChip(a, false)).join("")}</div></a>`;
  }).join("");
  return {title:"Taller", eyebrow:"Trabajar, no solo leer", lead:"Tareas reales del oficio con datos ficticios: matrices de selección, boletas, legajos, encuestas de clima, planes de inducción. Puedes equivocarte, ver por qué y volver a intentarlo.", html:`<div class="tool-grid">${cards}</div>`};
};

A.routes.tool = function(id){
  const t = A.tool(id);
  if (!t) return {title:"Herramienta no encontrada", html:`<div class="empty">Vuelve al <a href="#taller">taller</a>.</div>`};
  const r = A.S.tools[id];
  return {eyebrow:"Taller · " + t.areas.map(a => A.area(a).n).join(" · "), title:esc(t.n), docTitle:t.n, lead:esc(t.d),
    html:`<div class="row"><a class="btn ghost sm" href="#taller">${A.icon("back")}Taller</a>${r ? `<span class="chip">Intentos: ${r.attempts} · Mejor puntaje: ${r.best}/100</span>` : ""}</div><div id="toolbox"></div>`,
    mount(root){ const box = A.$("#toolbox", root); const draw = () => KINDS[t.kind](box, t, draw); draw(); }};
};

function finishTool(box, t, score, q, feedback, restart){
  const r = A.S.tools[t.id] = A.S.tools[t.id] || {attempts:0, best:0};
  r.attempts++; r.best = Math.max(r.best, score); r.last = score; r.q = q; r.at = Date.now();
  A.save();
  const form = {enjoy:0, see:0};
  const res = document.createElement("section");
  res.className = "stack-lg";
  res.innerHTML = `<div class="card stack"><div class="scoreline"><span class="big">${score}</span><span class="muted">/ 100</span><span class="chip ${A.qChip[q]}">${A.qLabel[q].replace("Decisión", "Resultado")}</span></div><p class="small muted">El puntaje compara tu trabajo con el criterio de una profesional con experiencia. Mide práctica, no talento.</p>${feedback}<div class="row"><button type="button" class="btn ghost" data-retry>Intentar de nuevo</button><a class="btn ghost" href="#taller">Otra herramienta</a></div></div>
  <div class="card stack" id="treflbox"><span class="label">Bitácora rápida</span><div class="field"><label>¿Disfrutaste esta tarea?</label>${A.ratingRow("enjoy", 0)}</div><div class="field"><label>¿Te gustaría que esta tarea fuera parte de tu trabajo?</label>${A.ratingRow("see", 0)}</div><div class="row"><button type="button" class="btn stamp" data-tsave disabled>Guardar</button></div></div>`;
  box.appendChild(res);
  res.scrollIntoView({behavior:"smooth", block:"start"});
  A.$("[data-retry]", res).addEventListener("click", restart);
  const rb = A.$("#treflbox", res);
  A.bindRatings(rb, form, () => { A.$("[data-tsave]", rb).disabled = !(form.enjoy && form.see); });
  A.$("[data-tsave]", rb).addEventListener("click", () => {
    A.S.refl.push({at:Date.now(), kind:"tool", ref:t.id, enjoy:form.enjoy, see:form.see, energy:0, repeat:form.enjoy >= 4 ? t.tags.slice(0, 1) : [], avoid:form.enjoy <= 2 ? t.tags.slice(0, 1) : [], note:""});
    A.save(); rb.innerHTML = `<span class="label">Bitácora rápida</span><p class="small">Guardado: disfrute ${form.enjoy}/5 · te gustaría hacerlo ${form.see}/5. Alimenta tu <a href="#brujula">brújula</a>.</p>`;
  });
}
const qOf = s => s >= 80 ? "buena" : s >= 55 ? "aceptable" : "riesgosa";

const KINDS = {};

/* ---------- matriz de CV ---------- */
KINDS.cvs = function(box, t){
  const s = M(t.id);
  if (!s.crit) { s.crit = {}; s.w = {}; s.sc = {}; s.done = false; }
  const chosen = t.criteria.filter(c => s.crit[c.id]);
  const totals = {}; t.cvs.forEach(cv => { totals[cv.id] = chosen.reduce((sum, c) => sum + (s.sc[c.id + cv.id] || 0) * (s.w[c.id] || 1), 0); });
  const complete = chosen.length >= 3 && chosen.every(c => t.cvs.every(cv => s.sc[c.id + cv.id]));
  const rank = t.cvs.slice().sort((a, b) => totals[b.id] - totals[a.id]);
  box.innerHTML = `<div class="stack-lg">
    <div class="callout">${t.vacancy}</div>
    <div class="cvs">${t.cvs.map(cv => `<div class="cv"><b>${esc(cv.n)}</b>${cv.lines.map(l => `<span>${esc(l)}</span>`).join("")}</div>`).join("")}</div>
    <section class="card stack"><h3>1 · Elige tus criterios y su peso</h3><p class="small muted">Marca al menos tres. Peso 1 = complementario · 3 = decisivo.</p>
      <div class="table-wrap"><table class="mx"><thead><tr><th>Usar</th><th>Criterio</th><th>Peso</th></tr></thead><tbody>${t.criteria.map(c => `<tr><td><input type="checkbox" id="cr-${c.id}" data-crit="${c.id}" ${s.crit[c.id] ? "checked" : ""} ${s.done ? "disabled" : ""}></td><td><label for="cr-${c.id}">${esc(c.n)}</label></td><td><select data-w="${c.id}" ${!s.crit[c.id] || s.done ? "disabled" : ""} aria-label="Peso de ${esc(c.n)}">${[1,2,3].map(v => `<option value="${v}" ${(s.w[c.id] || 1) === v ? "selected" : ""}>${v}</option>`).join("")}</select></td></tr>`).join("")}</tbody></table></div></section>
    <section class="card stack"><h3>2 · Puntúa cada CV (1 a 5)</h3>${chosen.length ? `<div class="table-wrap"><table class="mx"><thead><tr><th>Criterio (peso)</th>${t.cvs.map(cv => `<th>${esc(cv.n)}</th>`).join("")}</tr></thead><tbody>${chosen.map(c => `<tr><td>${esc(c.n)} <span class="pill-k">×${s.w[c.id] || 1}</span></td>${t.cvs.map(cv => `<td><select data-sc="${c.id + cv.id}" ${s.done ? "disabled" : ""} aria-label="${esc(c.n)} de ${esc(cv.n)}"><option value="">–</option>${[1,2,3,4,5].map(v => `<option ${s.sc[c.id + cv.id] === v ? "selected" : ""}>${v}</option>`).join("")}</select></td>`).join("")}</tr>`).join("")}<tr><td><b>Total ponderado</b></td>${t.cvs.map(cv => `<td class="num"><b>${totals[cv.id]}</b></td>`).join("")}</tr></tbody></table></div><p class="small">Tu ranking actual: ${rank.map((cv, i) => `<b>${i + 1}.</b> ${esc(cv.n)}`).join(" · ")}</p>` : `<div class="empty">Elige criterios en el paso 1 para armar la matriz.</div>`}
    ${s.done ? "" : `<div class="row"><button type="button" class="btn stamp" data-eval ${complete ? "" : "disabled"}>Evaluar mi matriz</button>${complete ? "" : `<span class="small muted">Completa todas las celdas (mínimo tres criterios).</span>`}</div>`}</section></div>`;
  A.$$("[data-crit]", box).forEach(c => c.addEventListener("change", () => { s.crit[c.dataset.crit] = c.checked; KINDS.cvs(box, t); }));
  A.$$("[data-w]", box).forEach(c => c.addEventListener("change", () => { s.w[c.dataset.w] = +c.value; KINDS.cvs(box, t); }));
  A.$$("[data-sc]", box).forEach(c => c.addEventListener("change", () => { s.sc[c.dataset.sc] = +c.value || 0; KINDS.cvs(box, t); }));
  const ev = A.$("[data-eval]", box);
  if (ev) ev.addEventListener("click", () => {
    s.done = true; KINDS.cvs(box, t);
    let score = 100; const notes = [];
    chosen.filter(c => !c.ok).forEach(c => { score -= 30; notes.push(`<div class="callout bad"><b>${esc(c.n)}:</b> ${esc(c.why)}</div>`); });
    ["exp","excel","com"].forEach(k => { if (!s.crit[k]) { score -= 10; notes.push(`<div class="callout warn">No usaste <b>${esc(t.criteria.find(c => c.id === k).n)}</b>, que el puesto exige directamente.</div>`); } });
    const diffs = [];
    chosen.filter(c => c.ok).forEach(c => t.cvs.forEach(cv => { const u = s.sc[c.id + cv.id], x = cv.x[c.id]; if (Math.abs(u - x) >= 2) diffs.push(`<li>${esc(cv.n)} en <b>${esc(c.n.toLowerCase())}</b>: pusiste ${u}; la evidencia del CV sugiere ${x}.</li>`); }));
    score -= Math.min(30, diffs.length * 4);
    const myTop = rank[0].id;
    if (!t.expertRank.slice(0, 2).includes(myTop)) { score -= 15; notes.push(`<div class="callout warn">Tu primer lugar (${esc(rank[0].n)}) no coincide con los dos mejores según la evidencia.</div>`); }
    score = A.clamp(score, 0, 100);
    const fb = `<div class="stack">${notes.join("")}${diffs.length ? `<div><span class="label">Puntajes que se alejan de la evidencia</span><ul class="small">${diffs.join("")}</ul></div>` : `<p class="small">Tus puntajes son coherentes con la evidencia de cada CV.</p>`}<div><span class="label">Ranking de referencia</span><p class="small">${t.expertRank.map((id, i) => `<b>${i + 1}.</b> ${esc(t.cvs.find(c => c.id === id).n)}`).join(" · ")}</p></div><div class="pro"><span class="label">Cómo lo razona una profesional</span><p>${t.lesson}</p></div></div>`;
    finishTool(box, t, score, qOf(score), fb, () => { mem[t.id] = null; KINDS.cvs(box, t); });
  });
};

/* ---------- preguntas de entrevista ---------- */
KINDS.preguntas = function(box, t){
  const s = M(t.id);
  if (!s.ans) { s.ans = {}; s.own = ""; s.done = false; }
  const all = t.items.every((_, i) => s.ans[i]);
  const words = (s.own.trim().match(/\S+/g) || []).length;
  box.innerHTML = `<div class="stack-lg"><section class="card stack"><h3>1 · Clasifica cada pregunta</h3><div class="stack">${t.items.map((it, i) => `<div class="check-item ${s.done ? (s.ans[i] === it.a ? "ok" : "bad") : ""}" style="flex-direction:column;cursor:default"><span>«${esc(it.q)}»</span><div class="togs">${t.cats.map(c => `<button type="button" class="neu" data-cat="${i}" data-v="${c.id}" aria-pressed="${s.ans[i] === c.id}" ${s.done ? "disabled" : ""}>${esc(c.n)}</button>`).join("")}</div>${s.done ? `<span class="small">${s.ans[i] === it.a ? "Correcto." : `Era: <b>${esc(t.cats.find(c => c.id === it.a).n)}</b>.`} ${esc(it.why)}</span>` : ""}</div>`).join("")}</div></section>
  <section class="card stack"><h3>2 · Escribe tu propia pregunta conductual</h3><p class="small">Competencia: <b>${esc(t.own.comp)}</b>.</p><textarea id="ownq" style="min-height:80px" ${s.done ? "readonly" : ""} placeholder="Cuéntame de una vez en que…">${esc(s.own)}</textarea>${s.done ? "" : `<div class="row"><button type="button" class="btn stamp" data-eval ${all && words >= 8 ? "" : "disabled"}>Evaluar</button><span class="small muted">${all ? "" : "Clasifica las doce preguntas. "}${words >= 8 ? "" : "Escribe tu pregunta (mínimo 8 palabras)."}</span></div>`}</section></div>`;
  A.$$("[data-cat]", box).forEach(b => b.addEventListener("click", () => { s.ans[b.dataset.cat] = b.dataset.v; KINDS.preguntas(box, t); }));
  const ta = A.$("#ownq", box); if (ta && !s.done) ta.addEventListener("input", () => { s.own = ta.value; const w = (s.own.trim().match(/\S+/g) || []).length; const ev = A.$("[data-eval]", box); if (ev) ev.disabled = !(all && w >= 8); });
  const ev = A.$("[data-eval]", box);
  if (ev) ev.addEventListener("click", () => {
    s.done = true; KINDS.preguntas(box, t);
    const ok = t.items.filter((it, i) => s.ans[i] === it.a).length;
    const prohibMiss = t.items.filter((it, i) => it.a === "prohib" && s.ans[i] !== "prohib").length;
    const det = t.own.rubric.map(r => r.kw.every(k => new RegExp(k, "i").test(s.own)));
    const okOwn = det.filter(Boolean).length;
    let score = Math.round(ok / t.items.length * 75 + okOwn / det.length * 25) - prohibMiss * 10;
    score = A.clamp(score, 0, 100);
    const fb = `<div class="stack small"><p>Clasificaste bien <b>${ok} de ${t.items.length}</b> preguntas.${prohibMiss ? ` <span style="color:var(--bad)">No identificaste ${prohibMiss} pregunta(s) discriminatoria(s): es lo más importante de reconocer.</span>` : ""}</p><span class="label">Tu pregunta</span>${t.own.rubric.map((r, i) => `<div><span class="chip ${det[i] ? "ok" : "warn"}">${det[i] ? "Cumple" : "Revisar"}</span> ${esc(r.label)}</div>`).join("")}<div class="pro"><span class="label">Un modelo posible</span><p>${esc(t.own.model)}</p></div></div>`;
    finishTool(box, t, score, qOf(score), fb, () => { mem[t.id] = null; KINDS.preguntas(box, t); });
  });
};

/* ---------- plan de inducción ---------- */
KINDS.kanban = function(box, t){
  const s = M(t.id);
  if (!s.pos) { s.pos = {}; s.done = false; }
  const cols = [{id:"", n:"Por ubicar"}].concat(t.cols);
  const placed = t.items.filter(i => s.pos[i.id]).length;
  box.innerHTML = `<div class="stack-lg"><p class="small muted">Elige para cada actividad el momento en que debe ocurrir. ${placed}/${t.items.length} ubicadas.</p><div class="kanban" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))">${cols.map(c => { const its = t.items.filter(i => (s.pos[i.id] || "") === c.id); if (c.id === "" && !its.length) return ""; return `<div class="kcol"><h4>${esc(c.n)} (${its.length})</h4>${its.map(i => { const ok = s.done ? i.a.includes(s.pos[i.id]) : null; return `<div class="kcard ${ok === true ? "ok" : ok === false ? "bad" : ""}"><span>${esc(i.n)}</span>${s.done ? `<span class="small muted">${ok ? "Bien ubicada." : `Mejor en: ${i.a.map(x => t.cols.find(c => c.id === x).n).join(" o ")}.`} ${esc(i.why)}</span>` : `<select data-pos="${i.id}" aria-label="Momento para ${esc(i.n)}"><option value="">Elegir momento…</option>${t.cols.map(c2 => `<option value="${c2.id}" ${s.pos[i.id] === c2.id ? "selected" : ""}>${esc(c2.n)}</option>`).join("")}</select>`}</div>`; }).join("")}</div>`; }).join("")}</div>${s.done ? "" : `<div class="row"><button type="button" class="btn stamp" data-eval ${placed === t.items.length ? "" : "disabled"}>Evaluar mi plan</button></div>`}</div>`;
  A.$$("[data-pos]", box).forEach(sel => sel.addEventListener("change", () => { s.pos[sel.dataset.pos] = sel.value; KINDS.kanban(box, t); }));
  const ev = A.$("[data-eval]", box);
  if (ev) ev.addEventListener("click", () => {
    s.done = true; KINDS.kanban(box, t);
    const ok = t.items.filter(i => i.a.includes(s.pos[i.id])).length;
    const critMiss = t.critical.filter(id => !t.items.find(i => i.id === id).a.includes(s.pos[id]));
    let score = Math.round(ok / t.items.length * 100) - critMiss.length * 8;
    score = A.clamp(score, 0, 100);
    const q = critMiss.length ? (score >= 55 ? "aceptable" : "riesgosa") : qOf(score);
    const fb = `<div class="stack small"><p>Ubicaste bien <b>${ok} de ${t.items.length}</b> actividades.</p>${critMiss.length ? `<div class="callout bad">Actividades críticas fuera de lugar: ${critMiss.map(id => esc(t.items.find(i => i.id === id).n)).join("; ")}. Tienen implicancias legales o de seguridad.</div>` : `<div class="callout ok">Las actividades con implicancias legales y de seguridad quedaron en su momento correcto.</div>`}<div class="pro"><span class="label">Cómo lo razona una profesional</span><p>Lo que depende de la ley (alta, SST, periodo de prueba) tiene fecha fija. Lo demás se ordena pensando en la experiencia del nuevo: que el primer día no espere, que la primera semana aprenda haciendo con alguien y que el seguimiento llegue antes de que decida irse.</p></div></div>`;
    finishTool(box, t, score, q, fb, () => { mem[t.id] = null; KINDS.kanban(box, t); });
  });
};

/* ---------- herramientas basadas en el motor de nodos ---------- */
KINDS.node = function(box, t){
  const node = t.node;
  const s = M(t.id);
  const draw = () => {
    box.innerHTML = `<div class="stack-lg">${N.head(node, {})}<div>${N.interaction(node, {answered:s.res || null})}</div><div id="tres"></div></div>`;
    if (!s.res) N.bind(box, node, {}, (res) => {
      s.res = res; draw();
      A.$("#tres", box).innerHTML = N.outcome(res, {nofx:true, open:true});
      finishTool(box, t, res.score, res.q, "", () => { mem[t.id] = null; N.reset(node.id); KINDS.node(box, t); });
    }, draw);
  };
  draw();
};

/* ---------- rotación y ausentismo ---------- */
KINDS.rotacion = function(box, t){
  const s = M(t.id);
  if (!s.v) { s.v = {}; s.done = false; }
  const D = t.areasData;
  const months = ["Ene","Feb","Mar","Abr","May","Jun"];
  const colors = ["var(--c-atraer)","var(--c-cuidar)","var(--c-desarrollar)"];
  const W = 560, H = 210, pl = 34, pb = 26, pt = 10, maxV = 5;
  const gw = (W - pl - 10) / 6, bw = gw / 4;
  let bars = "";
  months.forEach((m, mi) => { D.forEach((a, ai) => { const v = a.sal[mi]; const h = v / maxV * (H - pb - pt); bars += `<rect x="${pl + mi * gw + bw * .5 + ai * bw}" y="${H - pb - h}" width="${bw - 2}" height="${h}" fill="${colors[ai]}" rx="1.5"><title>${a.n} · ${m}: ${v}</title></rect>`; }); bars += `<text x="${pl + mi * gw + gw / 2}" y="${H - 8}" text-anchor="middle">${m}</text>`; });
  let grid = ""; for (let v = 0; v <= maxV; v++) { const y = H - pb - v / maxV * (H - pb - pt); grid += `<line x1="${pl}" x2="${W - 6}" y1="${y}" y2="${y}" stroke="var(--rule)" stroke-width="1"/><text x="${pl - 6}" y="${y + 3}" text-anchor="end">${v}</text>`; }
  const qs = [
    {id:"q1", n:"Rotación semestral de toda la empresa (%)", v:22.0, why:"Promedio de trabajadores = (100 + 100) ÷ 2 = 100. Salidas = 22. Rotación = 22 ÷ 100 × 100 = 22%."},
    {id:"q2", n:"Rotación semestral de Operaciones (%)", v:27.1, why:"Promedio = (60 + 58) ÷ 2 = 59. Salidas = 16. Rotación = 16 ÷ 59 × 100 = 27.1%."},
    {id:"q3", n:"Ausentismo de Operaciones en el semestre (%)", v:6.0, why:`Días programados = 59 × ${t.days} = 8,850. Días perdidos = 531. Ausentismo = 531 ÷ 8,850 × 100 = 6.0%.`}];
  const concl = ["Operaciones concentra la rotación voluntaria y el ausentismo: hay que investigar sus condiciones (turnos, liderazgo, carga) antes de decidir acciones.","Hay que subir los sueldos de toda la empresa.","Una rotación semestral de 22% es baja y no requiere acción.","Conviene despedir a quienes más faltan para bajar el ausentismo."];
  box.innerHTML = `<div class="stack-lg">
   <section class="card stack"><span class="label">Distribuidora ficticia · primer semestre</span><div class="table-wrap"><table><thead><tr><th>Área</th><th class="num">Al 1 ene</th><th class="num">Al 30 jun</th><th class="num">Salidas</th><th class="num">Voluntarias</th><th class="num">Días perdidos por ausencias</th></tr></thead><tbody>${D.map(a => `<tr><td>${a.n}</td><td class="num">${a.ini}</td><td class="num">${a.fin}</td><td class="num">${a.sal.reduce((x, y) => x + y, 0)}</td><td class="num">${a.vol}</td><td class="num">${a.perd}</td></tr>`).join("")}</tbody></table></div><p class="small muted">Días laborables del semestre por trabajador: ${t.days}.</p>
   <div class="legend">${D.map((a, i) => `<span><i style="background:${colors[i]}"></i>${a.n}</span>`).join("")}</div>
   <div style="overflow-x:auto"><svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" style="min-width:420px" role="img" aria-label="Salidas por mes y área">${grid}${bars}</svg></div><p class="small muted">Salidas por mes y área.</p></section>
   <section class="card stack"><h3>Calcula</h3>${qs.map(q => { const v = s.v[q.id]; const ok = s.done ? Math.abs((+v) - q.v) <= .5 : null; return `<div class="field"><label for="${q.id}">${q.n}</label><input type="number" step="0.1" inputmode="decimal" id="${q.id}" data-v="${q.id}" value="${v != null ? esc(v) : ""}" ${s.done ? "readonly" : ""} style="max-width:160px">${s.done ? `<span class="small"><span class="chip ${ok ? "ok" : "bad"}">${ok ? "Correcto" : "Revisar: " + q.v + "%"}</span> ${q.why}</span>` : ""}</div>`; }).join("")}
   <div class="field"><label>¿Qué conclusión es más defendible?</label><div class="choices">${concl.map((c, i) => `<button type="button" class="choice" data-c="${i}" aria-pressed="${s.c === i}" ${s.done ? "disabled" : ""}><span class="k">${"ABCD"[i]}</span><span>${esc(c)}</span></button>`).join("")}</div></div>
   ${s.done ? "" : `<div class="row"><button type="button" class="btn stamp" data-eval>Revisar mis cálculos</button></div>`}</section></div>`;
  A.$$("[data-v]", box).forEach(i => i.addEventListener("input", () => { s.v[i.dataset.v] = i.value; }));
  A.$$("[data-c]", box).forEach(b => b.addEventListener("click", () => { s.c = +b.dataset.c; A.$$("[data-c]", box).forEach(x => x.setAttribute("aria-pressed", String(x === b))); }));
  const ev = A.$("[data-eval]", box);
  if (ev) ev.addEventListener("click", () => {
    if (qs.some(q => s.v[q.id] === undefined || s.v[q.id] === "") || s.c == null) { A.toast("Completa los tres cálculos y elige una conclusión."); return; }
    s.done = true; KINDS.rotacion(box, t);
    const ok = qs.filter(q => Math.abs((+s.v[q.id]) - q.v) <= .5).length;
    const score = Math.round(ok / 3 * 70 + (s.c === 0 ? 30 : 0));
    const fb = `<div class="stack small"><p>Cálculos correctos: <b>${ok} de 3</b>. Conclusión: ${s.c === 0 ? "<b>defendible</b>." : "<b>no se sostiene con los datos</b>."}</p><div class="pro"><span class="label">Cómo lo razona una profesional</span><p>El número total esconde el problema. Operaciones tiene 16 de las 22 salidas, 13 de ellas voluntarias, y triplica el ausentismo de Administración. Antes de proponer soluciones, se investiga qué pasa ahí: entrevistas de salida, horarios, supervisores. Un analista que solo reporta el 22% no ayudó a decidir nada.</p></div></div>`;
    finishTool(box, t, score, qOf(score), fb, () => { mem[t.id] = null; KINDS.rotacion(box, t); });
  });
};

/* ---------- clima ---------- */
KINDS.clima = function(box, t){
  const s = M(t.id);
  if (!s.a) { s.a = {}; s.done = false; }
  const cell = v => { const p = A.clamp((v - 2) / 2.2, 0, 1); return `background:color-mix(in srgb, var(--bad) ${Math.round((1 - p) * 55)}%, color-mix(in srgb, var(--ok) ${Math.round(p * 45)}%, var(--sheet)))`; };
  box.innerHTML = `<div class="stack-lg"><section class="card stack"><span class="label">Empresa de transporte interprovincial (ficticia) · escala 1 a 5</span><div class="table-wrap"><table><thead><tr><th>Dimensión</th>${t.areasC.map(a => `<th class="num">${a.n} (${a.nn})</th>`).join("")}</tr></thead><tbody>${t.dimsC.map((d, di) => `<tr><td>${d}</td>${t.vals.map(row => `<td class="num" style="${cell(row[di])}">${row[di].toFixed(1)}</td>`).join("")}</tr>`).join("")}<tr><td><b>Participación</b></td>${t.areasC.map(a => `<td class="num"><b>${a.part}%</b></td>`).join("")}</tr></tbody></table></div></section>
  ${t.qs.map((q, qi) => `<section class="card stack"><h3>${qi + 1} · ${esc(q.q)}</h3><div class="choices">${q.o.map((o, oi) => `<button type="button" class="choice" data-q="${qi}" data-o="${oi}" aria-pressed="${s.a[qi] === oi}" ${s.done ? "disabled" : ""}><span class="k">${"ABCD"[oi]}</span><span>${esc(o)}</span></button>`).join("")}</div>${s.done ? `<p class="small"><span class="chip ${s.a[qi] === q.a ? "ok" : "bad"}">${s.a[qi] === q.a ? "Correcto" : "Revisar"}</span> ${esc(q.why)}</p>` : ""}</section>`).join("")}
  ${s.done ? "" : `<div class="row"><button type="button" class="btn stamp" data-eval>Evaluar</button></div>`}</div>`;
  A.$$("[data-q]", box).forEach(b => b.addEventListener("click", () => { s.a[b.dataset.q] = +b.dataset.o; A.$$(`[data-q="${b.dataset.q}"]`, box).forEach(x => x.setAttribute("aria-pressed", String(x === b))); }));
  const ev = A.$("[data-eval]", box);
  if (ev) ev.addEventListener("click", () => {
    if (t.qs.some((_, i) => s.a[i] == null)) { A.toast("Responde las tres preguntas."); return; }
    s.done = true; KINDS.clima(box, t);

(function(){

    <div class="sim-grid">${roles.map(r => `<a class="sim-card" href="#cargo.${r.id}">${r.sim ? `<span class="done chip st">Con simulación</span>` : ""}<span class="label">${LVL[r.lvl]} · ${r.sector}</span><h3 style="padding-right:110px">${esc(r.n)}</h3><p class="small">${esc(r.mission)}</p><div class="meta">${r.areas.slice(0, 2).map(a => A.areaChip(a, false)).join("")}</div></a>`).join("")}</div>`,
    mount(root){ A.$$("[data-lvl]", root).forEach(b => b.addEventListener("click", () => { A.S.prefs.lvl = b.dataset.lvl; A.save(); A.render(true); })); }};
};
A.routes.cargo = function(id){
  const r = A.role(id);
  if (!r) return {title:"Cargo no encontrado", html:`<div class="empty">Vuelve a <a href="#cargos">cargos</a>.</div>`};
  const sim = r.sim ? A.sim(r.sim) : null;
  return {eyebrow:LVL[r.lvl] + " · " + r.sector, title:esc(r.n), docTitle:r.n, lead:esc(r.mission), html:`
    <div class="row"><a class="btn ghost sm" href="#cargos">${A.icon("back")}Cargos</a>${r.areas.map(a => A.areaChip(a)).join("")}</div>
    <div class="split"><div class="stack-lg">
      <section class="card stack"><h2>Un día típico</h2><div class="steps">${r.day.map(([h, t]) => `<div><span class="when">${h}</span><span>${esc(t)}</span></div>`).join("")}</div><p class="small muted">Recorrido orientativo construido a partir de funciones habituales del puesto.</p></section>
      <section class="callout warn"><b>El lado B del puesto.</b> ${esc(r.hard)}</section>
      <section class="stack-lg"><h2>Dilemas rápidos</h2>${r.dil.map((d, di) => { const key = r.id + "_" + di, ans = A.S.dil[key]; return `<div class="card stack"><p><b>${esc(d.q)}</b></p><div class="choices">${d.o.map((o, oi) => `<button type="button" class="choice ${ans != null && ans !== oi ? "other" : ""}" data-dil="${key}" data-o="${oi}" aria-pressed="${ans === oi}" ${ans != null ? "disabled" : ""}><span class="k">${"ABC"[oi]}</span><span>${esc(o[0])}</span></button>`).join("")}</div>${ans != null ? `<div class="outcome"><div class="outcome-head q-${d.o[ans][1]}">${A.qLabel[d.o[ans][1]]}</div><div class="outcome-body"><p>${esc(d.o[ans][2])}</p><details class="more"><summary>Ver las otras opciones</summary><div class="stack small" style="margin-top:8px">${d.o.map(o => `<div><span class="chip ${A.qChip[o[1]]}">${A.qLabel[o[1]]}</span> ${esc(o[0])}<br><span class="muted">${esc(o[2])}</span></div>`).join("")}</div></details><button type="button" class="btn ghost sm" data-redil="${key}" style="justify-self:start">Volver a intentar</button></div></div>` : ""}</div>`; }).join("")}</section>
    </div><aside class="stack-lg">
      ${sim ? `<a class="sim-card" href="#sim.${sim.id}" style="border-color:var(--stamp)"><span class="label">Simulación completa</span><h3>${esc(sim.title)}</h3><p class="small">${esc(sim.hook)}</p><span class="btn stamp sm" style="justify-self:start">Vivirlo ${A.icon("arrow")}</span></a>` : ""}
      <section class="card stack"><span class="label">Entregables</span><ul style="margin:0;padding-left:1.1rem">${r.deliver.map(x => `<li>${esc(x)}</li>`).join("")}</ul><span class="label">Coordina con</span><p class="small">${r.with.map(esc).join(" · ")}</p><span class="label">Se le mide por</span><p class="small">${r.kpi.map(esc).join(" · ")}</p><span class="label">Requisitos habituales</span><p class="small">${esc(r.req)}</p><span class="label">Hacia dónde crecer</span><p class="small">${r.next.map(esc).join(" → ")}</p></section>
    </aside></div>`,
    mount(root){
      A.$$("[data-dil]", root).forEach(b => b.addEventListener("click", () => { A.S.dil[b.dataset.dil] = +b.dataset.o; A.save(); A.render(true); }));
      A.$$("[data-redil]", root).forEach(b => b.addEventListener("click", () => { delete A.S.dil[b.dataset.redil]; A.save(); A.render(true); }));
    }};
};

/* ================= academia ================= */
A.routes.academia = function(){
  const f = A.S.prefs.acf || "todas";
  const q = (A.S.prefs.acq || "").toLowerCase();
  const list = LV.concepts.filter(c => (f === "todas" || c.areas.some(a => A.area(a).c === f)) && (!q || (c.n + " " + c.simple).toLowerCase().includes(q)));
  return {title:"Academia", eyebrow:"Cada concepto en dos niveles", lead:"Primero como se lo explicarías a alguien que nunca trabajó en RR.HH.; después como lo usa una profesional: criterios, indicadores, documentos y normas. Con su práctica, sus errores frecuentes y cómo se ve hecho mal y hecho bien.",
    html:`<div class="row"><div class="seg" role="group" aria-label="Filtrar por familia"><button type="button" data-acf="todas" aria-pressed="${f === "todas"}">Todas</button>${LV.clusters.map(c => `<button type="button" data-acf="${c.id}" aria-pressed="${f === c.id}">${c.n}</button>`).join("")}</div><div class="field" style="flex:1;min-width:200px"><input type="text" id="acq" placeholder="Buscar concepto…" value="${esc(A.S.prefs.acq || "")}" aria-label="Buscar concepto"></div></div>
    ${list.length ? `<div class="concept-list">${list.map(c => `<a class="concept" href="#concepto.${c.id}"><div class="row" style="justify-content:space-between"><span class="label">${c.areas.slice(0, 1).map(a => esc(A.area(a).n)).join("")}</span>${A.S.concepts[c.id] ? `<span class="chip ok">${A.S.concepts[c.id].ok ? "Comprobado" : "Leído"}</span>` : ""}</div><h3>${esc(c.n)}</h3><p class="small muted">${esc(c.simple.replace(/<[^>]+>/g, "").slice(0, 120))}…</p></a>`).join("")}</div>` : `<div class="empty">No hay conceptos que coincidan. Prueba otra palabra o quita el filtro.</div>`}`,
    mount(root){
      A.$$("[data-acf]", root).forEach(b => b.addEventListener("click", () => { A.S.prefs.acf = b.dataset.acf; A.save(); A.render(true); }));
      const inp = A.$("#acq", root); let t;
      inp.addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => { A.S.prefs.acq = inp.value; A.render(true); const ni = A.$("#acq"); if (ni) { ni.focus(); ni.setSelectionRange(ni.value.length, ni.value.length); } }, 250); });
    }};
};
A.routes.concepto = function(id){
  const c = A.concept(id);
  if (!c) return {title:"Concepto no encontrado", html:`<div class="empty">Vuelve a la <a href="#academia">academia</a>.</div>`};
  if (!A.S.concepts[id]) { A.S.concepts[id] = {at:Date.now(), ok:false}; A.save(); }
  const st = A.S.concepts[id];
  const ck = c.check;
  return {eyebrow:"Academia · " + c.areas.map(a => A.area(a).n).join(" · "), title:esc(c.n), docTitle:c.n, html:`
    <div class="row"><a class="btn ghost sm" href="#academia">${A.icon("back")}Academia</a>${lensSeg()}</div>
    <div class="dual">${lensBody(c.simple, c.tech)}</div>
    ${c.steps ? `<section class="card stack"><h2>En la práctica</h2><div class="steps">${c.steps.map(([w, what, who]) => `<div><span class="when">${esc(w)}</span><span>${esc(what)}<br><span class="who">Responsable: ${esc(who)}</span></span></div>`).join("")}</div></section>` : ""}
    <div class="compare2"><div class="bad"><h4>Hecho mal</h4><p>${esc(c.bad)}</p></div><div class="good"><h4>Hecho bien</h4><p>${esc(c.good)}</p></div></div>
    <div class="grid g3">
      <section class="card stack"><span class="label">Errores frecuentes</span><ul style="margin:0;padding-left:1.1rem;display:grid;gap:3px" class="small">${c.errors.map(e => `<li>${esc(e)}</li>`).join("")}</ul></section>
      <section class="card stack"><span class="label">Cómo se mide</span>${c.measure.length ? `<ul style="margin:0;padding-left:1.1rem;display:grid;gap:3px" class="small">${c.measure.map(e => `<li>${esc(e)}</li>`).join("")}</ul>` : `<p class="small muted">Es un marco normativo más que un proceso con indicadores propios.</p>`}</section>
      <section class="card stack"><span class="label">Base normativa</span>${c.norma.length ? `<ul style="margin:0;padding-left:1.1rem;display:grid;gap:3px" class="small">${c.norma.map(e => `<li>${esc(e)}</li>`).join("")}</ul>` : `<p class="small muted">No depende de una norma específica.</p>`}</section>
    </div>
    ${c.caso ? `<section class="card stack"><h3>Casos documentados <span class="tag-doc">Fuente verificable</span></h3>${c.caso.map(k => `<div class="small"><a href="${k.u}" target="_blank" rel="noopener">${esc(k.t)}</a><br><span class="muted">${esc(k.d)}</span></div>`).join("")}</section>` : ""}
    <section class="card stack" id="chk"><span class="label">Comprueba lo aprendido</span><p><b>${esc(ck.q)}</b></p><div class="choices">${ck.o.map((o, i) => `<button type="button" class="choice" data-ck="${i}" ${st.ans != null ? "disabled" : ""} aria-pressed="${st.ans === i}"><span class="k">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>${st.ans != null ? `<div class="callout ${st.ans === ck.a ? "ok" : "bad"}"><b>${st.ans === ck.a ? "Correcto." : "No exactamente."}</b> ${esc(ck.why)}</div><button type="button" class="btn ghost sm" data-reck style="justify-self:start">Responder otra vez</button>` : ""}</section>
    <section class="stack"><span class="label">Conecta con</span><div class="row">${c.areas.map(a => A.areaChip(a)).join("")}${c.sims.map(s => `<a class="chip" href="#sim.${s}" style="text-decoration:none">Simulación: ${esc(A.sim(s).title)}</a>`).join("")}${c.tools.map(t => `<a class="chip" href="#tool.${t}" style="text-decoration:none">Taller: ${esc(A.tool(t).n)}</a>`).join("")}</div></section>`,
    mount(root){
      bindLens(root);
      A.$$("[data-ck]", root).forEach(b => b.addEventListener("click", () => { st.ans = +b.dataset.ck; st.ok = st.ans === ck.a; A.save(); A.render(true); }));
      const r = A.$("[data-reck]", root); if (r) r.addEventListener("click", () => { delete st.ans; A.save(); A.render(true); });
    }};
};

/* ================= público y privado ================= */
A.routes.sectores = function(){
  const S = LV.sectors;
  const ci = +(A.S.prefs.case || 0);
  const cs = S.cases[ci];
  return {title:"Público y privado", eyebrow:"Dos mundos que no funcionan igual", lead:"En una empresa, RR.HH. busca que el negocio tenga el talento que necesita. En el Estado, busca que la entidad tenga servidores idóneos elegidos por mérito y gestionados conforme a ley. Las diferencias empiezan ahí.",
    html:`
    <section class="stack-lg"><h2>Lado a lado</h2><div class="table-wrap"><table><thead><tr><th>Aspecto</th><th>Sector privado</th><th>Sector público</th></tr></thead><tbody>${S.dims.map(d => `<tr><td><b>${esc(d.n)}</b></td><td>${esc(d.pri)}</td><td>${esc(d.pub)}</td></tr>`).join("")}</tbody></table></div></section>
    <section class="stack-lg"><div class="stack"><h2>El mismo problema, dos recorridos</h2><div class="seg" role="group" aria-label="Elegir caso">${S.cases.map((c, i) => `<button type="button" data-case="${i}" aria-pressed="${i === ci}">${esc(c.n)}</button>`).join("")}</div></div>
      <div class="versus"><div class="side-col"><h3>${A.icon("cargos")}Empresa privada</h3><div class="flow">${cs.pri.map(([d, t]) => `<div><span class="d">${esc(d)}</span><span>${esc(t)}</span></div>`).join("")}</div></div><div class="side-col"><h3>${A.icon("sectores")}Entidad pública</h3><div class="flow">${cs.pub.map(([d, t]) => `<div><span class="d">${esc(d)}</span><span>${esc(t)}</span></div>`).join("")}</div></div></div>
      <div class="callout">${esc(cs.lesson)}</div></section>
    <section class="stack-lg"><div class="stack"><h2>Los regímenes laborales del Estado</h2><p class="small muted">En una misma entidad pueden convivir los cuatro. Cada regla de RR.HH. (vacaciones, beneficios, sanciones, ingreso) depende del régimen de la persona. Estado al 16 de octubre de 2026.</p></div><div class="grid g4">${S.regimenes.map(r => `<div class="regimen"><span class="code">${r.code}</span><b>${esc(r.n)}</b><span class="small"><b>Quiénes:</b> ${esc(r.who)}</span><span class="small"><b>Ingreso:</b> ${esc(r.in)}</span><span class="small"><b>Beneficios:</b> ${esc(r.ben)}</span><span class="small muted">${esc(r.note)}</span></div>`).join("")}</div></section>
    <div class="grid g2">
      <section class="card stack"><h3>SERVIR: el ente rector</h3><p class="small">La Autoridad Nacional del Servicio Civil (D.Leg. 1023) dirige el Sistema Administrativo de Gestión de Recursos Humanos del Estado: emite directivas y lineamientos, publica opiniones técnicas (informes técnicos) que orientan a las ORH, resuelve controversias en el Tribunal del Servicio Civil y conduce el tránsito de las entidades al régimen de la Ley 30057. Para una ORH, consultar los informes técnicos de SERVIR es parte del trabajo diario.</p><a class="small" href="https://www.gob.pe/institucion/servir/campa%C3%B1as/5332-proceso-de-transito-a-la-ley-del-servicio-civil" target="_blank" rel="noopener">SERVIR: proceso de tránsito a la Ley del Servicio Civil</a></section>
      <section class="card stack"><h3>Tipos de entidad</h3>${S.entities.map(e => `<div class="small"><b>${esc(e.n)}.</b> ${esc(e.d)}</div>`).join("")}</section>
      <section class="card stack"><h3>Y dentro del sector privado</h3>${S.privSizes.map(e => `<div class="small"><b>Empresa ${esc(e.n.toLowerCase())}.</b> ${esc(e.d)}</div>`).join("")}</section>
      <section class="card stack"><h3>Vívelo</h3><p class="small">La mejor forma de sentir la diferencia es pasar un día en cada lado.</p><a class="btn ghost sm" href="#sim.municipal" style="justify-self:start">Un día en una municipalidad</a><a class="btn ghost sm" href="#sim.seleccion" style="justify-self:start">Un día en una distribuidora</a></section>
    </div>`,
    mount(root){ A.$$("[data-case]", root).forEach(b => b.addEventListener("click", () => { A.S.prefs.case = +b.dataset.case; A.save(); A.render(true); })); }};
};

/* ================= fuentes ================= */
A.routes.fuentes = function(){
  const K = {norma:"Norma", guia:"Guía o informe institucional", noticia:"Noticia de medio oficial o especializado", caso:"Caso documentado"};
  return {title:"Fuentes y método", eyebrow:"Cómo distinguir lo real de lo simulado", lead:"La autenticidad es el criterio central de esta plataforma. Aquí está qué es verificable y qué es construido.",
    html:`<div class="grid g3">
      <section class="card stack"><span class="tag-doc" style="justify-self:start">Verificable</span><p class="small"><b>Normas, informes de SERVIR, guías institucionales y casos documentados.</b> Se verificaron el 16 de octubre de 2026 y se enlazan abajo. Las normas cambian: antes de aplicar una regla en el trabajo, revisa su versión vigente.</p></section>
      <section class="card stack"><span class="tag-sim" style="justify-self:start">Simulación</span><p class="small"><b>Organizaciones, personas, diálogos, CV, legajos y datos numéricos.</b> Son ficticios, construidos a partir de prácticas profesionales habituales. No son testimonios ni se atribuyen a empresas reales.</p></section>
      <section class="card stack"><span class="tag-sim" style="justify-self:start">Criterio profesional</span><p class="small"><b>«Cómo lo razona una profesional».</b> Son criterios de buena práctica, no la única respuesta posible. Cuando una regla depende del régimen laboral o de la institución, se indica.</p></section>
    </div>
    <div class="callout warn small"><b>Límites.</b> Esta plataforma es formativa. No reemplaza la asesoría de un abogado laboralista ni las opiniones técnicas de SERVIR para un caso concreto. Los porcentajes del cronograma de gratificaciones CAS dependen del D.S. 142-2026-EF y de la disponibilidad presupuestal de cada entidad.</div>
    ${Object.keys(K).map(k => { const items = LV.sources.filter(s => s.k === k); return items.length ? `<section class="stack"><h2>${K[k]}</h2><div class="stack">${items.map(s => `<div class="card flat" style="padding:12px 14px"><a href="${s.u}" target="_blank" rel="noopener"><b>${esc(s.t)}</b></a><p class="small muted">${esc(s.d)}</p></div>`).join("")}</div></section>` : ""; }).join("")}`};
};
})();

window.APP.boot();
</script>
