<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Legajo Vivo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Laboratorio de vocación en Recursos Humanos: simulaciones, taller y brújula personal, con contexto peruano.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:ital,wght@0,400..700;1,400&display=swap">
<style>
/* Layout: expediente con pestañas de archivador (rail lateral en escritorio, barra inferior en móvil); cada vista es un "folio". */
:root{
  --paper:#ECEEE8; --sheet:#F9FAF6; --sheet-2:#E2E5DC; --sheet-3:#D6DACF;
  --ink:#161A24; --ink-2:#495064; --ink-3:#6E7488; --rule:#CBD0C3;
  --stamp:#2D3BA0; --stamp-ink:#FFFFFF; --stamp-soft:#DCE0F6;
  --marker:#F2D53C; --marker-ink:#3A3000;
  --ok:#1C7A4B; --ok-soft:#D7EEDF; --warn:#9E5E00; --warn-soft:#F6E7CC; --bad:#B1281F; --bad-soft:#F6DAD7;
  --c-atraer:#2F59CF; --c-admin:#8D6B12; --c-desarrollar:#18806A; --c-cuidar:#B0407A; --c-estrategia:#5A4CC9;
  --shadow:0 1px 0 rgba(22,26,36,.06),0 8px 24px -12px rgba(22,26,36,.18);
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"Public Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:6px; --rail:232px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F121A; --sheet:#171B26; --sheet-2:#202536; --sheet-3:#2A3043;
  --ink:#E7E9F0; --ink-2:#AEB4C7; --ink-3:#868DA3; --rule:#2D3346;
  --stamp:#8E9BFF; --stamp-ink:#0F121A; --stamp-soft:#252B4D;
  --marker:#E6CB3A; --marker-ink:#1A1600;
  --ok:#5CCB92; --ok-soft:#173326; --warn:#E5A84A; --warn-soft:#3A2C12; --bad:#FF8A7E; --bad-soft:#3D1D1A;
  --c-atraer:#7D9DFF; --c-admin:#D9B24F; --c-desarrollar:#4FD0B0; --c-cuidar:#F07BB4; --c-estrategia:#A99CFF;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0F121A; --sheet:#171B26; --sheet-2:#202536; --sheet-3:#2A3043;
  --ink:#E7E9F0; --ink-2:#AEB4C7; --ink-3:#868DA3; --rule:#2D3346;
  --stamp:#8E9BFF; --stamp-ink:#0F121A; --stamp-soft:#252B4D;
  --marker:#E6CB3A; --marker-ink:#1A1600;
  --ok:#5CCB92; --ok-soft:#173326; --warn:#E5A84A; --warn-soft:#3A2C12; --bad:#FF8A7E; --bad-soft:#3D1D1A;
  --c-atraer:#7D9DFF; --c-admin:#D9B24F; --c-desarrollar:#4FD0B0; --c-cuidar:#F07BB4; --c-estrategia:#A99CFF;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--paper)}
a{color:var(--stamp)}
.ic{width:18px;height:18px;flex:none;display:inline-block;vertical-align:middle}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--stamp);outline-offset:2px;border-radius:3px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.12;text-wrap:balance;margin:0}
h1{font-size:clamp(1.9rem,1.3rem + 2.4vw,3rem);font-weight:800;font-stretch:78%;letter-spacing:-.01em}
h2{font-size:clamp(1.35rem,1.1rem + 1vw,1.85rem);font-weight:750;font-stretch:84%}
h3{font-size:1.15rem;font-weight:700;font-stretch:92%}
h4{font-size:.98rem;font-weight:700}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.small{font-size:.88rem}
.hl{background:linear-gradient(transparent 55%,var(--marker) 55%,var(--marker) 92%,transparent 92%);color:inherit;padding:0 .1em}
.prose{max-width:68ch;display:grid;gap:.75rem}
.prose ul,.prose ol{margin:0;padding-left:1.2rem;display:grid;gap:.3rem}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow:auto;border-right:1px solid var(--rule);background:var(--sheet-2);padding:18px 0 18px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.brand{display:grid;gap:4px;padding-right:14px}
.brand b{font-family:var(--f-display);font-weight:900;font-stretch:68%;font-size:1.65rem;letter-spacing:.01em;line-height:1}
.brand small{font-size:.74rem;color:var(--ink-2);line-height:1.3}
.tabs{display:grid;gap:3px}
.tab{display:flex;align-items:center;gap:10px;padding:9px 12px;text-decoration:none;color:var(--ink-2);border-radius:var(--r) 0 0 var(--r);font-weight:600;font-size:.93rem;border:1px solid transparent;border-right:0;position:relative}
.tab .ic{width:20px;height:20px;flex:none;color:currentColor}
.tab:hover{color:var(--ink);background:var(--sheet-3)}
.tab[aria-current="page"]{background:var(--paper);color:var(--ink);border-color:var(--rule);margin-right:-1px}
.tab[aria-current="page"]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--stamp)}
.rail-foot{margin-top:auto;padding-right:14px;display:grid;gap:8px}
.sync{display:flex;align-items:center;gap:8px;font-size:.76rem;color:var(--ink-3)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.on{background:var(--ok)} .dot.warn{background:var(--warn)}
.main{min-width:0;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.folio{max-width:1120px;margin:0 auto;display:grid;gap:28px}
.folio-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.folio-head .intro{display:grid;gap:10px;max-width:70ch;min-width:0}
.fs{font-family:var(--f-mono);font-size:.75rem;color:var(--ink-3);border:1px solid var(--rule);padding:4px 8px;border-radius:3px;white-space:nowrap;background:var(--sheet)}
.bottombar{display:none}
.sheet-more{display:none}

@media (max-width:899px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .main{padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
  .topbar{display:flex}
  .bottombar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--sheet);border-top:1px solid var(--rule);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .bottombar a,.bottombar button{display:grid;justify-items:center;gap:2px;padding:6px 2px;font-size:.68rem;font-weight:600;color:var(--ink-3);text-decoration:none;background:none;border:0;border-radius:var(--r)}
  .bottombar .ic{width:22px;height:22px}
  .bottombar [aria-current="page"]{color:var(--stamp)}
  .sheet-more{position:fixed;inset:auto 0 0 0;z-index:70;background:var(--sheet);border-top:1px solid var(--rule);border-radius:14px 14px 0 0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:var(--shadow)}
  .sheet-more.open{display:grid;gap:4px}
  .scrim{position:fixed;inset:0;z-index:65;background:rgba(10,12,18,.45)}
}
.topbar{display:none;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.topbar b{font-family:var(--f-display);font-weight:900;font-stretch:68%;font-size:1.35rem}

/* ---------- building blocks ---------- */
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:18px;min-width:0}
.card.flat{box-shadow:none}
.lift{box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:grid;gap:10px}
.stack-lg{display:grid;gap:18px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:22px;align-items:start}
@media (max-width:899px){.split{grid-template-columns:minmax(0,1fr)}}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;padding:10px 16px;border-radius:var(--r);border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:650;font-size:.93rem;cursor:pointer;text-decoration:none;line-height:1.2}
.btn:hover{filter:brightness(1.12)}
.btn.stamp{background:var(--stamp);border-color:var(--stamp);color:var(--stamp-ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.ghost:hover{background:var(--sheet-2)}
.btn.sm{padding:6px 10px;font-size:.84rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);font-size:.78rem;font-weight:600;color:var(--ink-2);white-space:nowrap}
.chip.solid{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.st{background:var(--stamp-soft);color:var(--stamp);border-color:transparent}
.chip .sw{width:8px;height:8px;border-radius:2px}
.tag-sim{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:3px;border:1px dashed var(--ink-3);color:var(--ink-2)}
.tag-doc{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:3px;background:var(--ok-soft);color:var(--ok)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;background:var(--sheet)}
.seg button{border:0;background:none;padding:7px 12px;font-size:.85rem;font-weight:600;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.callout{border-left:3px solid var(--stamp);background:var(--stamp-soft);padding:12px 14px;border-radius:0 var(--r) var(--r) 0;font-size:.93rem}
.callout.warn{border-color:var(--warn);background:var(--warn-soft)}
.callout.ok{border-color:var(--ok);background:var(--ok-soft)}
.callout.bad{border-color:var(--bad);background:var(--bad-soft)}
.empty{border:1.5px dashed var(--rule);border-radius:var(--r);padding:22px;display:grid;gap:8px;color:var(--ink-2);background:transparent}
.bar{height:8px;border-radius:4px;background:var(--sheet-3);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--stamp);border-radius:4px;transition:width .5s ease}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;font-size:.92rem}
.kv dt{color:var(--ink-3);font-weight:600}
.kv dd{margin:0}
details.more>summary{cursor:pointer;font-weight:650;color:var(--stamp);list-style:none}
details.more>summary::before{content:"+ ";font-family:var(--f-mono)}
details.more[open]>summary::before{content:"− "}
.table-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:500;background:var(--sheet-2)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-mono)}
input[type=text],input[type=number],select,textarea{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);padding:8px 10px;width:100%;min-width:0}
textarea{min-height:140px;resize:vertical;line-height:1.5}
input[type=number]{font-family:var(--f-mono)}
input[type=range]{width:100%;accent-color:var(--stamp)}
.field{display:grid;gap:5px}
.field label{font-weight:650;font-size:.88rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:var(--r);font-size:.9rem;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
@media (min-width:900px){.toast{bottom:24px}}

/* ---------- hero / inicio ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;align-items:center;padding:26px;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);position:relative;overflow:hidden}
@media (max-width:899px){.hero{grid-template-columns:minmax(0,1fr);padding:18px}}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 58%,var(--marker) 58%,var(--marker) 90%,transparent 90%)}
.desk{position:relative;min-height:370px}
.paper{position:absolute;background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:14px;box-shadow:var(--shadow);font-size:.82rem;width:min(78%,300px)}
.paper .label{display:block;margin-bottom:6px}
.paper.p1{top:0;left:4%;transform:rotate(-3deg)}
.paper.p2{top:118px;right:0;transform:rotate(2.5deg)}
.paper.p3{top:250px;left:6%;transform:rotate(-1deg)}
@media (max-width:899px){.desk{min-height:auto;display:grid;gap:10px}.paper{position:static;width:auto;transform:none!important}}
.stampmark{display:inline-grid;place-items:center;border:2.5px solid var(--stamp);color:var(--stamp);font-family:var(--f-display);font-weight:900;font-stretch:70%;letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border-radius:6px;transform:rotate(-6deg);font-size:.9rem;line-height:1.1;text-align:center;opacity:.92}
.stampmark small{font-family:var(--f-mono);font-size:.62rem;font-weight:500;letter-spacing:.04em}
.stamp-anim{animation:stampIn .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes stampIn{0%{transform:scale(2.2) rotate(-14deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(-6deg);opacity:.92}}
.next-list{display:grid;gap:10px}
.next{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);text-decoration:none;color:inherit}
.next:hover{border-color:var(--ink-3)}
.next .why{font-size:.85rem;color:var(--ink-2)}
.num-badge{font-family:var(--f-mono);font-size:.78rem;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;border:1.5px solid var(--ink);font-weight:500}

/* ---------- mapa ---------- */
.clusters{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:14px}
.cluster{border-top:6px solid var(--cc);background:var(--sheet);border-radius:0 0 var(--r) var(--r);border-left:1px solid var(--rule);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:14px;display:grid;gap:10px;align-content:start}
.cluster h3{color:var(--cc);font-stretch:80%;font-size:1.05rem;text-transform:uppercase;letter-spacing:.03em}
.cluster p{font-size:.84rem;color:var(--ink-2)}
.area-btn{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid var(--rule);background:var(--paper);padding:8px 10px;border-radius:var(--r);cursor:pointer;font-weight:600;font-size:.88rem;transition:transform .15s ease,border-color .15s}
.area-btn:hover{border-color:var(--cc);transform:translateX(2px)}
.area-btn.dim{opacity:.32}
.area-btn.link{border-color:var(--cc);box-shadow:inset 3px 0 0 var(--cc)}
.area-btn.sel{background:var(--cc);color:var(--sheet);border-color:var(--cc)}
.area-btn .pres{font-family:var(--f-mono);font-size:.68rem;font-weight:500;color:var(--ink-3)}
.area-btn.sel .pres{color:inherit;opacity:.85}
.presence{display:inline-block;width:40px;height:6px;border-radius:3px;background:var(--sheet-3);position:relative;overflow:hidden;flex:none}
.presence i{position:absolute;inset:0 auto 0 0;background:var(--cc)}
.area-btn.sel .presence{background:rgba(255,255,255,.35)}
.area-btn.sel .presence i{background:var(--sheet)}
.drawer{border:1px solid var(--rule);border-top:6px solid var(--cc);border-radius:0 0 var(--r) var(--r);background:var(--sheet);padding:20px;display:grid;gap:16px}
.lvl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.lvl{grid-template-columns:minmax(0,1fr)}}
.lvl>div{border:1px solid var(--rule);border-radius:var(--r);padding:10px;background:var(--paper);font-size:.88rem;display:grid;gap:4px;align-content:start}
.lvl b{font-size:.92rem}
.ladder{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.85rem}
.ladder span{padding:4px 8px;border-radius:4px;background:var(--sheet-2)}
.ladder i{font-style:normal;color:var(--ink-3)}

/* ---------- simulador ---------- */
.sim-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.sim-card{display:grid;gap:12px;align-content:start;padding:18px;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);text-decoration:none;color:inherit;position:relative}
.sim-card:hover{border-color:var(--ink-3)}
.sim-card .meta{display:flex;gap:6px;flex-wrap:wrap}
.sim-card .done{position:absolute;top:12px;right:12px}
.sim-shell{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:22px;align-items:start}
@media (max-width:999px){.sim-shell{grid-template-columns:minmax(0,1fr)}}
.side{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));display:grid;gap:14px}
@media (max-width:999px){.side{position:static}}
.gauges{display:grid;gap:9px}
.gauge{display:grid;grid-template-columns:96px minmax(0,1fr) 30px;gap:8px;align-items:center;font-size:.8rem}
.gauge .bar{height:7px}
.gauge.up .bar>i{background:var(--ok)} .gauge.down .bar>i{background:var(--bad)}
.clock{font-family:var(--f-mono);font-size:1.6rem;font-weight:500;letter-spacing:.02em}
.msg{border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);overflow:hidden}
.msg-head{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--rule);background:var(--sheet-2);flex-wrap:wrap}
.msg-head .from{display:grid;gap:1px;min-width:0}
.msg-head .from b{font-size:.95rem}
.msg-head .from span{font-size:.8rem;color:var(--ink-2)}
.ch{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.ch .ic{width:16px;height:16px}
.msg-body{padding:16px;display:grid;gap:12px}
.msg-body h2{font-size:1.3rem}
.msg-body blockquote{margin:0;padding:10px 14px;border-left:3px solid var(--ink-3);background:var(--paper);border-radius:0 var(--r) var(--r) 0;font-size:.95rem}
.attach{display:flex;gap:8px;flex-wrap:wrap}
.doc{border:1px solid var(--rule);background:var(--paper);border-radius:4px;padding:16px;font-size:.88rem;display:grid;gap:8px;position:relative}

.ask{border:1px dashed var(--ink-3);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px;background:transparent}

.outcome{border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);overflow:hidden;animation:rise .35s ease both}

.outcome-head .ic{width:20px;height:20px}
.outcome-head{display:flex;gap:10px;align-items:center;padding:10px 16px;font-weight:700}
.outcome-head.q-buena{background:var(--ok-soft);color:var(--ok)}
.outcome-head.q-aceptable{background:var(--warn-soft);color:var(--warn)}
.outcome-head.q-riesgosa{background:var(--bad-soft);color:var(--bad)}
.outcome-body{padding:14px 16px;display:grid;gap:12px}
.pro{border-left:3px solid var(--stamp);padding-left:12px;display:grid;gap:6px}

.fx{display:flex;gap:6px;flex-wrap:wrap}
.order-list{display:grid;gap:6px}
.order-item{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);font-size:.9rem}

.order-item .mv{display:flex;gap:4px}
.order-item .mv button{width:30px;height:30px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);cursor:pointer;font-family:var(--f-mono)}
.timeline{display:grid;gap:0;border-left:2px solid var(--rule);margin-left:8px}
.tl{display:grid;gap:4px;padding:0 0 16px 18px;position:relative}
.tl::before{content:"";position:absolute;left:-7px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--sheet);border:2px solid var(--ink-3)}
.tl.q-buena::before{border-color:var(--ok);background:var(--ok)}
.tl.q-aceptable::before{border-color:var(--warn);background:var(--warn)}
.tl.q-riesgosa::before{border-color:var(--bad);background:var(--bad)}
.tl .t{font-family:var(--f-mono);font-size:.74rem;color:var(--ink-3)}
.progress-dots{display:flex;gap:4px;flex-wrap:wrap}
.progress-dots i{width:18px;height:5px;border-radius:2px;background:var(--sheet-3)}
.progress-dots i.d{background:var(--ink-2)} .progress-dots i.c{background:var(--stamp)}
.rating{display:flex;gap:6px;flex-wrap:wrap}
.rating button{min-width:44px;height:40px;border:1px solid var(--rule);background:var(--sheet);border-radius:var(--r);cursor:pointer;font-family:var(--f-mono);font-weight:500}
.rating button[aria-pressed="true"]{background:var(--stamp);color:var(--stamp-ink);border-color:var(--stamp)}
.togs{display:flex;gap:6px;flex-wrap:wrap}
.togs button{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:6px 11px;font-size:.83rem;cursor:pointer;font-weight:600;color:var(--ink-2)}

.togs button[aria-pressed="true"].no{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.togs button[aria-pressed="true"].neu{background:var(--stamp-soft);color:var(--stamp);border-color:var(--stamp)}

/* ---------- academia ---------- */
.concept-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.concept{display:grid;gap:8px;padding:14px;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);text-decoration:none;color:inherit;align-content:start}
.concept:hover{border-color:var(--ink-3)}
.dual{display:grid;gap:16px}
.lens{padding:20px;border-radius:var(--r);border:1px solid var(--rule);background:var(--sheet);display:grid;gap:12px}
.lens.simple{background:var(--paper)}
.compare2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

.steps{counter-reset:s;display:grid;gap:0}
.steps>div{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;padding:12px 0;border-top:1px solid var(--rule)}

.steps .who{font-size:.8rem;color:var(--ink-3)}

.compat{display:grid;gap:8px}

.conf{display:flex;gap:2px}
.conf i{width:10px;height:10px;border-radius:2px;background:var(--sheet-3)}
.conf i.on{background:var(--ink-2)}
.ev{font-size:.86rem;display:grid;gap:4px;padding:6px 10px 12px;color:var(--ink-2)}
.ev li{margin-left:1rem}
.pill-k{font-family:var(--f-mono);font-size:.7rem;padding:1px 6px;border-radius:3px;background:var(--sheet-2);color:var(--ink-2)}

/* ---------- taller ---------- */
.tool-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:14px}

.mx select{padding:4px 6px;width:auto}

.kanban{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}

.kcol h4{font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);padding:2px 4px}
.kcard{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:8px;font-size:.82rem;display:grid;gap:6px}

.chart text{font-family:var(--f-mono);font-size:10px;fill:var(--ink-3)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.check-item{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);font-size:.9rem;cursor:pointer}
.check-item input{margin-top:3px;accent-color:var(--stamp);width:18px;height:18px;flex:none}
.check-item.ok{border-color:var(--ok);background:var(--ok-soft)}

/* ---------- sectores ---------- */
.versus{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}

.flow{display:grid;gap:0}
.flow>div{display:grid;grid-template-columns:70px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px dashed var(--rule);font-size:.88rem}
.flow .d{font-family:var(--f-mono);font-size:.74rem;color:var(--ink-3)}
.regimen{border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);padding:14px;display:grid;gap:8px;align-content:start}
.regimen .code{font-family:var(--f-display);font-weight:900;font-stretch:70%;font-size:1.6rem;color:var(--stamp)}
.subsys{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:8px}
.subsys>div{padding:10px;border-radius:var(--r);background:var(--sheet-2);font-size:.84rem;display:grid;gap:3px}

 {id:"s3", t:"09:30", ch:"whatsapp", from:"Fernando Salas · Gerente Comercial", title:"«Pásame los CV que tengas»",

 {id:"s4", t:"10:15", ch:"presencial", from:"Sala de entrevistas", title:"Entrevista con Lucía Flores",
  body:"<p>Lucía llega puntual. Tienes 45 minutos. Tu guía de entrevista tiene espacio para <b>tres preguntas principales</b>. ¿Cuáles usas?</p>",
  type:"pick",
  pick:{prompt:"Elige tres preguntas.", min:3, max:3,
   items:[

    {id:"q2",label:"«¿Cómo organizas a tus hijos cuando te toca turno de sábado?»"},

   explain:{q1:"Pregunta conductual (método STAR): busca evidencia de lo que hizo, no de lo que diría.",q2:"Indaga la situación familiar. Es irrelevante para medir competencias y abre la puerta a una decisión discriminatoria.",q3:"Conductual y técnica: valida control de inventarios con un caso real.",q4:"Cerrada y autoevaluativa: casi todos dicen que sí. No aporta evidencia.",q5:"Hipotética: útil como complemento, pero mide lo que la persona cree que haría, no lo que hizo.",q6:"Pregunta discriminatoria. Las decisiones de empleo no pueden basarse en la maternidad o el plan familiar.",q7:"Conductual: explora manejo de desacuerdos con la autoridad, clave en un supervisor."}},
  fxBy:{buena:{calidad:10,cumplimiento:4,personas:4},aceptable:{calidad:3},riesgosa:{cumplimiento:-15,personas:-10,calidad:-4}},
  sig:{per:2,pro:1}, tags:["entrevistar"],
  outBy:{buena:"Lucía da ejemplos concretos: implementó un control de vencimientos que redujo mermas y una vez enfrentó a un almacenero que firmaba guías sin contar. Tienes evidencia, no impresiones.",aceptable:"La entrevista fluye, pero algunas respuestas son genéricas: tus preguntas dejaron espacio para frases como «soy muy ordenada».",riesgosa:"Lucía contesta incómoda y al final pregunta si eso influye en la decisión. Si un postulante denuncia trato discriminatorio, la empresa tendría que explicar por qué esas preguntas estaban ahí."},
  pro:"La entrevista por competencias pide hechos del pasado (situación, tarea, acción, resultado). Las preguntas sobre hijos, embarazo, estado civil o religión no miden nada del puesto y exponen a la empresa a un reclamo por discriminación."},
 {id:"s5", t:"11:30", ch:"llamada", from:"Ing. Walter Quispe", title:"«A la señora Flores no»",
  body:"<blockquote>Vi el CV de Flores que me mandaste. Tiene dos hijos, va a faltar a cada rato y en el almacén se necesita alguien que aguante. Prefiero un hombre para ese puesto. Sácala y pon a Mendoza, que ya lo conozco.</blockquote>",
  choices:[
   {id:"a", label:"Hacerle caso: es su equipo y él será el jefe.", fx:{confianza:6,cumplimiento:-18,personas:-10,calidad:-6}, sig:{per:-1}, q:"riesgosa", tags:["negociar"],
    out:"Retiras a Lucía. Nadie se entera… hasta que en la entrevista de salida de otra trabajadora aparece la frase «aquí no contratan mujeres con hijos». Rocío te pregunta qué pasó con ese proceso.",
    pro:"RR.HH. no es un ejecutor de preferencias personales. Excluir a una candidata por tener hijos o por su sexo es discriminación en el acceso al empleo. Ceder aquí también enseña al jefe que el criterio de RR.HH. es negociable."},
   {id:"b", label:"Mantenerla en la terna y explicarle a Walter, con calma, que la decisión se basará en evidencia de competencias; ofrecerle ver la entrevista de ella el jueves.", fx:{confianza:-3,cumplimiento:10,personas:6,calidad:6,agenda:-4}, sig:{per:2,nor:2,res:2}, q:"buena", set:["defendio"], tags:["negociar","normativa"],
    out:"Walter refunfuña: «Bueno, pero si no aguanta, es tu responsabilidad». Le dices que la evaluación será con los mismos criterios para los tres. Después informas a Rocío en un correo breve, sin adjetivos.",
    pro:"El argumento que funciona con jefes operativos no es el sermón, es el método: mismos criterios, misma entrevista, evidencia escrita. Dejar constancia con tu jefa protege a la empresa y a ti. Mendoza no cumple el requisito de supervisión: incluirlo por amistad debilita la terna."},
   {id:"c", label:"No discutir con Walter y escalar el caso a Rocío para que ella lo resuelva.", fx:{confianza:-2,cumplimiento:6,agenda:-2}, sig:{nor:1,pro:1}, q:"aceptable", tags:["coordinar"],
    out:"Rocío habla con Walter y el tema se resuelve, pero te dice: «La próxima vez intenta primero tú; luego me cuentas».",

 {id:"s7", t:"14:30", ch:"llamada", from:"Referencia laboral de Marco Ticona", title:"Una referencia ambigua",

 {id:"s8", t:"16:00", ch:"reunion", from:"Rocío Mamani · Jefa de RR.HH.", title:"La oferta",
  body:"<p>Tras las entrevistas, tu evaluación queda así: <b>Marco 4.4/5</b>, <b>Patricia 4.1/5</b>, <b>Lucía 3.8/5</b>. Marco pide S/ 4,200; la banda llega a S/ 3,900. Patricia pide S/ 3,700 y necesita tres semanas para mudarse; el inventario empieza en 12 días. Rocío te pregunta: «¿Qué propones?»</p>",

    out:"Rocío aprueba. Marco pide un día para pensarlo; al día siguiente acepta: «lo que me convenció fue que el ingreso anual es mayor de lo que creía». Si no hubiera aceptado, Patricia seguía disponible.",
    pro:"Una oferta se negocia en términos de compensación total anual, no solo de sueldo mensual. Tener un plan B ya conversado evita negociar desde la desesperación."},
   {id:"c", label:"Elegir a Patricia: está dentro de banda y no hay que negociar.", fx:{calidad:2,cumplimiento:4,confianza:-4}, sig:{pro:1,nor:1}, q:"aceptable", tags:["planificar"],
    out:"Patricia acepta, pero llega tres semanas después: el inventario arranca sin supervisor y Walter lo cubre él solo otra vez.",
    pro:"Decidir solo por facilidad de negociación ignora la restricción que más importaba aquí: la fecha. Antes de descartar al primero, se intenta cerrar con él."}
  ]},

  sig:{pro:1,cre:1}, tags:["redactar","presentar"],

 {id:"m7", t:"16:00", ch:"correo", from:"Para: Subgerente de RR.HH.", title:"Redacta el informe técnico",

   model:"<p><b>INFORME N.° ___-2026-SGRH/MDVAS</b></p><p><b>A:</b> Gerente Municipal · <b>De:</b> Subgerente de Recursos Humanos · <b>Asunto:</b> Pedido del Sindicato CAS sobre gratificación de diciembre 2026 · <b>Referencia:</b> Expediente N.° ___</p><p><b>I. Antecedentes:</b> Con fecha ___, el Sindicato de Trabajadores CAS solicita que se confirme el pago de una gratificación equivalente a una remuneración completa en diciembre.</p><p><b>II. Base legal:</b> D.Leg. 1057 modificado por la Ley 32563; reglamento aprobado por D.S. 142-2026-EF; Ley de Presupuesto del Sector Público para el Año Fiscal 2026.</p><p><b>III. Análisis:</b> La Ley 32563 reconoce la gratificación; su reglamento dispone una implementación progresiva hasta 2030. Corresponde aplicar el porcentaje que el cronograma fija para el año, con cargo al presupuesto institucional.</p><p><b>IV. Conclusiones:</b> El pago de diciembre procede en el porcentaje establecido por el cronograma oficial, no necesariamente al 100%.</p><p><b>V. Recomendaciones:</b> Responder al sindicato con esta información; solicitar a Presupuesto la previsión de recursos; programar una reunión informativa.</p>"},

/* Academia: cada concepto tiene versión sencilla y profesional, práctica, errores, medición, contraste deficiente/bien hecho y una pregunta de comprobación. */
LV.concepts = [
 {id:"onboarding", n:"Onboarding: de la oferta aceptada al día 90", areas:["onboarding"], sims:["semana","seleccion"], tools:["induccion"],
  simple:"<p>Imagina que te mudas a una ciudad nueva. Alguien te puede dar las llaves y desaparecer, o puede mostrarte dónde comprar, cómo moverte y presentarte a los vecinos. En ambos casos «llegaste», pero solo en el segundo empiezas a vivir bien.</p><p>El onboarding es eso en el trabajo: todo lo que pasa desde que alguien acepta la oferta hasta que ya se mueve solo en su puesto. No es una charla de bienvenida; es un proceso de varias semanas.</p>",
  tech:"<p>El onboarding (incorporación) integra tres planos: <b>administrativo-legal</b> (contrato, alta en T-Registro el día de ingreso, afiliación pensionaria, inducción de SST previa al inicio de tareas), <b>funcional</b> (inducción al puesto, objetivos de los primeros 90 días, mentor o padrino) y <b>cultural-social</b> (normas implícitas, red de relaciones). Suele cerrar con la evaluación del periodo de prueba (en el régimen privado general, tres meses, art. 10 del TUO del D.Leg. 728).</p>",
  steps:[["Pre-ingreso","Documentos, examen médico, equipo, accesos, comunicación al equipo de que llega alguien","RR.HH., TI, jefe"],["Día 1","Bienvenida, alta en T-Registro, inducción SST, recorrido, presentación al equipo, tareas simples del día","RR.HH. y jefe"],["Semana 1","Inducción al puesto, procesos clave, mentor asignado, objetivos claros","Jefe y mentor"],["Mes 1","Primera reunión de seguimiento, ajustes, capacitaciones específicas","Jefe y RR.HH."],["Día 60–90","Evaluación del periodo de prueba, encuesta de incorporación, plan de desarrollo","Jefe y RR.HH."]],
  measure:["Rotación temprana (salidas antes de 90 días)","Tiempo hasta la productividad esperada","Encuesta de incorporación a los 30 y 90 días"],
  errors:["Confundir onboarding con una charla de un día","No tener el equipo o los accesos listos el día 1","Dejar al nuevo «observando» sin tareas","No hacer seguimiento después de la primera semana"],
  bad:"Llega el lunes, nadie lo espera, su laptop llega el jueves, «observa» toda la semana y en el mes 2 renuncia diciendo que «no era lo que esperaba».",
  good:"Recibe un correo el viernes previo con su agenda, el lunes tiene escritorio, accesos, alta y SST hecha; un mentor almuerza con él; en la semana 4 su jefe revisa con él tres objetivos claros.",
  norma:["TUO D.Leg. 728 (D.S. 003-97-TR), art. 10: periodo de prueba","Ley 29783: capacitación de SST al ingreso","Orientación SUNAT: alta en T-Registro el día de ingreso"],
  check:{q:"Un nuevo trabajador renuncia a los 45 días. ¿Qué indicador te ayuda a saber si es un problema del proceso de incorporación?",o:["El tiempo de cobertura de la vacante","La rotación temprana (salidas antes de 90 días)","La tasa de ausentismo general","La satisfacción con la capacitación"],a:1,why:"La rotación temprana mide justamente cuántas personas se van durante la incorporación; si es alta, el problema suele estar en el onboarding o en la selección."}},
 {id:"perfil", n:"Perfil de puesto", areas:["reclutamiento","do"], sims:["seleccion","municipal"], tools:["cvs"],
  simple:"<p>Es la ficha que describe qué hace un puesto y qué necesita quien lo ocupe. Sin perfil, cada persona que entrevista busca algo distinto, como si tres jueces evaluaran un concurso sin reglas.</p>",
  tech:"<p>Contiene misión, funciones, requisitos de formación y experiencia, conocimientos, competencias y condiciones. En el sector privado es un documento interno; en el Estado, los perfiles siguen la metodología de SERVIR y forman parte del Manual de Perfiles de Puestos (MPP). Los requisitos deben ser verificables y estar relacionados con el puesto: incluir edad, sexo o «buena presencia» puede ser discriminatorio (Ley 26772).</p>",
  measure:["Coherencia entre perfil y puesto real (validación con el jefe)","Proporción de candidatos que cumplen requisitos"],
  errors:["Copiar perfiles de internet","Requisitos inflados que nadie cumple","Requisitos discriminatorios","No actualizarlo cuando el puesto cambia"],
  bad:"«Se busca asistente proactivo, de 25 a 30 años, con buena presencia y 5 años de experiencia» para un puesto que en realidad necesita a alguien con un año de experiencia.",
  good:"Misión clara, 5 a 7 funciones principales, requisitos mínimos verificables y deseables separados, competencias con conductas observables.",
  norma:["Ley 26772 (no discriminación en ofertas de empleo)","Metodología de perfiles de puestos de SERVIR (sector público)"],
  check:{q:"¿Cuál de estos requisitos es legítimo para un perfil de supervisor de almacén?",o:["Varón, para que «lo respeten»","Menor de 35 años","Tres años supervisando personal de almacén","Buena presencia"],a:2,why:"Es verificable y está directamente relacionado con el puesto. Los otros son discriminatorios o irrelevantes."}},
 {id:"entrevista", n:"Entrevista por competencias", areas:["reclutamiento"], sims:["seleccion"], tools:["preguntas"],
  simple:"<p>La mejor pista de cómo actuará alguien es cómo actuó antes. Por eso, en lugar de preguntar «¿eres responsable?» (todos dicen que sí), se pide un ejemplo real: «cuéntame de una vez en que…».</p>",
  tech:"<p>La entrevista conductual estructurada usa preguntas sobre hechos pasados ligadas a competencias del perfil y explora cada respuesta con el método STAR: Situación, Tarea, Acción y Resultado. Es más predictiva que la entrevista libre. Se registra con una escala anclada (qué conducta corresponde a cada puntaje) y se aplica igual a todos los candidatos para comparar con justicia.</p>",
  steps:[["Antes","Elegir 3 a 5 competencias del perfil y preparar una pregunta por competencia","Analista"],["Durante","Preguntar, repreguntar hasta obtener acción y resultado concretos, tomar notas literales","Analista y jefe"],["Después","Puntuar con la escala anclada antes de comentar con otros evaluadores","Cada evaluador"]],
  measure:["Correlación entre puntaje de entrevista y desempeño posterior","Acuerdo entre evaluadores"],
  errors:["Preguntas hipotéticas o cerradas","Efecto halo (una buena impresión contamina todo)","Preguntas sobre vida personal","Decidir en los primeros minutos"],
  bad:"«¿Cuál es tu mayor defecto?» y «¿Tienes hijos?», luego decidir por «buena vibra».",
  good:"«Cuéntame de una vez en que tuviste que corregir a alguien de tu equipo. ¿Qué hiciste exactamente? ¿Qué pasó después?», con notas y puntaje anclado.",
  norma:["Ley 26772","Ley 29733 (datos personales de postulantes)"],
  check:{q:"¿Qué falta en esta respuesta?: «Siempre trato de escuchar a mi equipo y llegar a acuerdos».",o:["Nada, es una buena respuesta","Una situación y una acción concretas","Más entusiasmo","Mencionar valores de la empresa"],a:1,why:"Es una declaración general. STAR exige un caso real: qué pasó, qué hizo la persona y con qué resultado."}},
 {id:"planilla", n:"Planilla, boleta, T-Registro y PLAME", areas:["nomina","adm-personal"], sims:["planillas"], tools:["boleta"],
  simple:"<p>La planilla es la lista de lo que se paga a cada trabajador. La boleta es el comprobante que recibe cada persona. Y el Estado tiene dos registros: uno de quiénes trabajan en la empresa (T-Registro) y otro de cuánto se les pagó y cuánto se aportó (PLAME).</p>",
  tech:"<p>La <b>Planilla Electrónica</b> tiene dos componentes administrados por SUNAT: el <b>T-Registro</b> (datos del trabajador, altas y bajas; el alta se hace dentro del día de ingreso) y la <b>PLAME</b> (declaración mensual de remuneraciones, descuentos y aportes). La boleta detalla ingresos (básico, asignación familiar, horas extras), descuentos (sistema pensionario: ONP o AFP; renta de quinta categoría) y aportes del empleador (EsSalud, 9%). En el sector público, además, la planilla se registra en el AIRHSP del MEF.</p>",
  steps:[["Día a día","Registrar novedades: ingresos, ceses, horas extras, faltas, licencias","Asistente"],["Antes del cierre","Validar asistencia y novedades con los jefes","Asistente y jefes"],["Cierre","Calcular, revisar, aprobar","Analista y jefe"],["Pago","Abono en cuentas y entrega de boletas","Tesorería"],["Declaración","PLAME según cronograma de SUNAT","Analista o contador"]],
  measure:["Errores por planilla","Reclamos por boleta","Cumplimiento de plazos de declaración"],
  errors:["Registrar el alta días después del ingreso","No actualizar conceptos ligados a la RMV","Errores en cuentas bancarias","No conciliar planilla con contabilidad"],
  bad:"Se procesan las horas extras «a ojo», se olvida la asignación familiar de un nuevo hijo y la boleta llega tarde.",
  good:"Novedades cerradas con evidencia, doble verificación de cambios sensibles (cuentas, sueldos) y conciliación mensual con contabilidad.",
  norma:["D.S. 018-2007-TR y modificatorias (Planilla Electrónica)","Ley 26790 (EsSalud)","D.S. 015-2026-TR (RMV de S/ 1,230 desde el 1 de octubre de 2026)"],
  check:{q:"Un trabajador ingresa el lunes. ¿Hasta cuándo debe registrarse su alta en el T-Registro?",o:["Hasta fin de mes","Dentro del mismo día de ingreso","En los 5 días hábiles siguientes","Cuando se pague su primera remuneración"],a:1,why:"Según la orientación de SUNAT, el alta se realiza dentro del día en que el trabajador ingresa a prestar servicios."}},
 {id:"beneficios", n:"Beneficios sociales en el régimen privado", areas:["nomina","compensaciones","laboral"], sims:["planillas"], tools:["boleta"],
  simple:"<p>Además del sueldo mensual, la ley da al trabajador del régimen privado otros pagos: dos gratificaciones al año (julio y diciembre), un ahorro para cuando deje el trabajo (CTS), 30 días de vacaciones pagadas y, si tiene hijos, una asignación familiar.</p>",
  tech:"<ul><li><b>Gratificaciones</b> (Ley 27735): una remuneración en julio y otra en diciembre, por semestres completos o proporcional; más la bonificación extraordinaria equivalente al aporte de EsSalud (9%).</li><li><b>CTS</b> (D.S. 001-97-TR): depósitos semestrales en mayo y noviembre.</li><li><b>Vacaciones</b> (D.Leg. 713): 30 días calendario por año completo de servicios, con récord vacacional; pueden fraccionarse según la norma.</li><li><b>Asignación familiar</b> (Ley 25129): 10% de la RMV para quien tiene hijos menores de edad (o mayores cursando estudios superiores, hasta los 24 años). Con la RMV de S/ 1,230, son S/ 123.</li></ul><p>Los regímenes especiales (micro y pequeña empresa, agrario, construcción civil) tienen reglas distintas.</p>",
  measure:["Provisiones contables correctas","Reclamos por beneficios"],
  errors:["Aplicar reglas del régimen general a una microempresa registrada en el REMYPE","Olvidar la bonificación del 9%","No actualizar la asignación familiar cuando sube la RMV"],
  bad:"Una trabajadora que ingresó en mayo cree que en diciembre le toca la mitad, porque nadie se lo explicó.",
  good:"RR.HH. publica cada semestre una nota breve: qué se paga, cuándo, cómo se calcula y a quién consultar.",
  norma:["Ley 27735","D.S. 001-97-TR","D.Leg. 713","Ley 25129","Ley 30334 (bonificación extraordinaria)"],
  check:{q:"Con la RMV vigente desde el 1 de octubre de 2026, ¿cuánto es la asignación familiar?",o:["S/ 113","S/ 123","S/ 130","Depende del sueldo del trabajador"],a:1,why:"Es el 10% de la RMV: 10% de S/ 1,230 = S/ 123, sin importar cuánto gane el trabajador."}},
 {id:"rotacion", n:"Rotación de personal", areas:["analytics","clima","onboarding"], sims:["semana"], tools:["rotacion"],
  simple:"<p>Es qué tan seguido se va la gente. Si de cada 10 personas se van 4 al año, hay que preguntarse por qué, porque cada salida cuesta: hay que buscar, contratar y entrenar a otra persona.</p>",
  tech:"<p>Tasa de rotación del periodo = salidas ÷ promedio de trabajadores del periodo × 100. Se desagrega en <b>voluntaria</b> (renuncias) e <b>involuntaria</b> (despidos, no renovaciones), por área, por antigüedad (temprana: antes de 90 días) y por desempeño (perder buenos trabajadores es peor que perder a los de bajo desempeño). Las fuentes de causa son las entrevistas de salida, las encuestas de clima y los datos de planilla.</p>",
  measure:["Rotación total, voluntaria e involuntaria","Rotación temprana","Rotación de talento clave","Costo de reemplazo"],
  errors:["Usar la dotación inicial en vez del promedio","Mirar solo el total sin desagregar","Concluir «es normal en el sector» sin comparar"],
  bad:"«Este año se fueron 18, como siempre.»",
  good:"«La rotación fue 40%; la mitad se fue antes de 90 días y casi la mitad era de housekeeping. Proponemos dos acciones y las mediremos mes a mes.»",
  norma:[],
  check:{q:"Una empresa empezó el año con 80 trabajadores y terminó con 100. Hubo 18 salidas. ¿Cuál es la rotación anual?",o:["18%","20%","22.5%","25%"],a:1,why:"Promedio = (80 + 100) ÷ 2 = 90. Rotación = 18 ÷ 90 × 100 = 20%."}},
 {id:"ausentismo", n:"Ausentismo laboral", areas:["analytics","bienestar","adm-personal"], sims:["planillas"], tools:["rotacion"],
  simple:"<p>Es el tiempo de trabajo que se pierde porque las personas no están cuando deberían estar. Una falta aislada no dice mucho; un patrón (muchos lunes, un área en particular) sí.</p>",
  tech:"<p>Tasa de ausentismo = días (u horas) perdidos ÷ días (u horas) programados × 100. Se clasifica por causa: enfermedad (descansos médicos), accidentes, permisos, faltas injustificadas. El análisis se hace de forma agregada: los datos de salud son datos sensibles (Ley 29733) y no deben usarse para decisiones individuales discriminatorias.</p>",
  measure:["Tasa de ausentismo por área y causa","Frecuencia y duración de ausencias"],
  errors:["Tratar todo ausentismo como falta de compromiso","Usar diagnósticos médicos para decidir renovaciones"],
  bad:"El gerente pide la lista de quiénes tienen más descansos médicos para no renovarlos.",
  good:"El análisis agregado muestra que el ausentismo de cocina se dispara tras los turnos dobles; se ajusta la programación.",
  norma:["Ley 29733","Ley 29783"],
  check:{q:"En un mes con 22 días laborables y 30 trabajadores, se perdieron 33 días por ausencias. ¿Cuál es la tasa?",o:["1.1%","5%","10%","3.3%"],a:1,why:"Días programados = 22 × 30 = 660. Tasa = 33 ÷ 660 × 100 = 5%."}},
 {id:"clima", n:"Clima laboral (y por qué no es lo mismo que cultura)", areas:["clima","cultura"], sims:["semana"], tools:["clima"],
  simple:"<p>El clima es el «estado de ánimo» del lugar de trabajo hoy: si la gente siente buen trato, claridad, reconocimiento. La cultura es más profunda, como la personalidad: lo que de verdad se premia y se tolera. El clima cambia en meses; la cultura, en años.</p>",
  tech:"<p>El clima se mide con encuestas por dimensiones (liderazgo, comunicación, condiciones, reconocimiento, equidad), con tasa de participación suficiente y garantía de anonimato (no reportar grupos muy pequeños). Su valor está en los planes de acción por área y en volver a medir. Se triangula con entrevistas de salida, rotación y ausentismo.</p>",
  measure:["Índice de clima por dimensión y área","Participación","eNPS («¿recomendarías trabajar aquí?»)","Avance de planes de acción"],
  errors:["Medir y no hacer nada","Romper el anonimato desagregando grupos de 3 personas","Leer solo el promedio general"],
  bad:"Se aplica la encuesta, se presenta un promedio de 3.4 y nadie vuelve a hablar del tema hasta el año siguiente.",
  good:"Se identifican las dos dimensiones más bajas en las áreas críticas, se acuerdan acciones con los jefes y se mide de nuevo en seis meses con un pulso corto.",
  norma:[],
  check:{q:"En una encuesta, un área de 3 personas tiene el puntaje más bajo. ¿Qué haces?",o:["Analizar las respuestas una por una","Reportarla por separado en el informe","Agregarla a un grupo mayor para no romper el anonimato","Eliminarla del análisis"],a:2,why:"Con grupos muy pequeños es posible identificar a quién respondió qué. Se agregan para proteger el anonimato."}},
 {id:"desempeno", n:"Evaluación del desempeño y gestión del rendimiento", areas:["desempeno"], sims:["capacitacion"], tools:[],
  simple:"<p>Es acordar al inicio qué se espera de cada persona, conversar durante el año sobre cómo va y, al final, evaluar con justicia para decidir cómo mejorar. Si solo se hace la evaluación final, es como poner nota sin haber dicho qué entraba al examen.</p>",
  tech:"<p>En el <b>sector privado</b> se usan metas SMART u OKR, competencias, evaluación 180° o 360° y calibración entre jefes. En el <b>sector público</b>, el subsistema de Gestión del Rendimiento de SERVIR establece un ciclo con etapas de planificación (metas), seguimiento (al menos una reunión formal) y evaluación, con calificaciones de rendimiento distinguido, buen rendimiento, rendimiento sujeto a observación y desaprobado. La retroalimentación es transversal.</p>",
  steps:[["Inicio","Fijar metas y comunicarlas","Jefe y colaborador"],["Medio año","Seguimiento formal, ajustes","Jefe y colaborador"],["Cierre","Evaluación con evidencia, calibración","Jefe y RR.HH."],["Después","Plan de mejora o desarrollo","Jefe, colaborador y RR.HH."]],
  measure:["Cumplimiento del ciclo","Distribución de calificaciones","Planes de mejora implementados"],
  errors:["Metas vagas","Sesgo de lo reciente","Todos con «muy bueno»","Usarla solo para castigar"],
  bad:"En diciembre el jefe llena un formulario de 20 competencias en 5 minutos por persona, sin haber fijado metas.",
  good:"Tres a cinco metas medibles desde enero, una reunión en julio y una evaluación con evidencias que alimenta el plan de capacitación.",
  norma:["Ley 30057 y su Reglamento General (D.S. 040-2014-PCM)","Directiva del Subsistema de Gestión del Rendimiento de SERVIR"],
  check:{q:"En el modelo de SERVIR, ¿qué etapa incluye al menos una reunión formal entre evaluador y evaluado durante el ciclo?",o:["Planificación","Seguimiento","Evaluación","Calibración"],a:1,why:"El seguimiento dura buena parte del ciclo e incluye al menos una reunión formal con retroalimentación y compromisos."}},
 {id:"dnc", n:"Diagnóstico de necesidades y plan de capacitación", areas:["capacitacion"], sims:["capacitacion"], tools:["presupuesto"],
  simple:"<p>Antes de capacitar hay que saber qué falta y si de verdad se arregla con un curso. Si las ventas bajaron porque el sistema no funciona, un taller de ventas no sirve.</p>",
  tech:"<p>La DNC cruza tres niveles: organización (objetivos, indicadores), puesto (competencias requeridas) y persona (evaluaciones de desempeño, brechas). El plan prioriza por impacto y obligatoriedad (p. ej., SST: al menos cuatro capacitaciones anuales) y asigna presupuesto. La evaluación sigue el modelo de Kirkpatrick: reacción, aprendizaje, conducta y resultados. En el Estado se formaliza en el Plan de Desarrollo de las Personas (PDP).</p>",
  measure:["Ejecución del plan y del presupuesto","Transferencia al puesto (nivel 3)","Impacto en indicadores (nivel 4)"],
  errors:["Capacitar lo que se pide en lugar de lo que se necesita","Medir solo satisfacción","Ignorar barreras del entorno"],
  bad:"El plan es una lista de cursos que pidieron los jefes; se evalúa con una encuesta de satisfacción.",
  good:"Cada acción responde a una brecha identificada y se define desde el inicio qué cambio de conducta o de indicador se espera.",
  norma:["Ley 29783 (capacitaciones de SST)","Lineamientos de SERVIR para el PDP (sector público)"],
  check:{q:"Un curso tuvo 4.8/5 de satisfacción y 18/20 en la prueba, pero los errores en el trabajo no bajaron. ¿Qué nivel de Kirkpatrick falla?",o:["Reacción","Aprendizaje","Conducta (transferencia)","Ninguno"],a:2,why:"La gente aprendió (nivel 2) pero no lo aplica en el trabajo (nivel 3). La causa suele estar en el entorno."}},
 {id:"despido", n:"Falta grave y procedimiento de despido (régimen privado)", areas:["relaciones","laboral"], sims:["relaciones"], tools:[],
  simple:"<p>Una empresa puede despedir a alguien por una falta grave, pero antes tiene que contarle por escrito de qué se le acusa y darle tiempo para defenderse. Es como en un juicio: aunque todos «sepan» lo que pasó, la persona tiene derecho a dar su versión.</p>",
  tech:"<p>El TUO del D.Leg. 728 (D.S. 003-97-TR) enumera las faltas graves (art. 25). El art. 31 exige otorgar por escrito un plazo razonable <b>no menor de seis días naturales</b> para que el trabajador presente descargos, salvo falta grave flagrante en que no resulte razonable; mientras dure el trámite, el empleador puede exonerarlo de asistir sin afectar su remuneración. Luego se comunica el despido por escrito indicando la causa. Principio de inmediatez: la empresa debe actuar en un plazo razonable desde que conoce la falta. Un despido sin causa probada o sin procedimiento puede ser declarado arbitrario (con indemnización) o, en ciertos supuestos, dar lugar a reposición.</p>",
  steps:[["Hecho","Documentar: actas, testigos, pruebas","RR.HH. y jefe"],["Imputación","Carta de preaviso con hechos concretos, causal y plazo ≥ 6 días naturales","RR.HH. y legal"],["Descargo","Recibir y analizar los descargos del trabajador","RR.HH. y legal"],["Decisión","Carta de despido motivada o archivo","Empresa"]],
  measure:["Despidos confirmados judicialmente","Tiempo entre conocimiento y acción (inmediatez)"],
  errors:["Despido verbal","Imputaciones genéricas","Dejar pasar mucho tiempo (perdón tácito)","No analizar los descargos"],
  bad:"«Estás despedido, no vuelvas mañana», sin carta ni pruebas.",
  good:"Acta del hecho, prueba, carta de imputación precisa, descargo analizado, decisión escrita y motivada.",
  norma:["TUO D.Leg. 728, arts. 25, 31 y 32"],
  caso:[{t:"Casación Laboral 6903-2022 Lima",d:"Pronunciamiento sobre un despido en el que no se consideraron los descargos del trabajador, lo que vulneró su derecho de defensa.",u:"https://lpderecho.pe/despido-arbitrario-empleador-despidio-trabajador-considerar-descargos-vulnerando-derecho-defensa-casacion-laboral-6903-2022-lima/"},{t:"Casación Laboral 19087-2015 Lima",d:"Sobre imputaciones genéricas en la carta de preaviso como afectación al derecho de defensa.",u:"https://lpderecho.pe/colocar-imputaciones-genericas-carta-preaviso-despido-derecho-defensa-trabajador-cas-lab-19087-2015-lima"},{t:"Casación 1939-2017 Cañete",d:"Sobre la presunción de perdón del empleador cuando no actúa con inmediatez ante una falta grave.",u:"https://lpderecho.pe/casacion-1939-2017-canete-presuncion-perdon-empleador-falta-grave/"}],
  check:{q:"¿Cuál es el plazo mínimo para que un trabajador del régimen privado presente sus descargos ante una imputación de falta grave?",o:["48 horas","3 días hábiles","6 días naturales","15 días calendario"],a:2,why:"El art. 31 del TUO del D.Leg. 728 exige un plazo no menor de seis días naturales, salvo falta grave flagrante en que no resulte razonable."}},
 {id:"hostigamiento", n:"Hostigamiento sexual laboral: qué hace RR.HH.", areas:["relaciones","laboral","dei"], sims:["municipal"], tools:["bandeja"],
  simple:"<p>Si alguien recibe comentarios, mensajes o acercamientos de tipo sexual que no quiere en su trabajo, la organización está obligada a protegerla rápido e investigar. No se «arregla» conversando entre las partes ni moviendo a la víctima de oficina sin que ella lo pida.</p>",
  tech:"<p>Ley 27942 y su reglamento (D.S. 014-2019-MIMP). Alcanza a trabajadores de los sectores público y privado y a personas en modalidades formativas, incluso fuera del horario y en eventos de trabajo. Centros con 20 o más trabajadores tienen un Comité de intervención; con menos, un delegado. La oficina de RR.HH. dicta <b>medidas de protección en un máximo de 3 días hábiles</b> desde la queja (rotación del presunto hostigador, rotación de la víctima solo si ella lo solicita, impedimento de acercamiento o comunicación, entre otras). En el sector privado, el Comité emite su informe en 15 días calendario y la empresa decide en 10 días calendario. En el sector público, la investigación se tramita en el marco del procedimiento administrativo disciplinario con la Secretaría Técnica. Reserva y no revictimización son obligatorias.</p>",
  steps:[["Día 0","Recibir la queja, escuchar sin juzgar, informar derechos","RR.HH."],["Hasta día 3 hábil","Dictar y ejecutar medidas de protección","RR.HH."],["Siguiente","Derivar al Comité/delegado (privado) o a la Secretaría Técnica del PAD (público)","RR.HH."],["Investigación","Descargos, pruebas, informe","Comité o autoridades del PAD"],["Decisión","Sanción o archivo motivado y medidas preventivas","Empresa o entidad"]],
  measure:["Cumplimiento de plazos","Medidas de protección dictadas a tiempo","Capacitaciones preventivas anuales"],
  errors:["Mediar entre las partes","Mover a la víctima sin su pedido","Exigir pruebas o formalidades excesivas para recibir la queja","Romper la reserva"],
  bad:"Se habla «informalmente» con el jefe denunciado y se cambia de oficina a la practicante.",
  good:"En 48 horas hay resolución de medidas de protección (el jefe no puede contactarla y es reasignado temporalmente), el caso está en manos del órgano competente y el expediente es reservado.",
  norma:["Ley 27942","D.S. 014-2019-MIMP","Guía práctica del MTPE (R.M. 223-2019-TR)"],
  check:{q:"¿En qué plazo debe RR.HH. dictar medidas de protección tras recibir una queja de hostigamiento sexual?",o:["Inmediatamente, el mismo día","Máximo 3 días hábiles","15 días calendario","Cuando termine la investigación"],a:1,why:"El reglamento establece un plazo máximo de 3 días hábiles desde que se interpone la queja."}},
 {id:"regimenes", n:"Regímenes laborales del Estado y el papel de SERVIR", areas:["laboral","adm-personal","estrategica"], sims:["municipal"], tools:[],
  simple:"<p>En el Estado peruano no hay una sola forma de trabajar: en una misma oficina pueden convivir personas con cuatro tipos de contrato distintos, cada uno con sus propias reglas de ingreso, beneficios y estabilidad. SERVIR es la entidad que pone las reglas para todos y busca, poco a poco, unificarlos en un solo régimen.</p>",
  tech:"<p>Coexisten principalmente: <b>D.Leg. 276</b> (carrera administrativa, servidores nombrados), <b>D.Leg. 728</b> (régimen privado aplicado en algunas entidades y a los obreros municipales), <b>D.Leg. 1057 – CAS</b> (régimen especial que en 2026 fue modificado por la Ley 32563: contratos indeterminados vía concurso para labores permanentes, plazo máximo de cinco años para los determinados, gratificaciones y CTS con implementación progresiva) y <b>Ley 30057 – Servicio Civil</b> (régimen único al que transitan las entidades). SERVIR es el ente rector del Sistema Administrativo de Gestión de Recursos Humanos: emite directivas, opiniones técnicas vinculantes y resuelve en segunda instancia a través del Tribunal del Servicio Civil.</p>",
  measure:[],
  errors:["Aplicar a un CAS las reglas del 276","Prometer beneficios sin verificar el régimen y el presupuesto","Ignorar las opiniones técnicas de SERVIR"],
  bad:"Una ORH responde a un servidor CAS con las reglas de vacaciones del 276 porque «así se hizo siempre».",
  good:"Cada respuesta indica el régimen, la norma aplicable y, si hay duda, cita el informe técnico de SERVIR pertinente.",
  norma:["D.Leg. 1023 (crea SERVIR)","D.Leg. 276","D.Leg. 728","D.Leg. 1057 modificado por las Leyes 31131 y 32563","Ley 30057 y D.S. 040-2014-PCM","D.S. 142-2026-EF"],
  check:{q:"¿Quién emite opiniones técnicas vinculantes sobre la gestión de recursos humanos en el Estado?",o:["El MTPE","SUNAFIL","SERVIR","La Contraloría"],a:2,why:"SERVIR es el ente rector del sistema y sus informes técnicos orientan (y en ciertos casos vinculan) a las entidades."}},
 {id:"concurso", n:"Concurso público vs. selección privada", areas:["reclutamiento"], sims:["municipal","seleccion"], tools:[],
  simple:"<p>En una empresa privada, el dueño puede contratar a quien considere mejor, con el método que quiera (siempre que no discrimine). En el Estado no: como se paga con dinero público, el ingreso es por concurso abierto, con reglas publicadas y puntajes, para que gane el mérito y no el contacto.</p>",
  tech:"<p>El acceso al empleo público se basa en el mérito e igualdad de oportunidades. Para el CAS: requerimiento con perfil, certificación presupuestal, bases y cronograma, convocatoria pública (difusión en el portal Talento Perú y en el portal institucional), evaluación curricular, entrevista (con bonificaciones de ley, como licenciados de las Fuerzas Armadas y personas con discapacidad), resultados públicos y suscripción del contrato. Rige además la prohibición de nepotismo (Ley 26771, ampliada por la Ley 31299). En el sector privado, la empresa tiene amplia libertad de método, con límites de no discriminación y protección de datos.</p>",
  measure:["Concursos desiertos u observados","Tiempo del proceso"],
  errors:["Convocar sin certificación presupuestal","Bases con requisitos «a la medida» de alguien","No publicar resultados"],
  bad:"«Hazle un contrato rápido y en enero vemos el concurso.»",
  good:"Cronograma público, bases con criterios objetivos y comité que deja constancia de cada puntaje.",
  norma:["D.Leg. 1057 y su reglamento","Ley 26771 y Ley 31299 (nepotismo)","D.S. 003-2018-TR (difusión de ofertas laborales del Estado)"],
  check:{q:"¿Cuál de estos pasos va ANTES de convocar un concurso CAS?",o:["Entrevista personal","Certificación de crédito presupuestario","Publicación de resultados","Suscripción del contrato"],a:1,why:"Sin presupuesto certificado no se puede convocar."}},
 {id:"pad", n:"Procedimiento administrativo disciplinario (PAD)", areas:["relaciones","laboral"], sims:["municipal"], tools:[],
  simple:"<p>Es la forma en que el Estado investiga y sanciona a sus servidores cuando cometen faltas. Tiene autoridades definidas, plazos y garantías, porque una sanción afecta derechos.</p>",
  tech:"<p>El régimen disciplinario de la Ley 30057 se aplica a los servidores de los regímenes 276, 728 y 1057 (vigente desde el 14 de setiembre de 2014). Intervienen autoridades del procedimiento (instructora y sancionadora, según la sanción) y una <b>Secretaría Técnica</b> que precalifica y apoya. Plazos de prescripción para iniciar: tres años desde la comisión de la falta, y un año desde que la ORH (o quien haga sus veces) toma conocimiento, si ello ocurre dentro de los tres años; para ex servidores, dos años. Entre el inicio y la resolución no puede transcurrir más de un año.</p>",
  measure:["Expedientes prescritos","Tiempo de tramitación"],
  errors:["Dejar prescribir casos","Abrir PAD por lo que el reglamento interno resuelve con un descuento","No respetar las garantías del debido procedimiento"],
  bad:"Una denuncia queda en un cajón 14 meses y prescribe.",
  good:"Cada denuncia se registra, la Secretaría Técnica precalifica en plazo y el expediente avanza con control de fechas.",
  norma:["Ley 30057, Título V","Reglamento General (D.S. 040-2014-PCM)","Directiva de SERVIR sobre régimen disciplinario"],
  check:{q:"La ORH conoció una falta hace 13 meses (cometida hace 2 años) y no inició el PAD. ¿Qué ocurrió?",o:["Nada, aún hay plazo","Prescribió la acción para iniciar el PAD","Debe iniciarse con la Contraloría","Pasa automáticamente al Tribunal del Servicio Civil"],a:1,why:"Pasó más de un año desde que la ORH tomó conocimiento: prescribió la potestad para iniciar el procedimiento."}},
 {id:"hrbp", n:"HR Business Partner", areas:["hrbp"], sims:[], tools:[],
  simple:"<p>Es una persona de RR.HH. asignada a un área del negocio para ayudar a su gerente a resolver todo lo que tiene que ver con personas, como un médico de cabecera que luego te deriva al especialista.</p>",
  tech:"<p>Forma parte del modelo de tres pilares: HRBP (socios de negocio), centros de expertise (selección, compensaciones, desarrollo) y servicios compartidos (planilla, administración). El HRBP diagnostica, prioriza y orquesta; no ejecuta cada proceso. Requiere conocimiento del negocio, generalismo sólido, lectura de datos y criterio en relaciones laborales.</p>",
  measure:["Indicadores de la unidad (rotación, clima, cobertura)","Satisfacción del gerente atendido"],
  errors:["Convertirse en «tramitador» del gerente","Perder la mirada de las personas por complacer al negocio"],
  bad:"El HRBP solo reenvía pedidos a los especialistas.",
  good:"El HRBP llega al comité con datos de su unidad y una propuesta de prioridades para el trimestre.",
  norma:[],
  check:{q:"¿Cuál es la principal diferencia entre un HRBP y un analista especialista?",o:["El HRBP gana más","El HRBP integra todas las materias para una unidad; el especialista profundiza en una materia para toda la organización","El HRBP no necesita saber de leyes","No hay diferencia"],a:1,why:"El HRBP es generalista asignado a un negocio; el especialista es experto en una materia transversal."}},
 {id:"analytics", n:"People analytics y protección de datos", areas:["analytics"], sims:["semana","capacitacion"], tools:["rotacion","clima"],
  simple:"<p>Es usar datos de las personas para tomar mejores decisiones. Pero esos datos son de personas reales: hay que cuidarlos, usarlos solo para lo que se informó y no convertirlos en herramientas de discriminación.</p>",
  tech:"<p>Ciclo: pregunta de negocio → datos (planilla, asistencia, desempeño, encuestas) → limpieza → análisis descriptivo, diagnóstico o predictivo → visualización → decisión. La Ley 29733 exige finalidad legítima, proporcionalidad, seguridad y, en datos sensibles (salud, origen, vida sexual, entre otros), especial protección. Buenas prácticas: anonimizar, agregar, limitar accesos.</p>",
  measure:["Decisiones tomadas con datos","Calidad de datos"],
  errors:["Reportar sin pregunta","Usar datos de salud para decisiones individuales","Dashboards que nadie usa"],
  bad:"Un tablero con 40 gráficos que nadie abre.",
  good:"Tres indicadores elegidos con el gerente, revisados cada mes, con una acción asociada a cada uno.",
  norma:["Ley 29733 y su reglamento"],
  check:{q:"¿Qué tipo de dato requiere especial protección según la Ley 29733?",o:["El número de anexo telefónico","Los datos de salud","El puesto","La fecha de ingreso"],a:1,why:"Los datos de salud son datos sensibles."}},
 {id:"sst", n:"SST para RR.HH.", areas:["sst"], sims:["semana","capacitacion","relaciones"], tools:[],
  simple:"<p>La seguridad en el trabajo es tarea de toda la organización, y RR.HH. tiene un papel clave: que las capacitaciones ocurran, que el comité exista y que los accidentes se registren e investiguen.</p>",
  tech:"<p>Ley 29783 y D.S. 005-2012-TR: con 20 o más trabajadores, Comité de SST paritario (de 4 a 12 miembros) y Reglamento Interno de SST; con menos, un supervisor de SST. Al menos cuatro capacitaciones de SST al año, dentro de la jornada; capacitación al ingreso y ante cambios de puesto o tecnología. Exámenes médicos ocupacionales. Registros obligatorios: accidentes (se conservan 10 años), enfermedades ocupacionales (20 años), y otros (5 años); mypes y empresas sin alto riesgo pueden llevar registros simplificados.</p>",
  measure:["Índice de frecuencia y gravedad de accidentes","Cumplimiento del programa anual"],
  errors:["Creer que SST es «solo para mineras»","No registrar accidentes leves","Capacitar fuera de la jornada"],
  bad:"Un hotel de 46 trabajadores con un «supervisor» elegido hace años y sin registros.",
  good:"Comité elegido, programa anual con cuatro capacitaciones y registros al día.",
  norma:["Ley 29783","D.S. 005-2012-TR"],
  check:{q:"Una empresa tiene 46 trabajadores. ¿Qué órgano de SST le corresponde?",o:["Un supervisor de SST","Un Comité de SST paritario","Ninguno","Un delegado del MTPE"],a:1,why:"Con 20 o más trabajadores corresponde un Comité de SST paritario."}},
 {id:"compensacion", n:"Bandas salariales y equidad", areas:["compensaciones"], sims:["seleccion"], tools:[],
  simple:"<p>Una banda salarial es el rango (mínimo y máximo) que se paga por un puesto. Sirve para que dos personas que hacen el mismo trabajo no ganen muy distinto «porque uno negoció mejor».</p>",
  tech:"<p>Se construye con valuación de puestos (método de puntos o similares), encuestas de mercado y política de posicionamiento (p. ej., percentil 50). El <b>compa-ratio</b> (sueldo ÷ punto medio de la banda) indica si alguien está por debajo o por encima del centro. La Ley 30709 prohíbe la discriminación remunerativa entre varones y mujeres y exige un cuadro de categorías y funciones con criterios objetivos.</p>",
  measure:["Compa-ratio","Brecha salarial de género por categoría","Posicionamiento vs. mercado"],
  errors:["Excepciones sin criterio","Bandas desactualizadas","Ignorar la equidad interna al ofertar"],
  bad:"Un nuevo supervisor entra ganando más que los supervisores con cinco años en la empresa.",
  good:"La oferta se hace dentro de banda; las excepciones se aprueban con sustento y revisión de pares.",
  norma:["Ley 30709 y su reglamento"],
  check:{q:"Una banda va de S/ 3,200 a S/ 3,900 (punto medio S/ 3,550). Si alguien gana S/ 3,550, su compa-ratio es…",o:["0.90","1.00","1.10","0.82"],a:1,why:"3,550 ÷ 3,550 = 1.00: está exactamente en el punto medio."}}
];

function shuffle(arr, seed){
  const a = arr.slice(); let s = 0; for (const c of seed) s = (s * 31 + c.charCodeAt(0)) >>> 0;
  for (let i = a.length - 1; i > 0; i--) { s = (s * 1103515245 + 12345) >>> 0; const j = s % (i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  if (a.join() === arr.join() && a.length > 1) [a[0], a[1]] = [a[1], a[0]];
  return a;
}

N.detect = function(w, text){
  const out = {}; const t = (text || "").toLowerCase();
  w.rubric.forEach(r => { out[r.id] = r.kw.every(k => new RegExp(k, "i").test(t)); });
  return out;
};

N.evaluate = function(node){
  const t = N.tmp(node.id), type = node.type || "choice";
  if (type === "choice" || type === "info") {
    const c = node.choices.find(x => x.id === t.choice);
    return {q:c.q, fx:c.fx || {}, sig:c.sig || {}, out:c.out, pro:c.pro || node.pro, label:c.label, tags:c.tags || node.tags || [], set:c.set || [], choiceId:c.id, score:{buena:100, aceptable:60, riesgosa:20}[c.q]};
  }

    const p = node.pick, sel = t.pick.slice();
    const hits = sel.filter(x => p.ideal.includes(x)).length, wrong = sel.filter(x => (p.bad || []).includes(x)).length, extraNon = sel.filter(x => !p.ideal.includes(x)).length;
    q = (hits === p.ideal.length && wrong === 0 && extraNon === 0) ? "buena" : (wrong > 0 || hits < Math.ceil(p.ideal.length / 2)) ? "riesgosa" : "aceptable";
    if (q === "aceptable" && hits === p.ideal.length && wrong === 0) q = "buena";
    score = Math.round(A.clamp((hits - wrong) / p.ideal.length, 0, 1) * 100);
    label = sel.map(id => p.items.find(i => i.id === id).label).join(" · ");
    detail = `<div class="stack small">${p.items.map(it => { const s = sel.includes(it.id), ide = p.ideal.includes(it.id), bad = (p.bad || []).includes(it.id); const mark = s && ide ? ["ok","Bien elegido"] : s && bad ? ["bad","No debió elegirse"] : s ? ["warn","Elegido, no era de lo ideal"] : ide ? ["warn","Faltó elegirlo"] : ["", "Bien descartado"]; return `<div><span class="chip ${mark[0]}">${mark[1]}</span> <b>${esc(it.label)}</b><br><span class="muted">${(p.explain || {})[it.id] || ""}</span></div>`; }).join("")}</div>`;
    extra.picked = sel;
  } else if (type === "order") {
    const o = node.order, ord = t.order.slice();
    const pos = id => ord.indexOf(id), ip = id => o.ideal.indexOf(id);
    const dist = o.ideal.reduce((s, id) => s + Math.abs(pos(id) - ip(id)), 0);
    const n = o.ideal.length, maxD = Math.floor(n * n / 2) || 1;
    const r = 1 - dist / maxD;
    const topN = (o.mustTop || []).length + 1;
    const mustOk = (o.mustTop || []).every(id => pos(id) < topN);
    q = !mustOk ? "riesgosa" : r >= .8 ? "buena" : r >= .55 ? "aceptable" : "riesgosa";
    score = Math.round(A.clamp(r, 0, 1) * 100);
    label = ord.map((id, i) => `${i + 1}. ${o.items.find(x => x.id === id).label}`).join(" | ");
    detail = `<div class="stack small"><span class="label">Orden de referencia</span>${o.ideal.map((id, i) => `<div><b>${i + 1}. ${esc(o.items.find(x => x.id === id).label)}</b> <span class="chip ${pos(id) === i ? "ok" : Math.abs(pos(id) - i) <= 1 ? "warn" : "bad"}">tú: ${pos(id) + 1}°</span><br><span class="muted">${(o.explain || {})[id] || ""}</span></div>`).join("")}</div>`;
    extra.order = ord;
  } else if (type === "write") {
    const w = node.write, det = N.detect(w, t.text);
    const okN = w.rubric.filter(r => r.neg ? !det[r.id] : (det[r.id] || t.checks[r.id])).length;
    const negFail = w.rubric.some(r => r.neg && det[r.id]);
    const ratio = okN / w.rubric.length;
    q = negFail ? "riesgosa" : ratio >= .8 ? "buena" : ratio >= .5 ? "aceptable" : "riesgosa";
    score = Math.round(ratio * 100);
    label = "Texto redactado (" + (t.text.trim().match(/\S+/g) || []).length + " palabras)";
    detail = `<div class="stack small"><span class="label">Criterios</span>${w.rubric.map(r => { const ok = r.neg ? !det[r.id] : (det[r.id] || t.checks[r.id]); return `<div><span class="chip ${ok ? "ok" : "bad"}">${ok ? "Cumple" : "Falta"}</span> ${esc(r.label)}</div>`; }).join("")}<span class="label" style="margin-top:8px">Un modelo posible (no el único)</span><div class="doc" data-folio="Modelo">${w.model}</div></div>`;
    extra.text = t.text.slice(0, 2000);
  } else if (type === "budget") {
    const b = node.budget, sel = t.budget.slice();
    const mustOk = b.must.every(id => sel.includes(id));
    const val = sel.reduce((s, id) => s + (b.value[id] || 0), 0);
    const best = bestBudget(b);
    const r = val / best;
    q = !mustOk ? "riesgosa" : r >= .95 ? "buena" : r >= .75 ? "aceptable" : "riesgosa";
    score = Math.round((mustOk ? r : r * .4) * 100);
    label = sel.map(id => b.items.find(x => x.id === id).label).join(" · ");
    const bestSet = bestBudget(b, true);
    detail = `<div class="stack small"><span class="label">Combinación de mayor impacto dentro del presupuesto</span>${b.items.map(it => `<div><span class="chip ${bestSet.includes(it.id) ? "ok" : ""}">${bestSet.includes(it.id) ? "Incluida" : "Fuera"}</span> ${esc(it.label)} <span class="muted">(${A.money(it.cost)})</span>${b.must.includes(it.id) ? ` <span class="chip st">obligatoria</span>` : ""}${sel.includes(it.id) ? ` <span class="chip solid">tu plan</span>` : ""}</div>`).join("")}</div>`;
    extra.picked = sel;
  }
  return Object.assign({q, fx:(node.fxBy || {})[q] || {}, sig:node.sig || {}, out:(node.outBy || {})[q] || "", pro:node.pro, label, tags:node.tags || [], set:[], detail, score}, extra);

function bestBudget(b, wantSet){
  let best = 0, bestS = [];
  const n = b.items.length;

    let cost = 0, val = 0; const s = [];

    if (cost > b.limit || !b.must.every(id => s.includes(id))) continue;
    if (val > best) { best = val; bestS = s; }
  }
  return wantSet ? bestS : (best || 1);
}
