# Evita que el plan gratuito de Supabase pause el proyecto por falta de uso:
# cada 3 días hace una consulta de lectura pública (la tabla config) con la clave publicable.
name: Mantener Supabase activo
on:
  schedule:
    - cron: '17 13 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la tabla config
        run: |
          curl -fsS "https://klrwjnrrmyeflhtmxule.supabase.co/rest/v1/config?select=clave&limit=1" \
            -H "apikey: sb_publishable_luxgr3u7n4XXjtNBRz14jA_YDbgljQc" \
            -H "Authorization: Bearer sb_publishable_luxgr3u7n4XXjtNBRz14jA_YDbgljQc" > /dev/null
