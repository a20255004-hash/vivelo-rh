<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tu pago · VÍVELO RH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Onest:wght@400;500;600&display=swap">
<style>
:root{--azafran:#F2A900;--bg:#EEF7FC;--ink:#0F2A3D;--ink-2:#3C5568;--f-display:'Bricolage Grotesque',system-ui,sans-serif;--f-body:'Onest',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1F2D;--ink:#EEF7FC;--ink-2:#A9C3D4}}
:root[data-theme="dark"]{--bg:#0B1F2D;--ink:#EEF7FC;--ink-2:#A9C3D4}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--f-body);display:grid;place-items:center;min-height:100svh;padding:24px 16px;box-sizing:border-box}
main{max-width:520px;text-align:center}
h1{font:800 clamp(34px,6vw,56px)/1 var(--f-display);letter-spacing:-.03em;margin:0 0 14px;text-wrap:balance}
p{color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;min-height:50px;padding:0 24px;border-radius:999px;background:var(--azafran);color:#0F2A3D;font:600 16px/1 var(--f-body);text-decoration:none;margin:6px}
</style>
</head>
<body>
<main>
  <h1 id="t">Revisando tu pago…</h1>
  <p id="p">Esto toma unos segundos.</p>
  <p><a class="btn" href="index.html#temporadas">Ir a los puestos</a></p>
</main>
<script type="module">
const estado = new URLSearchParams(location.search).get('estado');
const T = document.getElementById('t'), P = document.getElementById('p');
if (estado === 'fallo') { T.textContent = 'El pago no se completó'; P.textContent = 'No se hizo ningún cobro. Puedes intentarlo de nuevo desde la página de precios.'; }
else if (estado === 'pendiente') { T.textContent = 'Tu pago está pendiente'; P.textContent = 'Cuando Mercado Pago lo confirme, el acceso se activa solo. Puede tardar unos minutos.'; }
else {
  // Espera a que el aviso de Mercado Pago llegue al servidor y active el acceso.
  const { db, sesionActual } = await import('./assets/cuenta.js');
  const c = await db(), s = await sesionActual();
  let listo = false;
  for (let i = 0; i < 10 && c && s && !listo; i++) {
    const { data } = await c.from('pedidos').select('estado').eq('user_id', s.user.id).order('creado', { ascending: false }).limit(1);
    listo = data?.[0]?.estado === 'pagado';
    if (!listo) await new Promise(r => setTimeout(r, 3000));
  }
  T.textContent = listo ? '¡Listo! Tu acceso está activo' : 'Pago recibido';
  P.textContent = listo ? 'Ya puedes jugar todos los días que compraste.' : 'Mercado Pago aún está confirmando. Tu acceso se activará en unos minutos; si no aparece, escribe a lmamanicam@unjbg.edu.pe.';
}
</script>
</body>
</html>
