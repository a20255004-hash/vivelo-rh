<!doctype html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Laboratorio · VÍVELO RH</title>
<meta name="description" content="El Laboratorio de VÍVELO RH: quiz tipo Kahoot, retos por niveles, academia de conceptos, mapa de especialidades, empresas y sectores del Perú.">
<meta name="theme-color" content="#EEF7FC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Newsreader:ital,opsz@0,6..72;1,6..72&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{--noche:#0F2A3D;--cielo:#EEF7FC;--celeste:#7CC6EA;--verde:#2F6B3F;--verde-p:#1E4A2B;--azafran:#F2A900;--coral:#E4572E;
  --bg:#EEF7FC;--surface:#FFFFFF;--surface-2:#F6FAFD;--ink:#0F2A3D;--ink-2:#3C5568;--line:rgba(15,42,61,.13);--accent:#1F6F9E;--ok:#1E4A2B;--bad:#B23A1E;
  --c-atraer:#F2A900;--c-admin:#7CC6EA;--c-desarrollar:#2F6B3F;--c-cuidar:#E4572E;--c-estrategia:#6B5BA8;--c-publico:#1F6F9E;
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;--f-voice:'Newsreader',Georgia,serif;--f-body:'Onest',system-ui,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.2,.7,.1,1);--spring:cubic-bezier(.34,1.56,.64,1);--gut:clamp(16px,5vw,64px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1F2D;--surface:#122F44;--surface-2:#0F2738;--ink:#EEF7FC;--ink-2:#A9C3D4;--line:rgba(238,247,252,.14);--accent:#7CC6EA;--ok:#9FD3AE;--bad:#F29C85;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1F2D;--surface:#122F44;--surface-2:#0F2738;--ink:#EEF7FC;--ink-2:#A9C3D4;--line:rgba(238,247,252,.14);--accent:#7CC6EA;--ok:#9FD3AE;--bad:#F29C85;color-scheme:dark}
*{box-sizing:border-box}
html{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16.5px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
a{color:inherit}img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--azafran);outline-offset:2px}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.03em;margin:0;text-wrap:balance}
p{margin:0}

/* Barra superior: la misma de la Brújula y los puestos */
.top{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) var(--gut) 12px;background:color-mix(in srgb,var(--bg) 92%,transparent);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font:800 18px/1 var(--f-display)}
.logo svg{width:34px;height:34px;color:var(--ink)}
.top nav{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);text-decoration:none;font-size:14px;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--azafran);border-color:var(--azafran);color:var(--noche)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;border:0;cursor:pointer;font:600 16px/1 var(--f-body);background:var(--azafran);color:var(--noche);text-decoration:none;transition:transform .2s var(--ease),box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(242,169,0,.32)}
.btn--sec{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn--sec:hover{box-shadow:none}

/* El ascensor: los seis pisos del Laboratorio */
.ascensor{position:sticky;top:65px;z-index:25;background:color-mix(in srgb,var(--bg) 94%,transparent);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.ascensor::-webkit-scrollbar{display:none}
.ascensor ol{display:flex;gap:6px;list-style:none;margin:0 auto;padding:8px var(--gut);max-width:1240px;width:max-content;min-width:100%}
.ascensor a{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 14px 0 6px;border-radius:999px;text-decoration:none;font-weight:500;font-size:14px;white-space:nowrap;border:1px solid transparent}
.ascensor a span{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font:700 12px/1 var(--f-mono)}
.ascensor a[aria-current="page"]{background:var(--surface);border-color:var(--line)}
.ascensor a[aria-current="page"] span{background:var(--azafran);border-color:var(--azafran);color:var(--noche)}

main{max-width:1240px;margin:0 auto;padding:0 var(--gut) 96px}
.vista{display:grid;gap:clamp(40px,6vw,72px);padding-top:clamp(28px,5vw,56px)}
.vista:focus{outline:none}

/* Cabecera de cada piso */
.piso{position:relative;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:clamp(20px,4vw,56px);align-items:end}
.piso::before{content:"";position:absolute;inset:-30% -10% -20% 40%;background:radial-gradient(closest-side,rgba(242,169,0,.24),transparent 70%),radial-gradient(40% 50% at 20% 80%,rgba(124,198,234,.32),transparent 70%);z-index:-1;pointer-events:none}
.piso__n{display:inline-flex;align-items:center;gap:10px;font:700 13px/1 var(--f-mono);color:var(--accent);margin-bottom:14px}
.piso__n b{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--azafran);color:var(--noche)}
.piso h1{font-size:clamp(42px,6.6vw,88px);font-weight:800;line-height:.95;letter-spacing:-.045em}
.piso__lead{margin-top:16px;max-width:52ch;color:var(--ink-2);font-size:clamp(17px,1.5vw,19px)}
.kusi{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;align-items:end;justify-self:end;max-width:380px}
.kusi img{width:72px;height:72px;object-fit:contain}
.kusi p{position:relative;padding:14px 18px;border-radius:20px 20px 20px 6px;background:var(--surface);border:1px solid var(--line);font:italic 400 18px/1.4 var(--f-voice)}

.sec__h{display:grid;gap:6px;margin-bottom:18px;max-width:70ch}
.sec__h h2{font-size:clamp(26px,3.4vw,40px);font-weight:800}
.sec__h p{color:var(--ink-2)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:clamp(18px,3vw,32px)}
.volver{display:inline-flex;align-items:center;gap:8px;font-weight:600;text-decoration:none;color:var(--accent)}
.filtros{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.vacio{padding:28px;border:1.5px dashed var(--line);border-radius:20px;color:var(--ink-2)}

/* Vestíbulo: el directorio verde de la portada */
.tablero{border-radius:28px;padding:clamp(18px,3vw,36px);background:radial-gradient(70% 90% at 100% 0%,rgba(242,169,0,.30),transparent 60%),radial-gradient(60% 80% at 0% 100%,rgba(124,198,234,.28),transparent 60%),var(--verde-p);color:#F6FBFE}
.tablero__cap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font:500 13px/1 var(--f-mono);color:#FBE3A6;padding:0 6px 16px;border-bottom:1px solid rgba(246,251,254,.22)}
.tablero ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:clamp(16px,3vw,40px)}
.tablero a{display:grid;grid-template-columns:48px 88px minmax(0,1fr);gap:16px;align-items:center;padding:16px 6px;border-bottom:1px solid rgba(246,251,254,.16);text-decoration:none;border-radius:12px;transition:background .25s}
.tablero a:hover{background:rgba(246,251,254,.08)}
.tablero__p{font:700 14px/1 var(--f-mono);color:var(--azafran)}
.tablero img{width:88px;height:64px;object-fit:cover;border-radius:12px;transition:transform .35s var(--spring)}
.tablero a:hover img{transform:scale(1.06) rotate(-2deg)}
.tablero b{display:block;font:800 clamp(20px,2vw,26px)/1.05 var(--f-display)}
.tablero small{display:block;margin-top:4px;font-size:14px;line-height:1.4;color:#CFE6D5}
.marcas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.marca{padding:20px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.marca b{display:block;font:800 clamp(28px,3vw,40px)/1 var(--f-display)}
.marca span{font-size:14px;color:var(--ink-2)}

/* QUIZ: arena tipo Kahoot */
.arena{display:grid;gap:18px}
.config{display:grid;gap:22px}
.temas{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.tema{display:grid;gap:4px;text-align:left;padding:16px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;min-height:92px;transition:transform .2s var(--ease)}
.tema b{font:800 18px/1.1 var(--f-display)}
.tema small{font-size:13px;color:var(--ink-2)}
.tema i{width:28px;height:6px;border-radius:3px;background:var(--c)}
.tema[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.tema:hover{transform:translateY(-2px)}
.marcador{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;font:500 14px/1 var(--f-mono)}
.marcador b{font:700 22px/1 var(--f-mono)}
.racha{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--azafran);color:var(--noche);font-weight:700}
.reloj{position:relative;height:12px;border-radius:999px;background:color-mix(in srgb,var(--ink) 10%,transparent);overflow:hidden}
.reloj i{position:absolute;inset:0;background:var(--verde);transform-origin:left;transform:scaleX(var(--t,1));transition:transform 1s linear}
.reloj.poco i{background:var(--coral)}
.pregunta{font:800 clamp(24px,3.4vw,42px)/1.08 var(--f-display);letter-spacing:-.03em;max-width:28ch}
.tipo{font:500 13px/1 var(--f-mono);color:var(--ink-2)}
.fichas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ficha{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;align-items:center;min-height:96px;padding:16px 18px;border:0;border-radius:20px;cursor:pointer;text-align:left;font:600 clamp(16px,1.6vw,19px)/1.3 var(--f-body);color:#0F2A3D;box-shadow:0 6px 0 rgba(15,42,61,.25);transition:transform .15s var(--ease),box-shadow .15s,opacity .25s}
.ficha:hover{transform:translateY(-2px)}
.ficha:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(15,42,61,.25)}
.ficha svg{width:40px;height:40px}
.f0{background:#F2A900}.f1{background:#7CC6EA}.f2{background:#8FD3A4}.f3{background:#F29C85}
.ficha.ok{outline:4px solid var(--verde-p);outline-offset:3px}
.ficha.no{opacity:.35}
.ficha.mia.no{opacity:1;outline:4px dashed var(--coral);outline-offset:3px}
.ficha[disabled]{cursor:default}
.ficha[disabled]:hover{transform:none}
.doc{overflow-x:auto;padding:16px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line)}
.doc table{border-collapse:collapse;min-width:320px;width:100%}.doc td,.doc th{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left}.doc .num{text-align:right;font-family:var(--f-mono)}
.campo{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.campo input{min-height:56px;padding:0 18px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font:600 20px/1 var(--f-body);width:min(360px,100%)}
.campo input:focus{border-color:var(--azafran);outline:none}
.orden{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.orden li{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line)}
.orden li > b{font:700 15px/1 var(--f-mono);color:var(--accent)}
.orden button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer}
.orden li.ok{border-color:var(--verde)}.orden li.no{border-color:var(--coral)}
.pares{display:grid;gap:10px}
.par{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line)}
.par select{min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);padding:0 10px;width:100%}
.par.ok{border-color:var(--verde)}.par.no{border-color:var(--coral)}
.veredicto{display:grid;gap:10px;padding:20px 22px;border-radius:20px;border:1.5px solid var(--line);background:var(--surface)}
.veredicto.bien{border-color:var(--verde);background:color-mix(in srgb,var(--verde) 10%,var(--surface))}
.veredicto.mal{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 10%,var(--surface))}
.veredicto h3{font-size:24px}
.veredicto .pts{font:700 16px/1 var(--f-mono)}
.podio{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:24px;align-items:center}
.podio__num{font:800 clamp(64px,10vw,128px)/.9 var(--f-display);letter-spacing:-.05em}
.podio img{width:220px;height:220px;object-fit:contain}
.repaso{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.repaso li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.repaso span{font:700 16px/1.4 var(--f-mono)}

/* RETOS */
.niveles{display:grid;gap:28px}
.nivel h2{font-size:clamp(24px,3vw,34px)}
.nivel > p{color:var(--ink-2);margin:4px 0 14px}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.set{display:grid;gap:8px;text-align:left;padding:20px;border-radius:20px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;text-decoration:none}
.set b{font:800 20px/1.15 var(--f-display)}
.set small{color:var(--ink-2)}
.set .estado{font:500 13px/1 var(--f-mono);color:var(--accent)}
.set.hecho{border-color:var(--verde)}

/* ACADEMIA */
.conceptos{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.concepto{display:grid;align-content:space-between;gap:16px;min-height:150px;padding:20px;border-radius:20px;background:var(--surface);border:1px solid var(--line);text-decoration:none;transition:transform .2s var(--ease)}
.concepto:hover{transform:translateY(-3px)}
.concepto b{font:800 21px/1.12 var(--f-display)}
.concepto .areas{display:flex;flex-wrap:wrap;gap:6px}
.concepto .areas span,.etq{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.concepto.visto{border-color:var(--verde)}
.ficha-c{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:clamp(20px,4vw,48px);align-items:start}
.modo{display:inline-flex;padding:4px;border-radius:999px;background:var(--surface);border:1px solid var(--line);margin-bottom:16px}
.modo button{min-height:40px;padding:0 16px;border-radius:999px;border:0;background:transparent;cursor:pointer;font-weight:600;font-size:14px}
.modo button[aria-pressed="true"]{background:var(--noche);color:#fff}
:root[data-theme="dark"] .modo button[aria-pressed="true"]{background:var(--celeste);color:var(--noche)}
.texto{font-size:18px;line-height:1.65;max-width:65ch}
.texto p+p{margin-top:12px}
.pasos{list-style:none;margin:0;padding:0;display:grid;gap:0;counter-reset:p}
.pasos li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.pasos li::before{counter-increment:p;content:counter(p);display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--azafran);color:var(--noche);font:700 14px/1 var(--f-mono)}
.pasos b{display:block;font:800 18px/1.2 var(--f-display)}
.pasos small{display:block;color:var(--ink-2);font-size:15px}
.cartas{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.carta{min-height:150px;border:0;padding:0;background:none;cursor:pointer;perspective:900px;text-align:left}
.carta__in{position:relative;display:grid;min-height:150px;transition:transform .5s var(--ease);transform-style:preserve-3d}
.carta[aria-pressed="true"] .carta__in{transform:rotateY(180deg)}
.carta__cara{position:absolute;inset:0;display:grid;align-content:space-between;gap:8px;padding:18px;border-radius:18px;backface-visibility:hidden;font-size:15px;line-height:1.45}
.carta__cara small{font:500 12px/1 var(--f-mono)}
.carta__a{background:color-mix(in srgb,var(--coral) 14%,var(--surface));border:1.5px solid var(--coral)}
.carta__b{background:color-mix(in srgb,var(--verde) 14%,var(--surface));border:1.5px solid var(--verde);transform:rotateY(180deg)}
.antes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.antes div{padding:18px;border-radius:18px}
.antes .a{background:color-mix(in srgb,var(--coral) 12%,var(--surface))}
.antes .b{background:color-mix(in srgb,var(--verde) 12%,var(--surface))}
.antes small{display:block;font:700 12px/1 var(--f-mono);margin-bottom:8px}
.normas{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.normas li{padding:12px 14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);font-size:15px}
.lateral{position:sticky;top:140px;display:grid;gap:12px}

/* MAPA */
.mapa{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.col h3{display:flex;align-items:center;gap:8px;font-size:17px;padding:10px 0;border-bottom:4px solid var(--c);margin-bottom:10px}
.col ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.area{width:100%;text-align:left;padding:14px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font:600 15px/1.25 var(--f-body);transition:transform .2s var(--ease),border-color .2s}
.area:hover,.area[aria-expanded="true"]{border-color:var(--c);transform:translateY(-2px)}
.area small{display:block;margin-top:4px;font:400 13px/1.3 var(--f-body);color:var(--ink-2)}
.detalle{position:fixed;inset:0 0 0 auto;z-index:40;width:min(560px,100%);overflow-y:auto;padding:calc(24px + env(safe-area-inset-top,0px)) clamp(18px,3vw,32px) 40px;background:var(--surface);border-left:1px solid var(--line);box-shadow:-30px 0 60px -30px rgba(15,42,61,.35);transform:translateX(100%);transition:transform .35s var(--ease)}
.detalle.on{transform:none}
.velo{position:fixed;inset:0;z-index:35;background:rgba(15,42,61,.35)}
.detalle h2{font-size:clamp(28px,3.4vw,40px);margin:12px 0}
.detalle h3{font-size:18px;margin:22px 0 8px}
.detalle ul{margin:0;padding-left:20px}
.cerrar{position:sticky;top:0;float:right;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:22px;line-height:1}
.barras{display:grid;gap:8px}
.barra{display:grid;grid-template-columns:110px minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:14px}
.barra i{height:10px;border-radius:999px;background:color-mix(in srgb,var(--ink) 10%,transparent);position:relative;overflow:hidden}
.barra i::after{content:"";position:absolute;inset:0;background:var(--c);transform-origin:left;transform:scaleX(var(--s))}
.niveles3{display:grid;gap:8px}
.niveles3 div{padding:12px 14px;border-radius:14px;background:var(--surface-2);font-size:15px}
.niveles3 b{display:block;font:700 12px/1 var(--f-mono);margin-bottom:6px;color:var(--accent)}

/* EMPRESAS */
.empresas{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.emp{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:center;padding:18px;border-radius:20px;background:var(--surface);border:1px solid var(--line);text-decoration:none;transition:transform .2s var(--ease)}
.emp:hover{transform:translateY(-3px)}
.mono{display:grid;place-items:center;width:64px;height:64px;border-radius:18px;background:var(--c);color:var(--noche);font:800 22px/1 var(--f-display)}
.emp b{font:800 19px/1.1 var(--f-display)}
.emp small{display:block;color:var(--ink-2);font-size:14px;margin-top:2px}
.reconoc{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.reconoc li{display:grid;grid-template-columns:60px minmax(0,1fr);gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface-2)}
.reconoc b{font:700 15px/1 var(--f-mono);color:var(--accent)}
.practicas{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.practica{padding:18px;border-radius:18px;border:1px solid var(--line);background:var(--surface)}
.practica b{display:block;font:800 18px/1.2 var(--f-display);margin:8px 0 6px}
.practica p{font-size:15px;color:var(--ink-2)}
.nota{font-size:14px;color:var(--ink-2)}

/* SECTORES */
.interruptor{display:inline-flex;padding:5px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.interruptor button{min-height:48px;padding:0 22px;border-radius:999px;border:0;background:transparent;cursor:pointer;font-weight:700}
.interruptor button[aria-pressed="true"]{background:var(--azafran);color:var(--noche)}
.dims{list-style:none;margin:20px 0 0;padding:0;display:grid;gap:0}
.dims li{display:grid;grid-template-columns:minmax(0,.7fr) minmax(0,1.3fr);gap:20px;padding:16px 0;border-bottom:1px solid var(--line)}
.dims b{font:800 17px/1.25 var(--f-display)}
.dims p{transition:opacity .25s}
.regs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.reg{padding:20px;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:grid;gap:8px;align-content:start}
.reg .code{font:700 13px/1 var(--f-mono);color:var(--accent)}
.reg b{font:800 19px/1.15 var(--f-display)}
.reg p{font-size:15px}
.reg small{color:var(--ink-2);font-size:14px}
.casos{display:grid;gap:16px}
.caso{display:grid;gap:12px}
.caso__dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.caso__dos > div{padding:18px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.caso__dos h4{margin:0 0 10px;font:700 13px/1 var(--f-mono);color:var(--accent)}
.caso__dos ol{margin:0;padding-left:20px;display:grid;gap:6px;font-size:15px}
.caso__dos ol b{font-weight:600}
.leccion{font:italic 400 18px/1.45 var(--f-voice)}


/* Dioramas 3D en la cabecera de cada piso */
.piso{align-items:center}
.diorama{position:relative;margin:0;justify-self:end;width:min(520px,100%)}
.diorama::before{content:"";position:absolute;inset:8% 4% 2%;border-radius:50%;background:radial-gradient(closest-side,rgba(124,198,234,.45),transparent 72%);z-index:-1}
.diorama__img{width:100%;height:auto;aspect-ratio:16/10;object-fit:contain;mix-blend-mode:multiply;filter:saturate(1.08)}
:root[data-theme="dark"] .diorama__img{mix-blend-mode:normal;border-radius:28px;background:#F4F0EA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .diorama__img{mix-blend-mode:normal;border-radius:28px;background:#F4F0EA}}
.diorama .kusi{position:absolute;left:-6%;bottom:-6%;grid-template-columns:60px minmax(0,1fr);max-width:300px}
.diorama .kusi img{width:60px;height:60px}
.diorama .kusi p{font-size:16px;box-shadow:0 12px 30px -16px rgba(15,42,61,.35)}
.tablero img{background:#F4F0EA;object-fit:contain}
/* Empresas con su escena */
.emp{grid-template-columns:96px minmax(0,1fr)}
.emp__img{position:relative;display:block;width:96px;height:96px;border-radius:20px;background:#F4F0EA;overflow:hidden}
.emp__img img{width:100%;height:100%;object-fit:cover;transform:scale(1.15)}
.emp__img .mono{position:absolute;right:-4px;bottom:-4px;width:40px;height:40px;border-radius:12px;font-size:14px;border:3px solid var(--surface)}
/* Quiz: fichas con imagen */
.fichas--pic .ficha{grid-template-columns:72px 28px minmax(0,1fr)}
.fichas--pic .ficha svg{width:24px;height:24px}
.ficha__pic{width:72px;height:72px;border-radius:14px;background:#F4F0EA;object-fit:cover}

/* SECTORES · el duelo deslizable */
.duelo__esc{position:relative;aspect-ratio:16/9;max-width:1100px;border-radius:32px;overflow:hidden;background:#F4F0EA;box-shadow:0 30px 70px -40px rgba(15,42,61,.5);isolation:isolate;touch-action:pan-y}
.duelo__esc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.duelo__b{clip-path:inset(0 0 0 var(--x))}
.duelo__et{position:absolute;top:18px;z-index:2;padding:8px 16px;border-radius:999px;font:700 15px/1 var(--f-body);color:var(--noche)}
.duelo__et.izq{left:18px;background:var(--azafran)}.duelo__et.der{right:18px;background:var(--celeste)}
.duelo__linea{position:absolute;top:0;bottom:0;left:var(--x);width:4px;margin-left:-2px;background:#fff;z-index:2;pointer-events:none;box-shadow:0 0 0 1px rgba(15,42,61,.12)}
.duelo__asa{position:absolute;top:50%;left:50%;display:grid;place-items:center;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:#fff;color:var(--noche);box-shadow:0 10px 30px rgba(15,42,61,.3)}
.duelo__asa .ico{width:30px;height:30px}
.duelo__esc input{position:absolute;inset:0;z-index:3;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize}
.duelo__esc:has(input:focus-visible) .duelo__asa{outline:3px solid var(--azafran);outline-offset:3px}
.duelo__frase{max-width:760px;margin-top:20px;min-height:96px}
.duelo__frase p{font:400 clamp(20px,2.2vw,28px)/1.35 var(--f-voice);margin-top:6px}
.ico{width:24px;height:24px;flex:none}
.tipo .ico{width:18px;height:18px;vertical-align:-4px}

/* El juego */
.juego__mesa{display:grid;gap:16px;padding:clamp(18px,3vw,32px);border-radius:28px;background:radial-gradient(70% 90% at 100% 0%,rgba(242,169,0,.25),transparent 60%),radial-gradient(60% 80% at 0% 100%,rgba(124,198,234,.3),transparent 60%),var(--verde-p);color:#F6FBFE}
.juego__barra{height:8px;border-radius:999px;background:rgba(246,251,254,.2);overflow:hidden}
.juego__barra i{display:block;height:100%;background:var(--azafran);transform-origin:left;transition:transform .4s var(--ease)}
.juego__carta{padding:clamp(20px,3vw,32px);border-radius:24px;background:#F6FBFE;color:var(--noche);box-shadow:0 8px 0 rgba(0,0,0,.18)}
.juego__carta .tipo{color:#1F6F9E}
.juego__carta p{margin-top:10px;font:400 clamp(21px,2.4vw,30px)/1.3 var(--f-voice)}
.juego__ops{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lado{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;align-items:center;min-height:96px;padding:12px 16px;border:0;border-radius:20px;cursor:pointer;text-align:left;font:700 clamp(17px,1.8vw,21px)/1.2 var(--f-body);color:var(--noche);box-shadow:0 6px 0 rgba(0,0,0,.22);transition:transform .15s var(--ease),opacity .25s}
.lado img{width:72px;height:72px;border-radius:14px;object-fit:cover;background:#F4F0EA}
.lado--pri{background:var(--azafran)}.lado--pub{background:var(--celeste)}
.lado:hover{transform:translateY(-2px)}.lado:active{transform:translateY(3px)}
.lado.ok{outline:4px solid #fff;outline-offset:3px}.lado.no{opacity:.4}
.lado[disabled]{cursor:default}
.juego__mesa .veredicto{color:var(--ink)}
.juego__fin{display:grid;grid-template-columns:160px minmax(0,1fr);gap:20px;align-items:center}
.juego__fin img{width:160px;height:160px;object-fit:contain}
.juego__fin p{font-size:18px;margin:6px 0 16px}

/* El espejo */
.espejo__cab{display:grid;grid-template-columns:1fr 1fr;gap:12px;font:700 15px/1 var(--f-body);margin-bottom:10px}
.espejo__cab span{display:flex;align-items:center;gap:8px}
.espejo__cab span:last-child{justify-content:flex-end}
.espejo__lista{list-style:none;margin:0;padding:0;display:grid;gap:8px;position:relative}
.espejo__lista::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:linear-gradient(var(--azafran),var(--celeste))}
.espejo__fila{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:16px;align-items:center;width:100%;padding:8px 0;border:0;background:none;cursor:pointer;text-align:left}
.espejo__n{display:grid;justify-items:center;gap:6px;width:150px;text-align:center}
.espejo__n i{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--surface);border:2px solid var(--line);transition:background .25s,border-color .25s,transform .3s var(--spring)}
.espejo__n b{font:800 15px/1.15 var(--f-display)}
.espejo__l,.espejo__r{padding:14px 16px;border-radius:18px;font-size:15px;line-height:1.45;opacity:.35;filter:blur(3px);transition:opacity .3s,filter .3s,transform .3s var(--ease)}
.espejo__l{background:color-mix(in srgb,var(--azafran) 18%,var(--surface));text-align:right;transform:translateX(8px)}
.espejo__r{background:color-mix(in srgb,var(--celeste) 24%,var(--surface));transform:translateX(-8px)}
.espejo__fila[aria-expanded="true"] .espejo__l,.espejo__fila[aria-expanded="true"] .espejo__r,.espejo__fila:hover .espejo__l,.espejo__fila:hover .espejo__r{opacity:1;filter:none;transform:none}
.espejo__fila[aria-expanded="true"] .espejo__n i{background:var(--azafran);border-color:var(--azafran);color:var(--noche);transform:scale(1.08)}

/* Puertas de los regímenes */
.puertas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
.puerta{display:grid;gap:6px;justify-items:start;padding:14px 14px 18px;border-radius:24px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;transition:transform .25s var(--ease),border-color .25s}
.puerta:hover{transform:translateY(-4px)}
.puerta[aria-expanded="true"]{border-color:var(--azafran);box-shadow:0 0 0 2px var(--azafran)}
.puerta__img{display:block;width:100%;aspect-ratio:1;border-radius:18px;overflow:hidden;background:#F4F0EA;margin-bottom:6px}
.puerta__img img{width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease)}
.puerta:hover .puerta__img img{transform:scale(1.06)}
.puerta__code{font:700 28px/1 var(--f-mono);color:var(--accent)}
.puerta b{font:800 18px/1.15 var(--f-display)}
.puerta small{color:var(--ink-2)}
.puerta__det{display:grid;grid-template-rows:0fr;overflow:hidden;transition:grid-template-rows .35s var(--ease)}
.puerta__det > span:first-child{min-height:0}
.puerta[aria-expanded="true"] .puerta__det{grid-template-rows:1fr}
.puerta__det{display:none;gap:10px;margin-top:8px;font-size:14px;line-height:1.45}
.puerta[aria-expanded="true"] .puerta__det{display:grid}
.puerta__det em{display:block;font:700 12px/1 var(--f-mono);font-style:normal;color:var(--accent);margin-bottom:3px}

/* Carriles de casos */
.carriles{display:grid;gap:14px}
.carril{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:center;padding:16px;border-radius:24px;background:var(--surface);border:1px solid var(--line)}
.carril__cab{display:grid;justify-items:center;gap:6px;font:700 14px/1.2 var(--f-body);text-align:center}
.carril__cab img{width:96px;height:96px;border-radius:18px;object-fit:cover;background:#F4F0EA}
.carril ol{list-style:none;margin:0;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:0;position:relative}
.carril ol::before{content:"";position:absolute;left:0;right:0;top:15px;height:3px;border-radius:2px;background:var(--c)}
.carril--pri{--c:var(--azafran)}.carril--pub{--c:var(--celeste)}
.carril li{position:relative;display:grid;gap:4px;padding:40px 12px 0 0;font-size:14px;line-height:1.4}
.carril li::before{content:"";position:absolute;left:0;top:6px;width:22px;height:22px;border-radius:50%;background:var(--surface);border:4px solid var(--c)}
.carril li b{font:800 16px/1.15 var(--f-display)}

/* Tamaños */
.tamanos{display:flex;gap:14px;align-items:end;flex-wrap:wrap}
.tam{display:grid;justify-items:center;gap:8px;padding:14px 18px;border-radius:22px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;min-width:140px}
.tam[aria-pressed="true"]{border-color:var(--verde);box-shadow:0 0 0 2px var(--verde)}
.tam__ed{width:120px;height:120px}
.tam__ed rect{fill:var(--verde)}.tam__ed .v{fill:#FBE3A6}
.tam b{font:800 18px/1 var(--f-display)}
.tam__txt{margin-top:16px;max-width:65ch;font:400 clamp(19px,2vw,24px)/1.4 var(--f-voice)}

/* Entidades */
.entidades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.entidad{display:grid;gap:8px;align-content:start;padding:20px;border-radius:22px;background:var(--surface);border:1px solid var(--line)}
.entidad i{display:grid;place-items:center;width:52px;height:52px;border-radius:16px;background:color-mix(in srgb,var(--celeste) 30%,var(--surface));color:var(--noche)}
:root[data-theme="dark"] .entidad i{color:var(--ink)}
.entidad b{font:800 19px/1.15 var(--f-display)}
.entidad p{font-size:15px;color:var(--ink-2)}

@media (max-width:980px){.puertas,.entidades{grid-template-columns:repeat(2,minmax(0,1fr))}.carril{grid-template-columns:1fr}.carril__cab{grid-template-columns:64px auto;justify-items:start;align-items:center}.carril__cab img{width:64px;height:64px}}
@media (max-width:760px){.diorama{justify-self:stretch}.diorama .kusi{position:static;margin-top:-10px}.juego__ops{grid-template-columns:1fr}.juego__fin{grid-template-columns:1fr}
  .espejo__lista::before{display:none}.espejo__cab{display:none}.espejo__fila{grid-template-columns:1fr;gap:8px;padding:12px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}.espejo__n{order:-1;width:auto;grid-template-columns:44px 1fr;justify-items:start;text-align:left;align-items:center}.espejo__n i{width:44px;height:44px}
  .espejo__l,.espejo__r{display:none;text-align:left;transform:none}.espejo__fila[aria-expanded="true"] .espejo__l,.espejo__fila[aria-expanded="true"] .espejo__r{display:block}.espejo__l::before{content:"Empresa privada · ";font-weight:700}.espejo__r::before{content:"Sector público · ";font-weight:700}
  .carril ol{grid-auto-flow:row;gap:12px}.carril ol::before{left:10px;right:auto;top:0;bottom:0;width:3px;height:auto}.carril li{padding:0 0 0 36px}.carril li::before{top:0}
  .duelo__esc{aspect-ratio:4/3;border-radius:24px}.duelo__et{font-size:13px;top:12px}.duelo__et.izq{left:12px}.duelo__et.der{right:12px}}
@media (max-width:480px){.puertas,.entidades{grid-template-columns:1fr}.emp{grid-template-columns:76px minmax(0,1fr)}.emp__img{width:76px;height:76px}.fichas--pic .ficha{grid-template-columns:56px minmax(0,1fr)}.fichas--pic .ficha svg{display:none}.ficha__pic{width:56px;height:56px}}

/* Mapa: constelación de 30 puestos */
.conste{position:relative;border-radius:32px;padding:clamp(8px,2vw,24px);background:radial-gradient(60% 60% at 50% 50%,rgba(124,198,234,.28),transparent 70%),radial-gradient(40% 40% at 85% 10%,rgba(242,169,0,.18),transparent 70%),var(--surface);border:1px solid var(--line)}
.conste svg{width:100%;height:auto;display:block;overflow:visible}
.lin{stroke-width:2.5;opacity:.45;transition:opacity .25s,stroke-width .25s}
.lin--hub{stroke-width:5;opacity:.6}
.conste.por-dibujar .lin{transition:stroke-dashoffset .8s cubic-bezier(.2,.7,.1,1),opacity .25s,stroke-width .25s}
.conste.dibujada .lin{stroke-dashoffset:0!important}
.lin.on{opacity:1;stroke-width:4}
.nodo{cursor:pointer;transform-box:fill-box;transform-origin:center;transition:opacity .3s}
.nodo__halo{opacity:.9}
.nodo:hover .nodo__halo,.nodo:focus-visible .nodo__halo{r:37}
.nodo:focus{outline:none}.nodo:focus-visible .nodo__halo{stroke:var(--ink);stroke-width:3}
.nodo__t{font:600 12.5px var(--f-body);fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.nodo__t{opacity:0;transition:opacity .2s;pointer-events:none;font-size:15px}.nodo:hover .nodo__t,.nodo:focus-visible .nodo__t{opacity:1}
.nodo:hover,.nodo:focus-visible{filter:drop-shadow(0 8px 14px rgba(15,42,61,.3))}
.nodo.apagado{opacity:.15}
.hub__t{font:800 15px var(--f-display);fill:#fff}.hub__t.oscuro{fill:#0F2A3D}
.centro__c{fill:var(--surface);stroke:var(--azafran);stroke-width:4}
.centro__t{font:800 16px var(--f-display);fill:var(--ink)}
.leyenda{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;padding:10px 0 4px;font-size:14px}
.leyenda span{display:inline-flex;align-items:center;gap:6px}.leyenda i{width:14px;height:14px;border-radius:50%}
/* Bento de áreas */
.bento{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.bento__c{grid-column:span 2;display:grid;gap:12px;align-content:start;padding:22px;border-radius:26px;background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden}
.bento--0,.bento--1{grid-column:span 3}
.bento__c::before{content:"";position:absolute;inset:-40% -30% auto auto;width:260px;height:260px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--c) 40%,transparent),transparent);pointer-events:none}
.bento__c header{display:grid;gap:4px;position:relative}
.bento__c header i{width:40px;height:8px;border-radius:4px;background:var(--c)}
.bento__c h3{font-size:clamp(22px,2.2vw,30px)}
.bento__c header p{color:var(--ink-2);font-size:15px}
.bento__fotos{display:flex;position:relative}
.bento__fotos a{margin-right:-14px;transition:transform .25s var(--spring)}
.bento__fotos a:hover{transform:translateY(-6px) rotate(-3deg);z-index:1}
.bento__fotos img{width:68px;height:68px;border-radius:50%;object-fit:cover;border:4px solid var(--surface);box-shadow:0 0 0 2px var(--c)}
.bento__n{font-size:14px;color:var(--ink-2)}.bento__n b{font:800 20px var(--f-display);color:var(--ink)}
.bento__esp{display:flex;flex-wrap:wrap;gap:6px}
.bento__esp .etq,.ficha-p__esp .etq{cursor:pointer;font-size:13px}
.bento__esp .etq:hover,.ficha-p__esp .etq:hover{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--surface))}
.esp-mini{display:grid;gap:10px;margin-top:12px;padding:16px;border-radius:18px;background:color-mix(in srgb,var(--c) 12%,var(--surface));border:1.5px solid var(--c)}
.esp-mini b{font:800 18px/1.2 var(--f-display)}
.esp-mini p{font-size:15px}
.esp-mini__barras{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-items:end;height:84px}
.esp-mini__barras div{display:grid;gap:4px;justify-items:center;height:100%;align-content:end}
.esp-mini__barras i{width:28px;height:60px;border-radius:8px;background:color-mix(in srgb,var(--ink) 10%,transparent);position:relative;overflow:hidden}
.esp-mini__barras i::after{content:"";position:absolute;inset:0;background:var(--c);transform-origin:bottom;transform:scaleY(var(--s))}
.esp-mini__barras small{font-size:12px}
.esp-mini__escalera{display:grid;gap:6px}
.esp-mini__escalera div{padding:10px 12px;border-radius:12px;background:var(--surface);font-size:14px;margin-left:calc(var(--i) * 16px)}
.esp-mini__escalera small{display:block;font:700 11px var(--f-mono);color:var(--accent)}
/* Ficha visual del puesto */
.ficha-p__foto{position:relative;margin:8px 0 0;border-radius:22px;overflow:hidden}
.ficha-p__foto img{width:100%;height:auto;aspect-ratio:3/2;object-fit:cover}
.ficha-p__foto figcaption{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap}
.ficha-p__foto .etq{background:var(--surface);font-weight:600}
.ficha-p__mision{font:400 22px/1.35 var(--f-voice);margin:6px 0 14px}
.ficha-p__temp{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:center;padding:12px;border-radius:18px;background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.ficha-p__temp img{width:72px;height:72px;border-radius:14px;object-fit:cover}

.carru__txt small{font-size:12px;opacity:.85}
.carru__txt b{font:800 clamp(20px,2vw,24px)/1.1 var(--f-display)}
.carru__puntos{display:flex;justify-content:center;gap:6px;margin:4px 0 10px}
.carru__puntos i{width:8px;height:8px;border-radius:999px;background:var(--line);transition:width .3s,background .3s}
.carru__puntos i.on{width:26px;background:var(--azafran)}
/* Concepto en diapositivas */
.recorrido{grid-template-columns:240px minmax(0,1fr)}
.recorrido__ind ol{gap:4px;border:0}
.recorrido__ind a{display:flex;align-items:center;gap:10px;border:0;border-radius:14px;padding:8px 10px}
.recorrido__ind a span{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font:700 12px var(--f-mono)}
.recorrido__ind a.on{background:var(--surface)}
.recorrido__ind a.on span{background:var(--c);border-color:var(--c);color:#0F2A3D}
.diapo__ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.recorrido__cont{display:grid;grid-auto-flow:column;grid-auto-columns:100%;gap:0;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:32px;background:var(--surface);border:1px solid var(--line)}
.recorrido__cont::-webkit-scrollbar{display:none}
.recorrido__cont:focus-visible{outline:3px solid var(--azafran)}
.rc{scroll-snap-align:start;padding:clamp(20px,3.4vw,44px);min-height:520px;align-content:start}
.rc h2{font-size:clamp(22px,2.4vw,30px)}
.rc--idea h1{font-size:clamp(32px,3.6vw,52px)}
.rc__frase{font-size:clamp(18px,1.7vw,22px)}
.rc--idea img{border-radius:24px}
@media (max-width:980px){.recorrido__ind ol{display:flex;overflow-x:auto;flex-wrap:nowrap}.recorrido__ind a{white-space:nowrap}.rc{min-height:0}}

/* RETOS · camino de misiones */
.dif{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dif__c{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;align-items:center;padding:14px;border-radius:22px;background:var(--surface);border:1px solid var(--line);opacity:.7}
.dif__c--on{opacity:1;border-color:var(--azafran);box-shadow:0 0 0 2px var(--azafran)}
.dif__c img{width:72px;height:72px;border-radius:16px;object-fit:cover}
.dif__c b{display:block;font:800 20px var(--f-display)}.dif__c span{font-size:14px;color:var(--ink-2)}
.coleccion{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:18px 22px;border-radius:24px;background:var(--verde-p);color:#F6FBFE}
.coleccion > b{font:800 40px/1 var(--f-display)}
.coleccion > div{display:flex;gap:8px;margin-left:auto}
.ins{display:inline-block;width:34px;height:34px;border-radius:50%;background:color-mix(in srgb,var(--ink) 12%,transparent);box-shadow:inset 0 0 0 3px rgba(255,255,255,.25)}
.ins.bronce{background:radial-gradient(circle at 35% 30%,#F3C29B,#B0703F)}
.ins.plata{background:radial-gradient(circle at 35% 30%,#FFFFFF,#9FB3C2)}
.ins.oro{background:radial-gradient(circle at 35% 30%,#FFE6A1,#F2A900);box-shadow:0 0 0 3px rgba(242,169,0,.35),0 0 18px rgba(242,169,0,.55)}
.ins--xl{width:72px;height:72px;vertical-align:middle;margin-right:12px}
.camino{list-style:none;margin:0;padding:0;display:grid;gap:0;position:relative}
.camino::before{content:"";position:absolute;left:27px;top:20px;bottom:20px;width:4px;border-radius:2px;background:linear-gradient(var(--azafran),var(--celeste),var(--verde))}
.camino__nivel{display:grid;grid-template-columns:58px minmax(0,1fr);gap:18px;padding:14px 0}
.camino__hito span{position:relative;display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:var(--azafran);color:var(--noche);font:800 24px var(--f-display);box-shadow:0 0 0 6px var(--bg)}
.camino__nivel.cerrado .camino__hito span{background:var(--surface);color:var(--ink-2);border:2px dashed var(--line)}
.camino__cuerpo h2{font-size:clamp(22px,2.6vw,32px)}
.camino__cuerpo > p{color:var(--ink-2);margin:4px 0 12px}
.candado{font-weight:600;color:var(--ink)!important}
.set{position:relative}
.set__ins{position:absolute;top:16px;right:16px;width:28px;height:28px}
.set--cerrado{opacity:.45;cursor:not-allowed;display:grid;gap:8px;padding:20px;border-radius:20px;border:1.5px dashed var(--line);background:var(--surface)}
@media (max-width:760px){.dif{grid-template-columns:1fr}.coleccion > div{margin-left:0}}

/* EMPRESAS · lo que valoras, temas y rueda */
.valoras{display:grid;gap:10px;margin:6px 0 18px;padding:18px 20px;border-radius:24px;background:var(--surface);border:1px solid var(--line)}
.valoras > p:first-child{font:800 19px var(--f-display)}
.valoras__ops{display:flex;flex-wrap:wrap;gap:8px}
.valoras__ops button{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface-2);cursor:pointer;font-weight:600;font-size:14px}
.valoras__ops svg{width:20px;height:20px;color:var(--c)}
.valoras__ops button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}.valoras__ops button[aria-pressed="true"] svg{color:#fff}
.valoras__res{font-weight:600;color:var(--accent);min-height:1.4em}
.tira li{transition:opacity .35s,filter .35s}
.tira li.opaca{opacity:.25;filter:grayscale(1)}
.tira__temas{display:flex;gap:6px;margin-bottom:2px}
.tira__temas i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff}
.tira__temas svg{width:17px;height:17px}
.emp-datos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(220px,1.2fr);gap:12px;align-items:stretch}
.emp-dato{display:grid;align-content:center;gap:4px;padding:20px;border-radius:24px;background:var(--surface);border:1px solid var(--line)}
.emp-dato b{font:800 clamp(40px,5vw,64px)/1 var(--f-display);letter-spacing:-.04em}
.emp-dato span{color:var(--ink-2);font-size:15px}
.emp-rueda{position:relative;min-height:220px;border-radius:24px;background:radial-gradient(closest-side,color-mix(in srgb,var(--azafran) 18%,transparent),transparent),var(--surface);border:1px solid var(--line)}
.emp-rueda span{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--surface-2);color:color-mix(in srgb,var(--ink) 30%,transparent);border:1.5px dashed var(--line)}
.emp-rueda span.on{background:var(--c);color:#fff;border:0;width:50px;height:50px;box-shadow:0 8px 18px -8px var(--c)}
.emp-rueda svg{width:22px;height:22px}
.emp-rueda em{position:absolute;inset:0;display:grid;place-items:center;font:800 26px var(--f-display);font-style:normal}
.naipe__area{display:flex;align-items:center;gap:6px}.naipe__area svg{width:16px;height:16px}
.naipe__tema{display:inline-flex;align-items:center;gap:6px;margin-bottom:8px;padding:6px 12px;border-radius:999px;background:var(--c);color:#fff;font-weight:700;font-size:13px}
.naipe__tema svg{width:16px;height:16px}
@media (max-width:980px){.emp-datos{grid-template-columns:repeat(3,minmax(0,1fr))}.emp-rueda{grid-column:1/-1}}
@media (max-width:560px){.emp-datos{grid-template-columns:1fr 1fr}}
@media (max-width:980px){.mapa{grid-template-columns:repeat(2,minmax(0,1fr))}.ficha-c{grid-template-columns:1fr}.lateral{position:static}}
@media (max-width:760px){.piso,.podio{grid-template-columns:1fr}.kusi{justify-self:start}.tablero ol{grid-template-columns:1fr}.marcas{grid-template-columns:1fr}.fichas{grid-template-columns:1fr}.dims li,.caso__dos,.antes,.par{grid-template-columns:1fr}.podio img{width:150px;height:150px}.ascensor{position:static}.top{position:static}.logo{white-space:nowrap}.top .chip{min-height:36px;padding:0 12px;font-size:13px}}
@media (max-width:480px){.mapa{grid-template-columns:1fr}.tablero a{grid-template-columns:36px 64px minmax(0,1fr)}.tablero img{width:64px;height:48px}.ficha{min-height:76px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
