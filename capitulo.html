<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capítulo · Analista de Selección · VÍVELO RH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Newsreader:ital,opsz@0,6..72;1,6..72&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--noche:#0F2A3D;--cielo:#EEF7FC;--celeste:#7CC6EA;--verde:#2F6B3F;--verde-p:#1E4A2B;--azafran:#F2A900;--coral:#E4572E;
  --bg:#EEF7FC;--surface:#FFFFFF;--surface-2:#F6FAFD;--ink:#0F2A3D;--ink-2:#3C5568;--line:rgba(15,42,61,.13);--accent:#1F6F9E;
  --sky:#DDF0FA;--sky-ink:#0F2A3D;--mirada:#FFF8E6;--chat-bg:#E7F1E3;--burbuja:#FFFFFF;--burbuja-yo:#D6F0D9;
  --ok-bg:#D9EEDC;--ok-ink:#1E4A2B;--mid-bg:#FBEFC9;--mid-ink:#6A4A00;--bad-bg:#FBE0DC;--bad-ink:#7A2418;
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;--f-voice:'Newsreader',Georgia,serif;--f-body:'Onest',system-ui,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.2,.7,.1,1);--spring:cubic-bezier(.34,1.56,.64,1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1F2D;--surface:#122F44;--surface-2:#0F2738;--ink:#EEF7FC;--ink-2:#A9C3D4;--line:rgba(238,247,252,.14);--accent:#7CC6EA;--sky-ink:#EEF7FC;--mirada:#1C3326;--chat-bg:#10291D;--burbuja:#173A4F;--burbuja-yo:#1E4A2B;--ok-bg:#1E4A2B;--ok-ink:#CFEBD6;--mid-bg:#4A3A0E;--mid-ink:#FBE3A6;--bad-bg:#4F1F18;--bad-ink:#F9CFC7;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1F2D;--surface:#122F44;--surface-2:#0F2738;--ink:#EEF7FC;--ink-2:#A9C3D4;--line:rgba(238,247,252,.14);--accent:#7CC6EA;--sky-ink:#EEF7FC;--mirada:#1C3326;--chat-bg:#10291D;--burbuja:#173A4F;--burbuja-yo:#1E4A2B;--ok-bg:#1E4A2B;--ok-ink:#CFEBD6;--mid-bg:#4A3A0E;--mid-ink:#FBE3A6;--bad-bg:#4F1F18;--bad-ink:#F9CFC7;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
html{overflow-x:clip}
body{margin:0;background:var(--sky);color:var(--ink);font:400 16.5px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;transition:background 1.4s ease;overflow:hidden}
[hidden]{display:none!important}
a{color:inherit}img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--azafran);outline-offset:2px}
button{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Barra superior */
.bar{height:68px;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:18px;align-items:center;padding:0 20px;color:var(--sky-ink)}
.bar__izq{display:flex;align-items:center;gap:14px;min-width:0}
.salir{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid currentColor;text-decoration:none;font-size:14px;font-weight:500;opacity:.85}
.bar__cap{font:800 18px/1 var(--f-display);letter-spacing:-.02em;white-space:nowrap;margin:0}
.bar__cap span{font:500 14px/1 var(--f-body);opacity:.75;margin-left:8px}
.reloj{display:flex;align-items:center;gap:12px;min-width:0}
.reloj time{font:500 22px/1 var(--f-mono);letter-spacing:-.03em;color:var(--sky-ink);min-width:64px}
.reloj__pista{position:relative;flex:1;height:4px;border-radius:4px;background:color-mix(in srgb,var(--sky-ink) 18%,transparent)}
.reloj__fill{position:absolute;inset:0;border-radius:4px;background:var(--azafran);transform-origin:0 50%;transform:scaleX(0);transition:transform 1s var(--ease)}
.reloj__sol{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--azafran);box-shadow:0 0 0 6px rgba(242,169,0,.22);left:0;transition:left 1s var(--ease)}
.reloj__fin{font:500 12px/1 var(--f-mono);opacity:.7}
.meds{display:flex;gap:14px}
.med{width:112px;position:relative}
.med b{display:flex;justify-content:space-between;font:600 12.5px/1 var(--f-body);margin-bottom:6px}
.med b span{font:500 12px/1 var(--f-mono)}
.med i{display:block;height:6px;border-radius:6px;background:color-mix(in srgb,var(--sky-ink) 16%,transparent);overflow:hidden}
.med i::after{content:"";display:block;height:100%;width:100%;background:var(--c,var(--verde));border-radius:6px;transform-origin:0 50%;transform:scaleX(var(--s,.5));transition:transform .9s var(--ease)}
.delta{position:absolute;right:0;top:-18px;font:600 12px/1 var(--f-mono);padding:3px 6px;border-radius:6px;animation:delta 1.8s var(--ease) forwards}
.delta.mas{background:var(--ok-bg);color:var(--ok-ink)}.delta.menos{background:var(--bad-bg);color:var(--bad-ink)}
@keyframes delta{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
.tools{display:flex;gap:6px}
.tool{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid color-mix(in srgb,var(--sky-ink) 30%,transparent);background:color-mix(in srgb,var(--surface) 55%,transparent);color:var(--sky-ink);display:grid;place-items:center;cursor:pointer;transition:transform .2s var(--ease)}
.tool:hover{transform:translateY(-2px)}
.tool svg{width:20px;height:20px}
.tool[aria-pressed="false"] .on,.tool[aria-pressed="true"] .off{display:none}
.badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--coral);color:#fff;font:600 11.5px/20px var(--f-body);text-align:center;box-shadow:0 0 0 2px var(--sky)}
.badge:empty{display:none}
.tool.zumba{animation:zumba .5s var(--ease) 2}
@keyframes zumba{0%,100%{transform:none}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}

/* Mesa */
.mesa{height:calc(100% - 68px);display:grid;grid-template-columns:280px minmax(0,1fr) 296px;gap:16px;padding:0 16px 16px}
.panel{background:var(--surface);border-radius:22px;border:1px solid var(--line);overflow:auto;box-shadow:0 18px 40px rgba(15,42,61,.08)}
.panel h2{font:800 20px/1 var(--f-display);letter-spacing:-.02em;margin:0;padding:20px 20px 12px}
.bandeja ol{list-style:none;margin:0;padding:0 10px 14px}
.item{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:10px;border-radius:14px;cursor:pointer;transition:background .2s}
.item:hover{background:var(--surface-2)}
.item[aria-current="true"]{background:color-mix(in srgb,var(--azafran) 18%,var(--surface))}
.item__ico{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--accent);flex:none}
.item__ico svg{width:18px;height:18px}
.item b{display:block;font:600 14.5px/1.25 var(--f-body)}
.item small{display:block;font-size:12.5px;color:var(--ink-2)}
.item time{font:500 12px/1 var(--f-mono);color:var(--ink-2)}
.item__ok{color:var(--verde)}
.item--nuevo{animation:entra .6s var(--ease)}
@keyframes entra{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
@keyframes sube{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.bandeja__mas{margin:4px 20px 20px;font-size:13px;color:var(--ink-2)}

/* Escena */
.escena{container-type:inline-size;position:relative;padding:clamp(18px,2.6vw,36px) clamp(18px,3.6vw,52px) 48px;overflow:auto}
.esc__top{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,240px);gap:clamp(16px,3vw,40px);align-items:center;margin-bottom:24px}
.esc__head{display:flex;gap:16px;align-items:center;min-width:0}
.esc__head>svg,.esc__head>.item__ico{flex:none}
.esc__canal{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--accent)}
.esc__canal svg{width:16px;height:16px}
.esc__canal time{font:500 13px/1 var(--f-mono);color:var(--ink-2);margin-left:6px}
.esc__head h1{font:800 clamp(26px,3vw,42px)/1 var(--f-display);letter-spacing:-.03em;margin:6px 0 6px;text-wrap:balance}
.esc__head p{margin:0;font-size:14px;color:var(--ink-2)}
.recorte{position:relative;justify-self:end;width:100%;max-width:240px}
.recorte::before{content:"";position:absolute;inset:-18% -14%;background:radial-gradient(closest-side,rgba(242,169,0,.38),transparent 72%);z-index:0;pointer-events:none}
.recorte img{position:relative;z-index:1;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:18px;transform:rotate(2.2deg);box-shadow:0 18px 34px rgba(15,42,61,.18);border:5px solid var(--surface);animation:posa .8s var(--spring)}
@keyframes posa{from{opacity:0;transform:rotate(9deg) translateY(16px) scale(.94)}to{opacity:1;transform:rotate(2.2deg)}}
@container (max-width:560px){.esc__top{grid-template-columns:1fr}.recorte{order:-1;justify-self:stretch;max-width:none}.recorte img{aspect-ratio:21/8;transform:rotate(-1deg)}.recorte::before{inset:-25% -5%}}
.escuchar{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:none;cursor:pointer;font-size:13px}
.escuchar svg{width:16px;height:16px}
.esc__body{font:400 clamp(19px,1.6vw,22px)/1.55 var(--f-voice);max-width:64ch}
.esc__body p{margin:0 0 .8em}
mark{background:none;color:inherit}
mark.clave{background:linear-gradient(transparent 58%,rgba(242,169,0,.55) 58%) no-repeat 0 0/0% 100%;padding:0 .08em;animation:subraya .9s var(--ease) .5s forwards}
@keyframes subraya{to{background-size:100% 100%}}
.rm mark.clave{background-size:100% 100%}
.mail{border:1px solid var(--line);border-radius:18px;padding:20px 22px;background:var(--surface-2);max-width:68ch}
.mail dl{display:grid;grid-template-columns:52px 1fr;gap:4px 10px;margin:0 0 14px;font-size:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.mail dt{color:var(--ink-2)}.mail dd{margin:0}
.mail__asunto{font:800 22px/1.15 var(--f-display);margin:0 0 10px;letter-spacing:-.02em}
.mail .esc__body{font:400 17px/1.6 var(--f-body)}
.chat{max-width:440px;display:grid;gap:8px;padding:18px;border-radius:22px;background:var(--chat-bg);margin:6px 0 10px}
.chat p{margin:0;justify-self:start;background:var(--burbuja);padding:10px 14px;border-radius:4px 16px 16px 16px;font:400 16px/1.4 var(--f-body);box-shadow:0 2px 0 rgba(15,42,61,.06);animation:sube .4s var(--ease) both}
.chat p:nth-child(2){animation-delay:.5s}
.chat small{font:500 11px/1 var(--f-mono);color:var(--ink-2);justify-self:start}
.etiqueta{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:6px 10px;border-radius:999px;background:color-mix(in srgb,var(--azafran) 22%,var(--surface));margin:0 0 14px}
.actividad{margin-top:26px;max-width:72ch}
.actividad__q{font-weight:600;margin:0 0 12px}
.opc{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:16px 18px;margin:0 0 10px;cursor:pointer;font:500 16px/1.45 var(--f-body);transition:border-color .2s,transform .2s var(--ease)}
.opc:hover{border-color:var(--accent);transform:translateX(4px)}
.opc[aria-pressed="true"]{border-color:var(--azafran);box-shadow:inset 5px 0 0 var(--azafran)}
.info{border-left:4px solid var(--celeste);padding:10px 16px;margin:0 0 12px;font:400 16.5px/1.6 var(--f-body);background:var(--surface-2);border-radius:0 14px 14px 0;animation:entra .5s var(--ease)}
.tabla{width:100%;border-collapse:collapse;font-size:14.5px}
.tabla th,.tabla td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tabla th{font-size:12.5px;color:var(--ink-2);font-weight:600}
.tabla td.n{font:500 13px/1.4 var(--f-mono);text-align:right}
.tabla input{width:20px;height:20px;accent-color:var(--verde)}
.tabla tr.sel{background:color-mix(in srgb,var(--azafran) 14%,transparent)}
.doc{border:1px solid var(--line);border-radius:16px;background:var(--surface-2);padding:8px 0;max-width:640px}
.doc__h{padding:10px 18px 12px;border-bottom:1px solid var(--line);font:600 14px/1.3 var(--f-body);margin:0}
.doc__h small{display:block;font-weight:400;color:var(--ink-2)}
.linea{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:12px 18px;cursor:pointer;font:400 16px/1.4 var(--f-body);border-bottom:1px dashed var(--line)}
.linea:last-child{border-bottom:0}
.linea::before{content:"";flex:none;width:20px;height:20px;border-radius:6px;border:2px solid var(--line)}
.linea[aria-pressed="true"]{background:color-mix(in srgb,var(--azafran) 16%,transparent);text-decoration:line-through;text-decoration-color:var(--azafran)}
.linea[aria-pressed="true"]::before{background:var(--azafran);border-color:var(--azafran)}
.linea[disabled]{cursor:default}
.calls{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-width:560px}
.calls li{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 16px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);font-size:15px}
.calls li span{color:var(--ink-2);text-align:right}
.calls li.no span{color:var(--bad-ink)}.calls li.si span{color:var(--verde);font-weight:600}
.calls li.activa{border-color:var(--azafran);box-shadow:0 0 0 3px rgba(242,169,0,.25)}
.calls li.activa b::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--azafran);margin-right:8px;animation:late 1s infinite}
@keyframes late{50%{opacity:.2}}
.puntos::after{content:"Timbrando";animation:llamando 1s steps(4) infinite}
@keyframes llamando{0%{content:"Timbrando"}25%{content:"Timbrando."}50%{content:"Timbrando.."}75%{content:"Timbrando..."}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;border:0;cursor:pointer;font:600 16px/1 var(--f-body);background:var(--azafran);color:var(--noche);text-decoration:none;transition:transform .2s var(--ease)}
.btn:hover{transform:translateY(-2px)}
.btn--sec{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.err{color:var(--bad-ink);font-size:14px;margin:8px 0 0;min-height:1.2em}

/* Resultado */
.fb{margin-top:26px;max-width:74ch;border-radius:22px;padding:22px 24px;background:var(--surface-2);border:1px solid var(--line);animation:sube .6s var(--ease)}
.fb__q{display:inline-flex;align-items:center;gap:8px;font:600 14px/1 var(--f-body);padding:8px 12px;border-radius:999px;margin-bottom:12px}
.q-buena{background:var(--ok-bg);color:var(--ok-ink)}.q-aceptable{background:var(--mid-bg);color:var(--mid-ink)}.q-riesgosa{background:var(--bad-bg);color:var(--bad-ink)}
.fb__out{font:400 20px/1.5 var(--f-voice);margin:0 0 14px}
.reglas{display:grid;gap:8px;margin:14px 0 0}
.regla{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline;font-size:14.5px}
.regla b{font:600 12px/1 var(--f-body);padding:5px 9px;border-radius:999px;white-space:nowrap}
.r-ley b{background:var(--azafran);color:var(--noche)}.r-politica b{background:var(--celeste);color:var(--noche)}.r-bp b{background:#CFE6D5;color:#1E4A2B}
.detalle{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px;font-size:14.5px}
.detalle li{display:grid;grid-template-columns:22px 1fr;gap:8px}
.fb__sig{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:22px}
.fb__sig small{color:var(--ink-2);font-size:13.5px}
.revisando{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:14px;background:color-mix(in srgb,var(--celeste) 25%,var(--surface));font-size:14px;margin-bottom:18px}

/* Cómo lo razona una profesional */
.mirada{margin-top:18px;max-width:74ch;border-radius:24px;background:radial-gradient(70% 90% at 100% 0%,rgba(242,169,0,.32),transparent 60%),radial-gradient(60% 80% at 0% 100%,rgba(124,198,234,.32),transparent 60%),var(--mirada);border:1.5px solid color-mix(in srgb,var(--azafran) 55%,var(--line));overflow:hidden;animation:sube .7s var(--ease) .15s both}
.mirada__abrir{display:grid;grid-template-columns:120px minmax(0,1fr) 52px;gap:18px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:14px 18px 14px 14px;cursor:pointer}
.mirada__abrir img{width:120px;height:96px;object-fit:cover;border-radius:16px;transform:rotate(-3deg);box-shadow:0 10px 20px rgba(15,42,61,.18);border:4px solid var(--surface)}
.mirada__abrir small{display:block;font:500 12.5px/1 var(--f-mono);color:var(--accent);margin-bottom:6px}
.mirada__abrir b{display:block;font:800 clamp(21px,2.2vw,27px)/1.05 var(--f-display);letter-spacing:-.025em;text-wrap:balance}
.mirada__abrir em{display:block;font:400 15px/1.4 var(--f-body);font-style:normal;color:var(--ink-2);margin-top:5px}
.mirada__mas{width:52px;height:52px;border-radius:50%;background:var(--azafran);color:var(--noche);display:grid;place-items:center;transition:transform .35s var(--spring);box-shadow:0 0 0 0 rgba(242,169,0,.5);animation:llama 2.4s ease-out 1.2s 3}
.mirada__mas svg{width:22px;height:22px}
.mirada__abrir[aria-expanded="true"] .mirada__mas{transform:rotate(45deg);animation:none}
@keyframes llama{0%{box-shadow:0 0 0 0 rgba(242,169,0,.55)}100%{box-shadow:0 0 0 18px rgba(242,169,0,0)}}
.mirada__in{padding:6px 22px 24px;display:grid;gap:22px;animation:sube .5s var(--ease)}
.mirada h4{font:800 14px/1 var(--f-display);letter-spacing:.01em;margin:0 0 10px;color:var(--accent)}
.ve{font:italic 400 clamp(19px,1.7vw,22px)/1.5 var(--f-voice);margin:0;padding-left:16px;border-left:4px solid var(--azafran)}
.dg{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;overflow-x:auto}
.dg__t{font:600 14.5px/1.3 var(--f-body);margin:0 0 14px}
.dg-flujo{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 0;counter-reset:f}
.dg-flujo li{counter-increment:f;display:flex;align-items:center;font-size:14px;font-weight:500;animation:sube .4s var(--ease) both;animation-delay:calc(var(--i)*70ms)}
.dg-flujo li span{padding:8px 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.dg-flujo li span::before{content:counter(f);font:500 11px/1 var(--f-mono);color:var(--accent);margin-right:6px}
.dg-flujo li:not(:last-child)::after{content:"";width:18px;height:2px;background:var(--azafran);margin:0 2px}
.dg-flujo li.aqui span{background:var(--azafran);color:var(--noche);border-color:var(--azafran)}
.dg-bal svg{display:block;width:100%;max-width:420px;height:auto;margin:0 auto}
.dg-bal__viga{transform-origin:210px 40px;transform:rotate(0);transition:transform 1.2s var(--spring) .2s}
.dg-bal.on .dg-bal__viga{transform:rotate(var(--ang))}
.dg-bal__cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.dg-bal__cols h5{font:600 15px/1.2 var(--f-body);margin:0 0 6px}
.dg-bal__cols ul{margin:0;padding-left:18px;font-size:14.5px;color:var(--ink-2)}
.dg-bal__cols>div:last-child h5{color:var(--verde)}
:root[data-theme="dark"] .dg-bal__cols>div:last-child h5{color:#9FD3AE}
.dg-mat{display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px}
.dg-mat__y{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12.5px;color:var(--ink-2);text-align:center}
.dg-mat__box{position:relative;aspect-ratio:16/10;min-height:220px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.dg-mat__box>span{padding:8px 10px;font:600 12px/1.2 var(--f-body);color:var(--ink-2)}
.dg-mat__box>span:nth-child(1){background:color-mix(in srgb,var(--azafran) 22%,var(--surface))}
.dg-mat__box>span:nth-child(2){background:color-mix(in srgb,var(--celeste) 22%,var(--surface));text-align:right}
.dg-mat__box>span:nth-child(3){background:var(--surface-2);align-self:end}
.dg-mat__box>span:nth-child(4){background:var(--surface-2);text-align:right;align-self:end}
.dg-mat__box>span:nth-child(3),.dg-mat__box>span:nth-child(4){display:flex;align-items:flex-end}
.dg-mat__box>span:nth-child(4){justify-content:flex-end}
.dg-pt{position:absolute;transform:translate(-50%,50%);display:flex;align-items:center;gap:5px;font:600 12px/1.1 var(--f-body);white-space:nowrap;animation:sube .4s var(--ease) both;animation-delay:calc(var(--i)*80ms + .2s)}
.dg-pt::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--verde);box-shadow:0 0 0 3px var(--surface)}
.dg-pt.der{flex-direction:row-reverse}
.dg-mat__x{grid-column:2;font-size:12.5px;color:var(--ink-2);text-align:center}
.dg-linea{list-style:none;margin:0;padding:0 0 0 6px;display:grid;gap:0}
.dg-linea li{position:relative;display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;padding:0 0 14px 22px;animation:sube .4s var(--ease) both;animation-delay:calc(var(--i)*80ms)}
.dg-linea li::before{content:"";position:absolute;left:0;top:5px;width:12px;height:12px;border-radius:50%;background:var(--azafran);box-shadow:0 0 0 3px color-mix(in srgb,var(--azafran) 25%,transparent)}
.dg-linea li:not(:last-child)::after{content:"";position:absolute;left:5px;top:20px;bottom:0;width:2px;background:var(--line)}
.dg-linea b{font:500 13px/1.4 var(--f-mono)}
.dg-linea span{font-size:15px}
.dg-cambio{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.dg-cambio li{display:grid;grid-template-columns:minmax(0,1fr) 28px minmax(0,1fr);gap:8px;align-items:center;animation:sube .4s var(--ease) both;animation-delay:calc(var(--i)*90ms)}
.dg-cambio s{padding:8px 12px;border-radius:12px;background:var(--bad-bg);color:var(--bad-ink);text-decoration-thickness:2px;font-size:14.5px}
.dg-cambio i{font-style:normal;text-align:center;color:var(--azafran);font-weight:800}
.dg-cambio span{padding:8px 12px;border-radius:12px;background:var(--ok-bg);color:var(--ok-ink);font-size:14.5px;font-weight:500}
.dg-emb{display:grid;gap:6px;justify-items:center}
.dg-emb div{width:var(--w);min-width:150px;display:flex;justify-content:space-between;gap:10px;padding:10px 16px;border-radius:12px;background:color-mix(in srgb,var(--verde) calc(var(--k)*100%),var(--celeste));color:#fff;font-size:14.5px;font-weight:500;animation:sube .45s var(--ease) both;animation-delay:calc(var(--i)*110ms)}
.dg-emb div b{font:500 15px/1.2 var(--f-mono)}
.dg-rango{padding:46px 8px 8px;min-width:420px}
.dg-rango__pista{position:relative;height:14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);margin:0 0 84px}
.dg-rango__banda{position:absolute;top:-1px;bottom:-1px;border-radius:14px;background:color-mix(in srgb,var(--verde) 70%,var(--celeste));animation:sube .5s var(--ease) both}
.dg-rango__banda em{position:absolute;left:50%;top:-24px;transform:translateX(-50%);font:normal 600 12px/1 var(--f-body);color:var(--verde);white-space:nowrap}
:root[data-theme="dark"] .dg-rango__banda em{color:#9FD3AE}
.dg-rango__m{position:absolute;top:22px;transform:translateX(-50%);display:grid;justify-items:center;font-size:12px;line-height:1.2;white-space:nowrap;animation:sube .4s var(--ease) both;animation-delay:calc(var(--i)*90ms + .2s)}
.dg-rango__m::before{content:"";position:absolute;top:-24px;left:50%;width:2px;height:20px;background:var(--azafran)}
.dg-rango__m.abajo{top:44px}.dg-rango__m.abajo::before{top:-46px;height:42px}
.dg-rango__m small{font:500 11.5px/1.2 var(--f-mono);color:var(--ink-2)}
.dg-rango__ej{display:flex;justify-content:space-between;font:500 11.5px/1 var(--f-mono);color:var(--ink-2)}
.dg-msg{max-width:420px;padding:16px;border-radius:18px;background:var(--chat-bg)}
.dg-msg p{margin:0 0 0 auto;max-width:92%;background:var(--burbuja-yo);padding:10px 14px;border-radius:16px 4px 16px 16px;font-size:15px;line-height:1.45}
.dg-msg button{margin-top:10px}
.normas{display:grid;gap:12px}
.norma{border-radius:18px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.norma__h{display:flex;gap:10px;align-items:center;padding:12px 16px;background:color-mix(in srgb,var(--azafran) 20%,var(--surface));font:600 15px/1.3 var(--f-body)}
.norma__h svg{width:20px;height:20px;flex:none}
.norma__b{display:grid;grid-template-columns:1fr 1fr;gap:0}
.norma__b div{padding:14px 16px;font-size:14.5px}
.norma__b div+div{border-left:1px solid var(--line)}
.norma__b b{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:4px;font-weight:600}
.norma__nota{font-size:12.5px;color:var(--ink-2);margin:0}
.tuya{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.tuya p{margin:0;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-size:14.5px}
.tuya b{display:block;font-size:13px;margin-bottom:4px}
.tuya .t-ok b{color:var(--verde)}.tuya .t-risk b{color:var(--coral)}.tuya .t-info b{color:var(--accent)}
:root[data-theme="dark"] .tuya .t-ok b{color:#9FD3AE}

/* Lateral */
.tabs{display:flex;gap:6px;padding:14px 14px 4px}
.tab{flex:1;min-height:40px;border-radius:999px;border:1px solid var(--line);background:none;cursor:pointer;font-weight:600;font-size:14px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.cart{list-style:none;margin:0;padding:8px 14px 16px;display:grid;gap:8px}
.cart li{padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2)}
.cart b{display:block;font-size:14.5px;line-height:1.25}
.cart small{display:block;color:var(--ink-2);font-size:12.5px}
.cart em{display:inline-block;margin-top:6px;font:normal 600 12.5px/1.3 var(--f-body);color:var(--verde)}
:root[data-theme="dark"] .cart em{color:#9FD3AE}
.cart .dias{font:500 11.5px/1 var(--f-mono);color:var(--ink-2);float:right}
.cart .foco{display:inline-block;font-size:11.5px;font-weight:600;background:var(--azafran);color:var(--noche);border-radius:999px;padding:3px 8px;margin-top:6px}
.cart li.cambio{animation:brilla 1.4s var(--ease)}
@keyframes brilla{0%{box-shadow:0 0 0 0 rgba(242,169,0,0)}30%{box-shadow:0 0 0 4px rgba(242,169,0,.45)}100%{box-shadow:0 0 0 0 rgba(242,169,0,0)}}
.gentes{list-style:none;margin:0;padding:8px 14px 16px;display:grid;gap:10px}
.gentes li{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center}
.gentes b{display:block;font-size:14.5px}
.gentes small{display:block;color:var(--ink-2);font-size:12.5px}
.rel{display:inline-flex;gap:3px;margin-top:4px}
.rel i{width:14px;height:6px;border-radius:3px;background:var(--line)}
.rel i.on{background:var(--verde)}
.rel-txt{font-size:12.5px;font-weight:600;margin-left:6px}

/* Glosario */
.gl{display:inline;border:0;padding:0;background:none;font:inherit;color:inherit;cursor:help;text-decoration:underline dotted color-mix(in srgb,var(--accent) 70%,transparent);text-decoration-thickness:2px;text-underline-offset:.18em}
.gl:hover{text-decoration-color:var(--azafran);text-decoration-style:solid}
.gpop{position:fixed;z-index:70;width:min(340px,calc(100vw - 24px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 18px 40px rgba(15,42,61,.22);animation:sube .25s var(--ease)}
.gpop__cab{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--gc);color:var(--gi);font:600 12.5px/1 var(--f-body)}
.gpop__cab svg,.gcard__cab svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.gpop__in{padding:12px 16px 14px}
.gpop b{display:block;font:800 22px/1.05 var(--f-display);letter-spacing:-.02em;margin-bottom:6px}
.gpop p{margin:0 0 10px;font-size:15px;line-height:1.5}
.gpop .ej,.gcard .ej{font-size:14px;padding:8px 12px;border-radius:12px;background:var(--surface-2);border-left:3px solid var(--gc);color:var(--ink)}
.gpop .ej small,.gcard .ej small{display:block;font:600 11.5px/1 var(--f-body);color:var(--ink-2);margin-bottom:4px}
.gpop__pie{display:flex;justify-content:space-between;align-items:center;gap:10px}
.gpop__pie span{font-size:12.5px;color:var(--verde);font-weight:600}
:root[data-theme="dark"] .gpop__pie span{color:#9FD3AE}
.gpop button{border:0;background:none;color:var(--accent);font-weight:600;font-size:14px;cursor:pointer;padding:4px 0}
dialog.glo{border:0;padding:0;border-radius:26px;width:min(980px,calc(100vw - 24px));max-width:none;height:min(86vh,820px);max-height:none;background:var(--bg);color:var(--ink);box-shadow:0 30px 60px rgba(15,42,61,.35);overflow:hidden}
dialog.glo[open]{display:flex;flex-direction:column}
dialog.glo::backdrop{background:rgba(15,42,61,.5)}
.glo__h{padding:22px 24px 14px;display:grid;gap:14px;background:radial-gradient(60% 140% at 100% 0%,rgba(242,169,0,.3),transparent 60%),var(--surface);border-bottom:1px solid var(--line)}
.glo__fila{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.glo h2{font:800 clamp(28px,4vw,40px)/1 var(--f-display);letter-spacing:-.03em;margin:0}
.glo__prog{display:grid;gap:6px;min-width:200px;flex:1;max-width:360px}
.glo__prog span{font-size:13.5px;color:var(--ink-2)}
.glo__prog b{color:var(--ink)}
.glo__prog i{display:block;height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.glo__prog i::after{content:"";display:block;height:100%;background:var(--azafran);transform-origin:0 50%;transform:scaleX(var(--p,0));transition:transform .8s var(--ease)}
.glo input{width:100%;min-height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:0 16px;font:inherit}
.glo__cats{display:flex;gap:8px;flex-wrap:wrap}
.glo__cat{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font:600 13.5px/1 var(--f-body)}
.glo__cat i{width:10px;height:10px;border-radius:50%;background:var(--gc)}
.glo__cat[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.glo__cuerpo{flex:1;overflow:auto;padding:18px 24px 28px}
.glo__letras{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:16px}
.glo__letras button{min-width:32px;height:32px;display:grid;place-items:center;border-radius:8px;font:600 13px/1 var(--f-mono);background:var(--surface);color:var(--ink);border:1px solid var(--line);cursor:pointer}
.glo__grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.gcard{position:relative;display:flex;flex-direction:column;border-radius:20px;background:var(--surface);border:1px solid var(--line);overflow:hidden;scroll-margin-top:12px}
.gcard.flash{animation:flash 1.4s var(--ease)}
@keyframes flash{30%{box-shadow:0 0 0 4px var(--azafran)}}
.gcard__cab{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--gc);color:var(--gi);font:600 12px/1 var(--f-body)}
.gcard__cab em{margin-left:auto;font-style:normal;font-size:11.5px}
.gcard__in{padding:14px 16px 16px;display:grid;gap:8px}
.gcard h3{font:800 21px/1.1 var(--f-display);letter-spacing:-.02em;margin:0}
.gcard p{margin:0;font-size:14.5px;line-height:1.5;color:var(--ink-2)}
.gcard__ver{display:flex;flex-wrap:wrap;gap:6px}
.gcard__ver button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:4px 10px;font:500 12.5px/1.2 var(--f-body);cursor:pointer}
.glo__vacio{color:var(--ink-2)}

/* Apps: WhatsApp y Correo */
.app{position:fixed;right:20px;top:80px;bottom:20px;z-index:45;width:min(380px,calc(100vw - 24px));display:flex;flex-direction:column;border-radius:36px;background:var(--verde-p);padding:10px;box-shadow:0 30px 60px rgba(15,42,61,.35);transform:translateX(calc(100% + 40px));transition:transform .5s var(--ease);visibility:hidden}
.app.on{transform:none;visibility:visible}
.app.mail{border-radius:22px;background:#B9DDF0;width:min(470px,calc(100vw - 24px))}
.app__pantalla{flex:1;display:flex;flex-direction:column;border-radius:28px;overflow:hidden;background:var(--surface);min-height:0}
.app.mail .app__pantalla{border-radius:14px}
.app__h{display:flex;align-items:center;gap:10px;padding:14px 14px 12px;background:var(--verde);color:#fff}
.app.mail .app__h{background:var(--celeste);color:var(--noche)}
.app__h b{flex:1;font:800 18px/1.1 var(--f-display);letter-spacing:-.01em;min-width:0}
.app__h b small{display:block;font:400 12.5px/1.2 var(--f-body);opacity:.85;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app__h button{width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:inherit;cursor:pointer;display:grid;place-items:center;flex:none}
.app.mail .app__h button{background:rgba(15,42,61,.1)}
.app__h button svg{width:18px;height:18px}
.app__lista{list-style:none;margin:0;padding:0;overflow:auto;flex:1}
.app__lista button{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);text-align:left;padding:12px 14px;cursor:pointer}
.app__lista button:hover{background:var(--surface-2)}
.app__lista b{display:block;font-size:15px;font-weight:600}
.app__lista small{display:block;color:var(--ink-2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app__lista .noleido b,.app__lista .noleido small{font-weight:700;color:var(--ink)}
.app__lista time{font:500 11.5px/1 var(--f-mono);color:var(--ink-2);display:grid;gap:6px;justify-items:end}
.app__lista time i{font-style:normal;min-width:20px;height:20px;border-radius:999px;background:#25A35A;color:#fff;font:600 11.5px/20px var(--f-body);text-align:center;padding:0 5px}
.app.mail .app__lista time i{background:var(--accent)}
.ini{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:800 17px/1 var(--f-display);color:#fff;overflow:hidden;flex:none}
.ini svg{width:44px;height:44px}
.app__vacio{padding:30px 20px;color:var(--ink-2);text-align:center;font-size:14.5px}
.app__conv{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--chat-bg) radial-gradient(rgba(15,42,61,.06) 1px,transparent 1.2px) 0 0/16px 16px}
.app__conv p{margin:0;align-self:flex-start;max-width:85%;background:var(--burbuja);padding:8px 12px 6px;border-radius:4px 14px 14px 14px;font-size:15px;line-height:1.4;box-shadow:0 1px 0 rgba(15,42,61,.08)}
.app__conv p.yo{align-self:flex-end;background:var(--burbuja-yo);border-radius:14px 4px 14px 14px}
.app__conv p.nuevo{animation:sube .3s var(--ease)}
.app__conv p small{display:block;text-align:right;font:500 10.5px/1 var(--f-mono);color:var(--ink-2);margin-top:3px}
.app__conv p em{display:block;font-style:normal;font-weight:600;font-size:12.5px;color:var(--verde);margin-bottom:2px}
:root[data-theme="dark"] .app__conv p em{color:#9FD3AE}
.app__conv .dia{align-self:center;font:600 12px/1 var(--f-body);background:var(--surface);color:var(--ink-2);padding:6px 12px;border-radius:999px;margin:6px 0;box-shadow:0 1px 0 rgba(15,42,61,.08)}
.app__mail{flex:1;overflow:auto;padding:18px 20px;display:grid;align-content:start;gap:14px}
.app__mail h3{font:800 22px/1.15 var(--f-display);letter-spacing:-.02em;margin:0}
.app__mail dl{display:grid;grid-template-columns:52px 1fr;gap:4px 10px;margin:0;font-size:13.5px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.app__mail dt{color:var(--ink-2)}.app__mail dd{margin:0}
.app__mail .txt{font-size:15px;line-height:1.6}
.app__mail .txt p{margin:0 0 .7em}
.app__mail .resp{border-radius:14px;background:color-mix(in srgb,var(--celeste) 22%,var(--surface));padding:12px 14px;font-size:14.5px}
.app__mail .resp small{display:block;font:600 12px/1 var(--f-body);color:var(--accent);margin-bottom:6px}
.app__pie{padding:10px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-2);text-align:center;margin:0}
.toast{position:fixed;right:20px;top:82px;z-index:60;display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center;width:min(340px,calc(100vw - 24px));padding:12px 14px;border-radius:18px;border:0;background:var(--surface);color:var(--ink);box-shadow:0 18px 40px rgba(15,42,61,.25);text-align:left;cursor:pointer;animation:baja .45s var(--spring)}
.toast b{display:block;font-size:14px}
.toast span{display:block;font-size:14px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes baja{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:none}}
@media (max-width:760px){.app{inset:0;width:auto!important;border-radius:0!important;padding:0;transform:translateY(100%)}.app__pantalla{border-radius:0!important;padding-top:env(safe-area-inset-top,0px)}dialog.glo{width:100vw;height:100dvh;border-radius:0}.glo__h{padding:16px}.glo__cuerpo{padding:14px 16px 24px}.toast{left:12px;right:12px;width:auto;top:auto;bottom:84px}}


/* Avisos de mensajes */
.avisos{position:fixed;left:50%;top:76px;z-index:44;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;border-radius:999px;background:var(--surface);color:var(--ink);border:1.5px solid var(--azafran);box-shadow:0 14px 30px rgba(15,42,61,.2);font-size:14px;font-weight:600;max-width:calc(100vw - 24px)}
.avisos.pulsa{animation:pulsa 1.2s var(--ease) 2}
@keyframes pulsa{0%,100%{box-shadow:0 14px 30px rgba(15,42,61,.2)}40%{box-shadow:0 0 0 8px rgba(242,169,0,.35),0 14px 30px rgba(15,42,61,.2)}}
.avisos span{white-space:nowrap}
.avisos button{min-height:36px;padding:0 14px;border-radius:999px;border:0;cursor:pointer;font:600 13.5px/1 var(--f-body);background:var(--azafran);color:var(--noche);white-space:nowrap}
.avisos button.wsp{background:#25A35A;color:#fff}
.toast{width:min(380px,calc(100vw - 24px));padding:14px 16px;grid-template-columns:48px minmax(0,1fr);border:2px solid var(--azafran)}
.toast small{display:block;font:600 11.5px/1 var(--f-body);color:var(--accent);margin-bottom:4px;letter-spacing:.02em}
.toast .acc{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.toast .acc b{display:inline-flex;align-items:center;min-height:34px;padding:0 14px;border-radius:999px;background:var(--azafran);color:var(--noche);font-size:13px}
.toast .acc i{display:inline-flex;align-items:center;min-height:34px;padding:0 12px;border-radius:999px;font-style:normal;font-size:13px;color:var(--ink-2);border:1px solid var(--line)}
@media (max-width:760px){.avisos{top:auto;bottom:calc(76px + env(safe-area-inset-bottom,0px));font-size:13px}.avisos span{white-space:normal}}

/* Secuencia y mensaje por armar */
.seq{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-width:640px;counter-reset:s}
.seq li{counter-increment:s;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);font-size:15.5px;transition:transform .25s var(--ease)}
.seq li::before{content:counter(s);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font:500 13px/1 var(--f-mono);color:var(--accent)}
.seq li.ok{border-color:var(--verde);background:color-mix(in srgb,var(--verde) 10%,var(--surface))}
.seq li.mal{border-color:var(--coral)}
.seq__b{display:flex;gap:4px}
.seq__b button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:16px;color:var(--ink)}
.seq__b button:disabled{opacity:.35;cursor:default}
.comp{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,340px);gap:22px;align-items:start;max-width:860px}
.comp__slot{margin:0 0 14px;padding:0;border:0}
.comp__slot legend{font-weight:600;font-size:14px;margin-bottom:8px;color:var(--ink-2)}
.comp__ops{display:grid;gap:6px}
.comp__ops button{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font:500 15px/1.4 var(--f-body);cursor:pointer;color:var(--ink)}
.comp__ops button[aria-pressed="true"]{border-color:var(--azafran);box-shadow:inset 4px 0 0 var(--azafran)}
.comp__prev{position:sticky;top:12px;padding:16px;border-radius:20px;background:var(--chat-bg);min-height:160px}
.comp__prev small{display:block;font:600 12px/1 var(--f-body);color:var(--ink-2);margin-bottom:10px}
.comp__prev p{margin:0 0 0 auto;background:var(--burbuja-yo);padding:10px 14px;border-radius:16px 4px 16px 16px;font-size:15px;line-height:1.5;min-height:3em}
.comp__prev p:empty::before{content:"Tu mensaje aparecerá aquí…";color:var(--ink-2)}
@media (max-width:860px){.comp{grid-template-columns:1fr}.comp__prev{position:static}}


/* Para tu brújula (cierre) */
.bru{display:grid;gap:18px;padding:22px 24px;border-radius:24px;background:radial-gradient(60% 120% at 100% 0%,rgba(124,198,234,.35),transparent 60%),var(--surface);border:1px solid var(--line)}
.bru__q p{margin:0 0 10px;font-weight:600}
.escala{display:flex;gap:6px;flex-wrap:wrap}
.escala button{min-width:56px;min-height:44px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer;font:600 14px/1.1 var(--f-body);display:grid;justify-items:center;gap:2px}
.escala button small{font-weight:400;font-size:11px;color:var(--ink-2)}
.escala button[aria-pressed="true"]{background:var(--azafran);border-color:var(--azafran);color:var(--noche)}
.escala button[aria-pressed="true"] small{color:var(--noche)}
.tareas{display:flex;gap:8px;flex-wrap:wrap}
.tareas button{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer;font:500 14px/1 var(--f-body)}
.tareas button[data-e="si"]{background:var(--ok-bg);border-color:var(--verde);color:var(--ok-ink)}
.tareas button[data-e="no"]{background:var(--bad-bg);border-color:var(--coral);color:var(--bad-ink)}
.tareas button[data-e="si"]::before{content:"Repetiría · "}
.tareas button[data-e="no"]::before{content:"Evitaría · "}
.bru__pie{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bru__pie span{font-size:14px;color:var(--verde);font-weight:600}

/* Pase de hora */
.pase{position:fixed;inset:0;z-index:55;display:grid;place-items:center;background:color-mix(in srgb,var(--sky) 94%,transparent);pointer-events:none;animation:pase 1.25s var(--ease) forwards}
.pase div{text-align:center;color:var(--sky-ink)}
.pase time{display:block;font:500 clamp(56px,9vw,120px)/1 var(--f-mono);letter-spacing:-.05em;color:var(--azafran);text-shadow:0 2px 0 rgba(15,42,61,.12)}
.pase b{display:block;font:800 clamp(22px,3vw,36px)/1.1 var(--f-display);letter-spacing:-.03em;margin-top:8px}
@keyframes pase{0%{opacity:0}18%{opacity:1}70%{opacity:1}100%{opacity:0}}

/* Kusi */
.kusi{position:fixed;left:20px;bottom:20px;z-index:20;display:flex;align-items:flex-end;gap:10px;pointer-events:none}
.kusi img{width:84px;height:84px;object-fit:contain;filter:drop-shadow(0 10px 16px rgba(15,42,61,.3));transition:transform .4s var(--spring)}
.kusi.habla img{animation:habla .6s var(--spring)}
@keyframes habla{0%{transform:scale(.9)}60%{transform:scale(1.08) translateY(-6px)}100%{transform:none}}
.kusi p{pointer-events:auto;max-width:260px;margin:0 0 30px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 14px;font:italic 400 16px/1.35 var(--f-voice);box-shadow:0 12px 28px rgba(15,42,61,.18);transition:opacity .3s}
.kusi p:empty{opacity:0}

/* Apertura */
.inicio{position:fixed;inset:0;z-index:80;display:grid;place-items:center;color:#EEF7FC;background:#1E4A2B;overflow:hidden;transition:clip-path 1s cubic-bezier(.7,0,.2,1);clip-path:inset(0 0 0 0)}
.inicio.fuera{clip-path:inset(0 0 100% 0)}
.inicio>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55;transform:scale(1.1);animation:acerca 12s linear forwards}
@keyframes acerca{to{transform:scale(1)}}
.inicio::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,74,43,.2),rgba(30,74,43,.85)),radial-gradient(60% 50% at 80% 10%,rgba(242,169,0,.35),transparent)}
.inicio__in{position:relative;text-align:center;padding:clamp(28px,6vw,72px) clamp(20px,6vw,72px);width:min(980px,100%)}
.inicio .inicio__dia{font:500 16px/1 var(--f-mono);color:var(--azafran);letter-spacing:.02em;margin:0;max-width:none}
.inicio h1{font:800 clamp(40px,7.2vw,104px)/.95 var(--f-display);letter-spacing:-.045em;margin:16px auto 14px;max-width:14ch;text-wrap:balance}
.inicio__reloj{font:500 clamp(30px,4.6vw,56px)/1 var(--f-mono);color:var(--azafran);letter-spacing:-.04em}
.inicio p{font:400 clamp(19px,2.2vw,26px)/1.4 var(--f-voice);margin:18px auto 26px;max-width:36ch}
.inicio .aviso{font:400 15px/1.45 var(--f-body);font-style:normal;max-width:52ch;background:rgba(238,247,252,.12);border-radius:14px;padding:10px 14px;margin-top:-8px}
.no-cap{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;background:var(--bg)}
.no-cap h1{font:800 clamp(32px,5vw,56px)/1 var(--f-display);letter-spacing:-.03em;margin:0 0 12px}

/* Cierre */
.cierre{position:fixed;inset:0;z-index:40;overflow:auto;overflow-x:hidden;background:var(--bg);display:none}
.cierre.on{display:block;animation:entra .8s var(--ease)}
.cierre__in{max-width:1100px;margin:0 auto;padding:clamp(40px,6vw,80px) 20px 120px}
.cierre__top{display:grid;grid-template-columns:minmax(0,1fr) minmax(200px,380px);gap:32px;align-items:center}
.cierre__top .recorte{max-width:380px}
.cierre__top .recorte img{aspect-ratio:16/10}
.cierre__dia{font:500 15px/1 var(--f-mono);color:var(--accent);margin:0}
.cierre h1{font:800 clamp(46px,7.5vw,104px)/.9 var(--f-display);letter-spacing:-.05em;margin:10px 0 12px}
.cierre h1 em{font:inherit;font-style:normal;color:var(--verde)}
:root[data-theme="dark"] .cierre h1 em{color:#9FD3AE}
.cierre h2{font:800 28px/1 var(--f-display);letter-spacing:-.02em;margin:52px 0 18px}
.cierre__lead{font:400 21px/1.5 var(--f-voice);color:var(--ink-2);max-width:48ch;margin:0}
.prueba{margin-top:40px;display:grid;grid-template-columns:200px minmax(0,1fr) auto;gap:24px;align-items:center;padding:20px 28px 20px 20px;border-radius:28px;background:radial-gradient(60% 120% at 100% 0%,rgba(242,169,0,.45),transparent 60%),radial-gradient(50% 100% at 0% 100%,rgba(124,198,234,.4),transparent 60%),var(--surface);border:1px solid var(--line)}
.prueba img{width:200px;aspect-ratio:1;object-fit:cover;border-radius:20px;transform:rotate(-3deg)}
.prueba h2{margin:0 0 6px;font-size:clamp(30px,3.6vw,44px);letter-spacing:-.035em}
.prueba p{margin:0;color:var(--ink-2)}
.prueba .record{display:inline-block;margin-top:10px;font:500 13px/1 var(--f-mono);color:var(--accent)}
.seis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 28px}
.seis .med{width:auto}.seis .med b{font-size:15px}.seis .med i{height:10px}
.seis .med small{display:block;font-size:13px;color:var(--ink-2);margin-top:6px}
.dec{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.dec li{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:12px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.dec time{font:500 13px/1 var(--f-mono);color:var(--ink-2)}
.volvera{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.volvera article{padding:18px;border-radius:18px;background:var(--verde-p);color:var(--cielo);transform:rotate(var(--r,0deg))}
.volvera p{margin:0;font:500 17px/1.45 var(--f-body)}
.volvera small{display:block;margin-top:10px;font-size:13px;color:var(--azafran);font-weight:600}
.reflex textarea{width:100%;max-width:640px;min-height:110px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:14px;font:400 17px/1.5 var(--f-body)}
.sigue{margin-top:48px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;padding:28px;border-radius:24px;background:var(--azafran);color:var(--noche)}
.sigue h3{font:800 34px/1 var(--f-display);margin:6px 0;letter-spacing:-.03em}
.sigue p{margin:0}
.sigue .btn{background:var(--noche);color:var(--cielo)}
.sigue .btn--sec{background:transparent;border-color:var(--noche);color:var(--noche)}
.sigue__acts{display:flex;gap:10px;flex-wrap:wrap}

/* Ponte a prueba */
.reto{position:fixed;inset:0;z-index:90;overflow:auto;background:radial-gradient(50% 40% at 85% 0%,rgba(242,169,0,.35),transparent 70%),radial-gradient(45% 40% at 0% 100%,rgba(124,198,234,.4),transparent 70%),var(--bg);color:var(--ink);animation:entra .5s var(--ease)}
.reto__in{max-width:980px;min-height:100%;margin:0 auto;padding:clamp(20px,4vw,48px) 20px 40px;display:flex;flex-direction:column;gap:20px}
.reto__top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.reto__top p{margin:0;font:500 14px/1 var(--f-mono);color:var(--ink-2)}
.reto__pts{font:800 22px/1 var(--f-display)!important;color:var(--ink)!important}
.reto__pts.sube{animation:pop .5s var(--spring)}
@keyframes pop{50%{transform:scale(1.25)}}
.reto__barra{height:10px;border-radius:10px;background:var(--line);overflow:hidden}
.reto__barra i{display:block;height:100%;background:var(--azafran);transform-origin:0 50%;border-radius:10px}
.reto__q{font:800 clamp(28px,4.4vw,52px)/1.05 var(--f-display);letter-spacing:-.035em;margin:10px 0 6px;text-wrap:balance}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;align-items:center;min-height:96px;padding:16px 20px;border-radius:20px;border:0;cursor:pointer;text-align:left;font:600 clamp(16px,1.6vw,19px)/1.3 var(--f-body);box-shadow:0 6px 0 rgba(15,42,61,.18);transition:transform .15s var(--ease),opacity .3s,box-shadow .15s}
.tile:hover{transform:translateY(-3px)}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(15,42,61,.18)}
.tile svg{width:40px;height:40px}
.t0{background:var(--azafran);color:var(--noche)}.t1{background:var(--verde);color:#fff}.t2{background:var(--celeste);color:var(--noche)}.t3{background:var(--coral);color:#fff}
.tile.apaga{opacity:.28}
.tile.bien{outline:4px solid var(--ok-ink);outline-offset:3px}
.tile.tuya{outline:4px dashed var(--bad-ink);outline-offset:3px}
.reto__por{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 20px;border-radius:20px;background:var(--surface);border:1px solid var(--line);animation:sube .4s var(--ease)}
.reto__por b{font:800 20px/1 var(--f-display)}
.reto__por p{margin:0;font-size:15.5px}
.reto__fin{text-align:center;display:grid;justify-items:center;gap:10px;padding-top:10px}
.reto__fin img{width:min(280px,70vw);aspect-ratio:1;object-fit:cover;border-radius:28px;transform:rotate(-3deg);box-shadow:0 20px 40px rgba(15,42,61,.2)}
.reto__fin h2{font:800 clamp(40px,6vw,72px)/.95 var(--f-display);letter-spacing:-.045em;margin:14px 0 0}
.reto__fin .grande{font:500 clamp(44px,7vw,80px)/1 var(--f-mono);color:var(--azafran);letter-spacing:-.05em}
.reto__fin p{margin:0;color:var(--ink-2);max-width:46ch}
.reto__acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.chispa{position:fixed;width:10px;height:14px;z-index:95;pointer-events:none;border-radius:2px;animation:cae 1.6s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes cae{to{transform:translate(var(--dx),110vh) rotate(var(--rot));opacity:.6}}

/* Responsive */
.movil{display:none}
@media (max-width:1180px){.med{width:92px}.bar{gap:12px}.bar__cap span{display:none}}
@media (max-width:1100px){.mesa{grid-template-columns:250px minmax(0,1fr)}.lado{display:none}.lado.abierto{display:block;position:fixed;right:12px;top:80px;bottom:80px;width:min(340px,92vw);z-index:30}.movil{display:flex}}
@media (max-width:760px){
  body{overflow:auto}
  .bar{position:sticky;top:0;z-index:15;height:auto;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;row-gap:10px;column-gap:10px;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"izq izq tools" "reloj meds meds";background:var(--sky);transition:background 1.4s ease}
  .bar__izq{grid-area:izq}.tools{grid-area:tools}.reloj{grid-area:reloj}.meds{grid-area:meds;gap:8px}
  .reloj__pista,.reloj__fin{display:none}.reloj time{font-size:18px;min-width:0}
  .med{flex:1;width:auto}.med b{font-size:11.5px}
  .tool{width:40px;height:40px}
  .salir{padding:0 12px}
  .bar__cap{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mesa{grid-template-columns:1fr;height:auto;padding:0 10px 96px}
  .escena{overflow:visible}
  .bandeja{display:none}.bandeja.abierta{display:block;position:fixed;left:12px;right:12px;top:150px;bottom:80px;z-index:30}
  .mirada__abrir{grid-template-columns:76px minmax(0,1fr) 44px;gap:12px;padding:12px}
  .mirada__abrir img{width:76px;height:76px}
  .mirada__mas{width:44px;height:44px}
  .mirada__in{padding:4px 14px 18px}
  .norma__b{grid-template-columns:1fr}.norma__b div+div{border-left:0;border-top:1px solid var(--line)}
  .dg-linea li{grid-template-columns:1fr;gap:2px}
  .dg-cambio li{grid-template-columns:1fr;gap:4px}.dg-cambio i{transform:rotate(90deg);justify-self:start;margin-left:14px}
  .dg-bal__cols{grid-template-columns:1fr}
  .seis{grid-template-columns:1fr 1fr}
  .sigue,.cierre__top{grid-template-columns:1fr}
  .prueba{grid-template-columns:1fr;padding:18px}.prueba img{width:100%;aspect-ratio:16/9}
  .tiles{grid-template-columns:1fr}.tile{min-height:72px}
  .reto__por{grid-template-columns:1fr}
  .kusi img{width:56px;height:56px}.kusi{left:auto;right:10px;bottom:76px;flex-direction:row-reverse}.kusi p{max-width:200px;font-size:14.5px;margin-bottom:24px;border-radius:16px 16px 4px 16px}
}
.movil{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:25;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px;box-shadow:0 12px 30px rgba(15,42,61,.2)}
.movil button{min-height:44px;padding:0 18px;border-radius:999px;border:0;background:none;font-weight:600;cursor:pointer;white-space:nowrap}
.movil button[aria-expanded="true"]{background:var(--ink);color:var(--surface)}
@media (min-width:761px){.movil .solo-cel{display:none}}
.rm *,.rm *::before,.rm *::after{animation:none!important;transition:none!important}
</style>
<script>if (matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('rm');
try { const t = localStorage.getItem('vivelo-tema'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body>
<div class="inicio" id="inicio" role="dialog" aria-modal="true" aria-labelledby="iniT">
  <img id="iniImg" src="assets/d-lunes.webp" alt="">
  <div class="inicio__in">
    <p class="inicio__dia" id="iniDia">Capítulo</p>
    <h1 id="iniT">…</h1>
    <div class="inicio__reloj" id="iniReloj" aria-hidden="true">07:30</div>
    <p id="iniTxt"></p>
    <p class="aviso" id="iniAviso" hidden></p>
    <button class="btn" id="entrar" type="button">Empezar</button>
  </div>
</div>

<header class="bar">
  <div class="bar__izq">
    <a class="salir" id="salir" href="temporada.html" aria-label="Salir del capítulo y volver a la temporada">Salir</a>
    <p class="bar__cap" id="barCap">Capítulo</p>
  </div>
  <div class="reloj" aria-label="Reloj de la jornada">
    <time id="hora">07:30</time>
    <div class="reloj__pista"><div class="reloj__fill" id="relojFill"></div><div class="reloj__sol" id="relojSol"></div></div>
    <span class="reloj__fin" id="relojFin">21:30</span>
  </div>
  <div class="meds" id="meds" aria-live="polite"></div>
  <div class="tools">
    <button class="tool" type="button" id="tGlo" aria-label="Abrir el glosario" title="Glosario"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M8 7h7M8 11h5"/></svg></button>
    <button class="tool" type="button" id="tMail" aria-label="Abrir tu correo" aria-expanded="false" aria-controls="app" title="Correo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg><span class="badge" id="badgeMail"></span></button>
    <button class="tool" type="button" id="tCel" aria-label="Abrir tu WhatsApp" aria-expanded="false" aria-controls="app" title="WhatsApp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></svg><span class="badge" id="badge"></span></button>
    <button class="tool" type="button" id="tSon" aria-pressed="true" aria-label="Sonido" title="Sonido"><svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg><svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 10l4 4M21 10l-4 4"/></svg></button>
  </div>
</header>

<main class="mesa">
  <aside class="panel bandeja" id="bandeja" aria-label="Bandeja del día">
    <h2>Tu día</h2>
    <ol id="lista"></ol>
    <p class="bandeja__mas" id="faltan"></p>
  </aside>
  <section class="panel escena" id="escena" aria-live="polite"></section>
  <aside class="panel lado" id="lado" aria-label="Cartera y personas">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabC" aria-selected="true" aria-controls="cartera" type="button">Tu cartera</button>
      <button class="tab" role="tab" id="tabP" aria-selected="false" aria-controls="personas" type="button">Personas</button>
    </div>
    <ul class="cart" id="cartera" role="tabpanel" aria-labelledby="tabC"></ul>
    <ul class="gentes" id="personas" role="tabpanel" aria-labelledby="tabP" hidden></ul>
  </aside>

const cumple = o => (!o.si || [].concat(o.si).every(F.has)) && (!o.no || ![].concat(o.no).some(F.has));

// ---------- Sonido (WebAudio, sin archivos) ----------

  if (!sonOn) return; const c = ac(); if (!c) return;
  const t0 = c.currentTime + at, g = c.createGain();
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + .015); g.gain.setValueAtTime(vol, Math.max(t0 + .02, t0 + dur - .05)); g.gain.linearRampToValueAtTime(0, t0 + dur);

};
const voz = (txt, lang = 'es-PE') => new Promise(r => {
  if (!sonOn || !('speechSynthesis' in window)) return r();

const pintarSon = () => $('tSon').setAttribute('aria-pressed', String(sonOn));
$('tSon').addEventListener('click', () => { sonOn = !sonOn; try { localStorage.setItem('vivelo-sonido', sonOn ? 'on' : 'off'); } catch {} pintarSon(); if (sonOn) SND.abre(); else if ('speechSynthesis' in window) speechSynthesis.cancel(); });
pintarSon();

// ---------- Reloj y cielo ----------
const mins = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const fmt = m => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
const M0 = mins(CAP.inicio), M1 = mins(CAP.fin);
let ahora = M0;
const CIELO = [[600, '#DDF0FA', '#0D2433'], [840, '#EEF7FC', '#0B1F2D'], [1080, '#E8F2E2', '#10261E'], [1200, '#D3E7D1', '#0F2A20'], [9999, '#173B2A', '#081A12']];
const oscuro = () => document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
const pintarCielo = m => { const c = CIELO.find(([lim]) => m < lim); document.body.style.setProperty('--sky', oscuro() ? c[2] : c[1]); document.body.classList.toggle('noche', m >= 1200 || oscuro()); if (m >= 1200 && !oscuro()) document.body.style.setProperty('--sky-ink', '#EEF7FC'); else document.body.style.removeProperty('--sky-ink'); };
const irHora = t => {
  const dest = mins(t), desde = ahora; ahora = Math.max(ahora, dest);
  const p = Math.max(0, Math.min(1, (dest - M0) / (M1 - M0)));
  $('relojFill').style.transform = `scaleX(${p})`; $('relojSol').style.left = `${p * 100}%`;
  pintarCielo(dest); entregar();
  if (reduced) { $('hora').textContent = fmt(dest); return; }
  const t0 = performance.now(), dur = 900;
  const paso = now => { const k = Math.min(1, (now - t0) / dur); $('hora').textContent = fmt(Math.round(desde + (dest - desde) * k)); if (k < 1) requestAnimationFrame(paso); };
  requestAnimationFrame(paso); setTimeout(() => ($('hora').textContent = fmt(dest)), dur + 60);
};

// ---------- Medidores ----------
const pintarMeds = (show, fx = {}) => {

};

let kusiT;
const kusi = (mood, txt) => {
  $('kusiImg').src = `assets/kusi-${mood}.webp`; $('kusiTxt').textContent = txt || '';
  const k = $('kusi'); k.classList.remove('habla'); void k.offsetWidth; k.classList.add('habla');
  clearTimeout(kusiT); kusiT = setTimeout(() => ($('kusiTxt').textContent = ''), 7000);
};

// ---------- Glosario ----------
let vistos = new Set(); try { vistos = new Set(JSON.parse(localStorage.getItem('vivelo-glo') || '[]')); } catch {}
const marcarVisto = t => { if (vistos.has(t)) return; vistos.add(t); try { localStorage.setItem('vivelo-glo', JSON.stringify([...vistos])); } catch {} };
const FORMAS = Object.keys(ENTRADA).sort((a, b) => b.length - a.length);
const RX = new RegExp(`(?<![\\p{L}\\d])(${FORMAS.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|')})(?![\\p{L}\\d])`, 'giu');
const catIco = c => `<svg viewBox="0 0 24 24" aria-hidden="true">${CATS[c].ico}</svg>`;
function glosar(root, usados) {
  if (!root) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: nd => nd.parentElement.closest('button,.gl,a,script,textarea,.no-gl') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  const nodos = []; while (w.nextNode()) nodos.push(w.currentNode);
  for (const nodo of nodos) {
    const txt = nodo.nodeValue; let m, last = 0, frag = null; RX.lastIndex = 0;
    while ((m = RX.exec(txt))) {
      const e = ENTRADA[m[1].toLowerCase()]; if (!e || usados.has(e.t)) continue; usados.add(e.t);
      frag ||= document.createDocumentFragment();
      frag.append(txt.slice(last, m.index));
      const b = document.createElement('button'); b.type = 'button'; b.className = 'gl'; b.dataset.t = e.t; b.textContent = m[1]; b.setAttribute('aria-label', `${m[1]}: ver qué significa`);
      frag.append(b); last = m.index + m[0].length;
    }
    if (frag) { frag.append(txt.slice(last)); nodo.replaceWith(frag); }
  }
}
const entradaDe = t => TERMINOS.find(x => x.t === t);
let pop = null;
const cerrarPop = () => { pop?.remove(); pop = null; };
document.addEventListener('click', ev => {

// ---------- Apps: WhatsApp y Correo (se conservan entre capítulos) ----------
const CHATS = { ...(prev?.chats || {}), ...(mod.CHATS || {}) };
const BUZON = (prev?.wsp || []).map(m => ({ ...m, viejo: true }));
const MAILS = (prev?.mail || []).map(m => ({ ...m, viejo: true }));

const fotoChat = (id) => { const c = quienDe(id); if (c.who && PERSONAS[c.who]) return `<span class="ini">${avatar(PERSONAS[c.who], 44)}</span>`; return `<span class="ini" style="background:${c.c || '#2F6B3F'}">${esc((c.n || '?').trim()[0])}</span>`; };

  const t = Object.keys(CHATS).reduce((a, id) => a + Math.max(0, BUZON.filter(m => m.chat === id && !m.yo).length - (leidos[id] || 0)), 0);

    r.scrollTop = 0; r.querySelector('#rX').addEventListener('click', salir);
    const t0 = performance.now();
    const barra = now => { const f = Math.max(0, 1 - (now - t0) / (SEG * 1000)); const b = r.querySelector('#rBar'); if (b) b.style.transform = `scaleX(${f})`; if (f > 0 && !respondida) raf = requestAnimationFrame(barra); };
    raf = requestAnimationFrame(barra);
    timer = setInterval(() => { resto--; if (resto <= 5 && resto > 0) SND.tic(); if (resto <= 0) responder(-1); }, 1000);
    const responder = i => {
      if (respondida) return; respondida = true; clearInterval(timer); cancelAnimationFrame(raf);
      const ok = i >= 0 && p.ord[i].ok, ganado = ok ? Math.round(500 + 500 * Math.max(0, (SEG * 1000 - (performance.now() - t0)) / (SEG * 1000))) : 0;
      pts += ganado; if (ok) aciertos++;
      r.querySelectorAll('.tile').forEach((b, j) => { b.disabled = true; if (p.ord[j].ok) b.classList.add('bien'); else if (j === i) b.classList.add('tuya'); else b.classList.add('apaga'); });
      ok ? SND.bien() : SND.mal();
      const pe = r.querySelector('#rPts'); pe.textContent = `${pts} pts`; pe.classList.remove('sube'); void pe.offsetWidth; if (ok) pe.classList.add('sube');
      r.querySelector('#rPor').innerHTML = `<div class="reto__por"><b>${ok ? `¡Bien! +${ganado}` : i < 0 ? 'Se acabó el tiempo' : 'No era esa'}</b><p>${esc(p.por)}</p><button class="btn" type="button" id="rSig">${k < preguntas.length - 1 ? 'Siguiente' : 'Ver mi resultado'}</button></div>`;
      r.querySelector('#rSig').focus();
      r.querySelector('#rSig').addEventListener('click', () => { k++; k < preguntas.length ? pregunta() : final(); });
    };
    r.querySelectorAll('.tile').forEach(b => b.addEventListener('click', () => responder(+b.dataset.i)));
    r.querySelector('.tile').focus();
  };
  const final = () => {
    const prevBest = SEL.reto[n] || 0; const record = pts > prevBest;
    if (record) { SEL.reto[n] = pts; guardar(); }
    const msj = aciertos === preguntas.length ? '¡Qué divino! Todo correcto.' : aciertos >= preguntas.length - 1 ? '¡Qué bacán! Casi perfecto.' : aciertos >= preguntas.length / 2 ? 'Bien. Repasa las que fallaste y vuelve a intentarlo.' : 'Este día tuvo mucho. Vuelve a intentarlo: así se aprende.';
    r.innerHTML = `<div class="reto__in"><div class="reto__fin"><img src="${aciertos >= preguntas.length - 1 ? azar(CELEBRA) : 'assets/esc/logro.webp'}" alt=""><h2>${esc(msj)}</h2><div class="grande">${pts}</div><p>${aciertos} de ${preguntas.length} correctas${record ? ' · tu mejor puntaje en este capítulo' : prevBest ? ` · tu récord es ${prevBest}` : ''}</p><div class="reto__acts"><button class="btn" type="button" id="rOtra">Intentarlo de nuevo</button><button class="btn btn--sec" type="button" id="rFin">Volver al resumen</button></div></div></div>`;
    r.querySelector('#rOtra').addEventListener('click', () => { salir(); reto(); });
    r.querySelector('#rFin').addEventListener('click', salir); r.querySelector('#rFin').focus();
    if (aciertos === preguntas.length) chispas();
    kusi(aciertos >= preguntas.length - 1 ? 'celebra' : 'animo', msj);
  };
  pregunta();
}
function chispas() {
  if (reduced) return;
  const cs = ['#F2A900', '#2F6B3F', '#7CC6EA', '#E4572E'];
  for (let i = 0; i < 70; i++) { const c = document.createElement('i'); c.className = 'chispa'; c.style.cssText = `left:${Math.random() * 100}vw;top:-20px;background:${cs[i % 4]};--dx:${(Math.random() - .5) * 200}px;--rot:${Math.random() * 720}deg;animation-delay:${Math.random() * .6}s`; document.body.append(c); setTimeout(() => c.remove(), 2400); }
}
function pintarPrueba() { const el = $('pruebaRec'); if (el) el.textContent = SEL.reto[n] ? `Tu mejor puntaje: ${SEL.reto[n]} pts` : ''; }

// ---------- Guardar ----------
function guardar() { try { localStorage.setItem(KEY, JSON.stringify(SEL)); } catch {} }
const limpiar = l => l.map(({ viejo, _ok, ...m }) => m);

// ---------- Cierre del día ----------
const BRU = { all: {}, e: {} };
function cargarBru() {
  try { BRU.all = JSON.parse(localStorage.getItem('vivelo-brujula') || '{}') || {}; } catch { BRU.all = {}; }
  BRU.all.entries ||= {};
  const k = `${pid}-${n}`;
  BRU.e = BRU.all.entries[k] || { pid, n, puesto: P.nombre, titulo: CAP.titulo, area: AREA[pid], repeat: [], avoid: [] };
  BRU.all.entries[k] = BRU.e;
}
function guardarBru() {
  const q = { buena: 0, aceptable: 0, riesgosa: 0 }; S.hechos.forEach(h => { if (h?.res?.q) q[h.res.q]++; });
  Object.assign(BRU.e, { med: { ...S.med }, q, at: Date.now() });
  try { localStorage.setItem('vivelo-brujula', JSON.stringify(BRU.all)); } catch {}
  const ok = $('bruOk'); if (ok) ok.textContent = 'Guardado en tu brújula.';
}
function conectarBru() {
  const box = $('bru'); if (!box) return;
  box.querySelectorAll('.escala').forEach(g => g.addEventListener('click', ev => {
    const b = ev.target.closest('[data-v]'); if (!b) return;
    BRU.e[g.dataset.k] = +b.dataset.v; g.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); guardarBru();
  }));
  box.querySelector('.tareas').addEventListener('click', ev => {
    const b = ev.target.closest('[data-t]'); if (!b) return;
    const t = b.dataset.t, sig = { '': 'si', si: 'no', no: '' }[b.dataset.e || ''];
    b.dataset.e = sig;
    BRU.e.repeat = (BRU.e.repeat || []).filter(x => x !== t); BRU.e.avoid = (BRU.e.avoid || []).filter(x => x !== t);
    if (sig === 'si') BRU.e.repeat.push(t); if (sig === 'no') BRU.e.avoid.push(t);
    guardarBru();
  });
  guardarBru();
}
function cierre() {
  cargarBru();
  const horaC = CAP.cierreHora || fmt(Math.min(M1, ahora + 10)); irHora(horaC);
  SEL.hecho = Math.max(SEL.hecho || 0, n);
  SEL.caps[n] = { med: S.med, rel: S.rel, flags: [...S.flags], cartera: S.cartera.map(({ id, e }) => ({ id, e })), wsp: limpiar(BUZON), mail: limpiar(MAILS).map(m => ({ ...m, leido: true })), chats: CHATS };
  guardar();
  const lectura = { confianza: 'Cómo te ven tu jefa y los jefes', calidad: 'Qué tan bien quedó tu trabajo', tiempo: 'Tu agenda y la de los demás', cumplimiento: 'Ley y políticas', personas: 'Cómo viven el proceso los demás', etica: 'Justicia de tus decisiones' };
  const vuelve = [...S.flags].filter(f => FUTURO[f]).map((f, k) => `<article style="--r:${(k % 2 ? 1 : -1) * 1.2}deg"><p>${esc(FUTURO[f][0])}</p>${FUTURO[f][1] ? `<small>${esc(FUTURO[f][1])}</small>` : ''}</article>`).join('');
  const rels = relVisibles.map(id => { const a = S.rel0[id], b = S.rel[id]; return `<li>${avatar(PERSONAS[id], 52)}<div><b>${esc(PERSONAS[id].n.replace('Ing. ', ''))}</b><small>${REL[a + 2]}${a !== b ? ` → <strong>${REL[b + 2]}</strong>` : ', sin cambios'}</small></div></li>`; }).join('');
  const kRef = `${KEY}-c${n}-reflexion`; let refl = ''; try { refl = localStorage.getItem(kRef) || ''; } catch {}
  const sigN = CAP.siguiente, hay = sigN && sigN.n <= LISTOS;
  const bloqueado = sigN && !P.completa && sigN.n > 1;
  $('cierre').innerHTML = `<div class="cierre__in">
    <div class="cierre__top"><div><p class="cierre__dia">${esc(CAP.dia)} · ${horaC}</p>
    <h1 id="cierreT">Fin del día <em>«${esc(CAP.titulo)}»</em></h1>
    <p class="cierre__lead">${nombre ? esc(nombre) + ': ' : ''}${esc(CAP.lead || '')}</p></div>
    <figure class="recorte" style="margin:0"><img src="${S.med.etica >= 50 && S.med.personas >= 50 ? azar(CELEBRA) : 'assets/esc/escalera.webp'}" alt=""></figure></div>
    ${QUIZ.length ? `<div class="prueba"><img src="assets/esc/logro.webp" alt=""><div><h2>Ponte a prueba</h2><p>${QUIZ.length} preguntas rápidas sobre lo que viviste hoy. ${SEG} segundos cada una: mientras más rápido, más puntos.</p><span class="record" id="pruebaRec"></span></div><button class="btn" type="button" id="abrirReto">Empezar el reto</button></div>` : ''}
    <h2>Cómo terminó tu día</h2>
    <div class="seis">${Object.keys(S.med).map(k => `<div class="med"><b>${MED[k][0]}<span>${S.med[k]}</span></b><i style="--s:${S.med[k] / 100};--c:${MED[k][1]}"></i><small>${lectura[k]}</small></div>`).join('')}</div>
    <h2>Tu gente</h2><ul class="gentes" style="padding:0;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))">${rels}</ul>
    <h2>Tus decisiones</h2><ol class="dec">${S.hechos.map((h, k) => `<li><time>${escenaDe(k).t}</time><span>${esc(escenaDe(k).titulo)}</span>${h.res.q ? `<span class="fb__q ${Q[h.res.q][1]}" style="margin:0">${Q[h.res.q][0]}</span>` : '<span></span>'}</li>`).join('')}</ol>
    ${vuelve ? `<h2>Esto volverá</h2><div class="volvera">${vuelve}</div>` : ''}
    <h2>Para tu brújula</h2>
    <div class="bru" id="bru">
      <div class="bru__q"><p>¿Cuánto disfrutaste este día?</p><div class="escala" data-k="enjoy">${[['1', 'Nada'], ['2', 'Poco'], ['3', 'Algo'], ['4', 'Bastante'], ['5', 'Mucho']].map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${BRU.e.enjoy == v}">${v}<small>${l}</small></button>`).join('')}</div></div>
      <div class="bru__q"><p>¿Te ves haciendo este trabajo?</p><div class="escala" data-k="see">${[['1', 'Para nada'], ['2', 'Poco'], ['3', 'Quizás'], ['4', 'Sí'], ['5', 'Totalmente']].map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${BRU.e.see == v}">${v}<small>${l}</small></button>`).join('')}</div></div>
      <div class="bru__q"><p>Toca cada tarea una vez si la repetirías y dos veces si la evitarías.</p><div class="tareas">${(TAREAS[AREA[pid]] || []).map(t => `<button type="button" data-t="${esc(t)}" data-e="${BRU.e.repeat?.includes(t) ? 'si' : BRU.e.avoid?.includes(t) ? 'no' : ''}">${esc(t)}</button>`).join('')}</div></div>
      <div class="bru__pie"><a class="btn btn--sec" href="brujula.html">Ver mi brújula</a><span id="bruOk" aria-live="polite"></span></div>
    </div>
    <h2>Para ti</h2>
    <div class="reflex"><label for="refl" style="display:block;font:800 24px/1.2 var(--f-display);letter-spacing:-.02em;margin-bottom:12px">${esc(CAP.reflexion || '¿Qué fue lo que más te sorprendió de este día?')}</label><textarea id="refl" placeholder="Escribe con tus palabras. Solo lo ves tú.">${esc(refl)}</textarea><p class="err" id="reflOk" style="color:var(--verde)" aria-live="polite"></p><button class="btn btn--sec" type="button" id="guardar">Guardar mi respuesta</button></div>
    ${sigN ? `<div class="sigue"><div><p style="font-weight:600">Capítulo ${sigN.n} · ${esc(sigN.dia)}</p><h3>${esc(sigN.titulo)}</h3><p>${bloqueado ? 'El resto del mes está incluido en el pase anual de S/ 20.' : hay ? 'Tus decisiones, tus chats y tus correos de hoy viajan contigo.' : 'Este capítulo se está escribiendo.'}</p></div><div class="sigue__acts">${hay && !bloqueado ? `<a class="btn" href="${linkCap(sigN.n)}">Empezar el capítulo ${sigN.n}</a>` : ''}<a class="btn ${hay && !bloqueado ? 'btn--sec' : ''}" href="temporada.html#${pid}">Volver a la temporada</a><button class="btn btn--sec" type="button" id="repetir">Repetir el día</button></div></div>` : ''}
  </div>`;
  $('cierre').classList.add('on'); $('cierre').scrollTop = 0; $('avisos').hidden = true; cerrarToast(); cerrarApp();
  pintarPrueba();
  kusi(S.med.etica >= 50 && S.med.personas >= 50 ? 'celebra' : 'animo', `${CAP.titulo}: listo. ¿Te animas a ponerte a prueba?`);
  $('abrirReto')?.addEventListener('click', reto);
  conectarBru();
  $('guardar').addEventListener('click', () => { try { localStorage.setItem(kRef, $('refl').value); } catch {} $('reflOk').textContent = 'Guardado en este dispositivo.'; });
  $('refl').addEventListener('input', () => ($('reflOk').textContent = ''));
  $('repetir')?.addEventListener('click', () => location.reload());
}

// ---------- Paneles en pantallas pequeñas ----------
const cerrarPaneles = () => { $('bandeja').classList.remove('abierta'); $('lado').classList.remove('abierto'); $('mBandeja').setAttribute('aria-expanded', 'false'); $('mLado').setAttribute('aria-expanded', 'false'); };
$('mBandeja').addEventListener('click', () => { const on = !$('bandeja').classList.contains('abierta'); cerrarPaneles(); if (on) { $('bandeja').classList.add('abierta'); $('mBandeja').setAttribute('aria-expanded', 'true'); } });
$('mLado').addEventListener('click', () => { const on = !$('lado').classList.contains('abierto'); cerrarPaneles(); if (on) { $('lado').classList.add('abierto'); $('mLado').setAttribute('aria-expanded', 'true'); } });

// ---------- Apertura ----------
$('barCap').innerHTML = `${esc(CAP.titulo)}<span>${esc(P.nombre)}</span>`;
$('relojFin').textContent = CAP.fin;
$('iniImg').src = CAP.foto || 'assets/foto2/caminan.webp';
$('iniDia').textContent = `${P.nombre} · Capítulo ${n} · ${CAP.dia}`;
$('iniT').textContent = CAP.titulo;
$('iniTxt').textContent = CAP.apertura || CAP.lugar;
$('entrar').textContent = CAP.boton || 'Empezar el día';
if (n > 1 && !prev) { $('iniAviso').hidden = false; $('iniAviso').textContent = `No encontramos tus decisiones del capítulo ${n - 1} en este dispositivo. Empezarás desde un punto neutral.`; }
else if (prev) { $('iniAviso').hidden = false; $('iniAviso').textContent = `Tus decisiones del capítulo ${n - 1} vienen contigo: medidores, relaciones, chats y correos.`; }
S.visitas = [ESCENAS.findIndex(cumple)];
pintarCielo(M0); pintarCartera(); pintarPersonas(); pintarMeds(escenaDe(0).show); pintarBandeja(0); pintarEscena(); pintarBadges();
const ini = $('inicio');
if (!reduced) { let m = M0; const iv = setInterval(() => { m++; if (!$('iniReloj')) return clearInterval(iv); $('iniReloj').textContent = fmt(m); if (m >= mins(escenaDe(0).t)) clearInterval(iv); }, 60); }
else $('iniReloj').textContent = escenaDe(0).t;
$('entrar').focus();
$('entrar').addEventListener('click', () => {
  ac(); ini.classList.add('fuera'); setTimeout(() => ini.remove(), reduced ? 0 : 1000);
  irHora(escenaDe(0).t); llegaEscena(escenaDe(0));
  kusi('animo', CAP.kusi || `${nombre ? '¡' + nombre + ', h' : '¡H'}oy empiezas! Te acompaño todo el día.`);
});

// Revisión interna: #c1-d5 avanza 5 escenas (-m abre el análisis, -w el WhatsApp, -e el correo, -q el cierre, -qq el reto).
if (demo) (async () => {
  const w = ms => new Promise(r => setTimeout(r, ms));
  const sonAntes = sonOn; sonOn = false;
  $('entrar').click(); await w(60);
  for (let k = 0; k < demo; k++) {
    const e = escenaDe(S.actual);
    if (e.type === 'ask') { const b = [...document.querySelectorAll('#opts .opc')]; b.slice(0, e.max).forEach(x => x.click()); $('seguirAsk').click(); }
    else if (e.type === 'pick') { [...document.querySelectorAll('#act tbody input')].slice(0, e.n).forEach(x => x.click()); $('ok').click(); }
    else if (e.type === 'flag') { e.lines.filter(l => l.bad).forEach(l => document.querySelector(`.linea[data-id="${l.id}"]`).click()); $('ok').click(); }
    else if (e.type === 'builder') { e.bloques.forEach(bq => bq.ops.filter(o => o.ok).slice(0, bq.n).forEach(o => document.querySelector(`.linea[data-b="${bq.id}"][data-id="${o.id}"]`).click())); $('ok').click(); }
    else if (e.type === 'secuencia') { $('ok').click(); }
    else if (e.type === 'compose') { e.slots.forEach(sl => document.querySelector(`[data-s="${sl.id}"][data-id="${(sl.ops.find(o => o.ok === true) || sl.ops[0]).id}"]`).click()); $('ok').click(); }
    else if (e.type === 'calls') { $('llamar').click(); for (let t = 0; t < 200 && !document.querySelector('#tras .opc'); t++) await w(100); document.querySelector('#tras .opc').click(); }
    else document.querySelector('#act .opc').click();
    if (!$('seguir')) break;
    if (k < demo - 1) { $('seguir').click(); await w(300); }
  }
  sonOn = sonAntes;
  if (/-m/.test(extra)) { document.querySelector('.mirada__abrir')?.click(); await w(300); }
  if (/-w/.test(extra)) abrirApp('wsp', BUZON.at(-1)?.chat);
  if (/-e/.test(extra)) abrirApp('mail');
  if (/-q/.test(extra)) { $('seguir')?.click(); await w(300); if (/-qq/.test(extra)) reto(); }
})();
</script>
